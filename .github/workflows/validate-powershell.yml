name: Validate PowerShell

on:
  workflow_dispatch:
  push:
    branches:
      - Main
    paths:
      - "WMT-GUI.ps1"
      - "PS2EXE/**/*.ps1"
      - ".github/workflows/validate-powershell.yml"
  pull_request:
    branches:
      - Main
    paths:
      - "WMT-GUI.ps1"
      - "PS2EXE/**/*.ps1"
      - ".github/workflows/validate-powershell.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact commit
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$env:GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
              ".\WMT-GUI.ps1",
              ".\PS2EXE\Build-Exe.ps1"
          )

          $failed = $false
          foreach ($file in $files) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  Write-Error "Missing expected PowerShell file: $file"
                  $failed = $true
                  continue
              }

              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path -LiteralPath $file).Path,
                  [ref]$tokens,
                  [ref]$parseErrors
              )

              if ($parseErrors -and $parseErrors.Count -gt 0) {
                  $failed = $true
                  Write-Host ""
                  Write-Host "Parse errors in $file" -ForegroundColor Red
                  foreach ($err in $parseErrors) {
                      Write-Host ("{0}:{1}: {2}" -f $err.Extent.StartLineNumber, $err.Extent.StartColumnNumber, $err.Message) -ForegroundColor Red
                  }
              }
              else {
                  Write-Host "OK: $file"
              }
          }

          if ($failed) {
              throw "PowerShell syntax validation failed."
          }

      - name: Smoke test process timeouts and output capture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          $sourcePath = (Resolve-Path '.\WMT-GUI.ps1').Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($sourcePath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors.Message -join '; ') }
          $processFunction = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Invoke-WmtProcess'
          }, $true)
          if (-not $processFunction) { throw 'Invoke-WmtProcess was not found.' }
          Invoke-Expression $processFunction.Extent.Text
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $success = Invoke-WmtProcess -FilePath $exe -Arguments '-NoProfile -Command "Write-Output WMT_PROCESS_OK"' -TimeoutMs 20000 -Encoding UTF8 -KillTree
          if ($success.ExitCode -ne 0 -or $success.TimedOut -or $success.OutputReadTimedOut -or
              $success.TerminationFailed -or $success.StdOut -notmatch 'WMT_PROCESS_OK') {
              throw ("Normal process output capture failed: " + ($success | ConvertTo-Json -Compress))
          }
          $stopwatch = [Diagnostics.Stopwatch]::StartNew()
          $timeoutResult = Invoke-WmtProcess -FilePath $exe -Arguments '-NoProfile -Command "Start-Sleep -Seconds 20"' -TimeoutMs 2500 -Encoding UTF8 -KillTree
          $stopwatch.Stop()
          if (-not $timeoutResult.TimedOut) { throw 'Timed-out process did not report a timeout.' }
          if ($stopwatch.Elapsed.TotalSeconds -gt 18) {
              throw ("Timed-out process blocked for {0:N1} seconds." -f $stopwatch.Elapsed.TotalSeconds)
          }
          if (-not $timeoutResult.PSObject.Properties['TerminationFailed'] -or
              -not $timeoutResult.PSObject.Properties['OutputReadTimedOut']) {
              throw 'Termination/output-read diagnostics are missing.'
          }
          Write-Host 'PASS: Process output capture and bounded termination.'

      - name: Smoke test custom command transcript and provider routing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourcePath = (Resolve-Path '.\WMT-GUI.ps1').Path
          $source = [IO.File]::ReadAllText($sourcePath)
          $tokens = $null
          $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($sourcePath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors.Message -join '; ') }

          $captureFunction = $ast.Find({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'ConvertTo-WmtCapturedCustomPowerShellCommand'
          }, $true)
          if (-not $captureFunction) { throw 'Custom command native-output capture helper not found.' }
          Invoke-Expression $captureFunction.Extent.Text

          # Execute the actual visible-command routing statements with an isolated
          # fake package instead of launching WMT or contacting a package server.
          $sourceLines = @($source -split '\r?\n')
          $routeStart = -1
          $routeEnd = -1
          for ($i = 0; $i -lt $sourceLines.Count; $i++) {
              if ($sourceLines[$i] -match '^\s*\$visibleCommand\s*=\s*\$cmd\s*$') { $routeStart = $i }
              if ($routeStart -ge 0 -and $sourceLines[$i] -match '^\s*\$visibleTranscriptPath\s*=\s*if\s') {
                  $routeEnd = $i
                  break
              }
          }
          if ($routeStart -lt 0 -or $routeEnd -le $routeStart) { throw 'Visible command routing block not found.' }
          $routeBlock = ($sourceLines[($routeStart..$routeEnd)] -join [Environment]::NewLine)

          $logPath = [IO.Path]::GetTempFileName()
          try {
              $childScript = @'
          Write-Progress -Activity 'Reading web response' -Status 'Reading response stream...' -PercentComplete 10
          Write-Host 'WMT_CUSTOM_HOST_TEST'
          Write-Warning 'WMT_CUSTOM_WARNING'
          Write-Error 'WMT_CUSTOM_ERROR'
          cmd.exe /d /c 'echo WMT_CUSTOM_CMD_OUT & echo WMT_CUSTOM_CMD_ERR 1>&2'
          exit 7
          '@
              $encodedCustomCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($childScript))
              $cmd = "powershell.exe -NoProfile -ExecutionPolicy Bypass -EncodedCommand $encodedCustomCommand"
              $providerTranscriptPath = $logPath
              $generatedRunnerFiles = New-Object 'System.Collections.Generic.List[string]'
              foreach ($provider in @('winget', 'legendary')) {
                  $srcKey = $provider
                  $isCustomUpdateCommand = $true
                  Invoke-Expression $routeBlock
                  if ($visibleCommand -eq $cmd -or $visibleTranscriptPath -ne '' -or -not (Test-Path -LiteralPath $customCaptureRunnerPath)) {
                      throw "Custom override for $provider did not select native child capture."
                  }
                  $generatedRunnerFiles.Add($customCaptureRunnerPath)
                  $isCustomUpdateCommand = $false
                  Invoke-Expression $routeBlock
                  if ($visibleCommand -ne $cmd -or $visibleTranscriptPath -ne '') {
                      throw "Native $provider logging was changed and may duplicate output."
                  }
              }
              $srcKey = 'npm'
              Invoke-Expression $routeBlock
              if ($visibleCommand -ne $cmd -or $visibleTranscriptPath -ne $logPath) {
                  throw 'Normal provider transcript routing regressed.'
              }

              # Run the same custom-command runner that the visible CMD window uses.
              $srcKey = 'winget'
              $isCustomUpdateCommand = $true
              Invoke-Expression $routeBlock
              $generatedRunnerFiles.Add($customCaptureRunnerPath)
              & cmd.exe /d /c $visibleCommand
              if ($LASTEXITCODE -ne 7) { throw "Custom exit code lost: $LASTEXITCODE" }
              $logged = [IO.File]::ReadAllText($logPath)
              foreach ($marker in @('WMT_CUSTOM_HOST_TEST', 'WMT_CUSTOM_WARNING', 'WMT_CUSTOM_ERROR', 'WMT_CUSTOM_CMD_OUT', 'WMT_CUSTOM_CMD_ERR', 'EXIT: 7')) {
                  if (-not $logged.Contains($marker)) {
                      throw "Missing native child output: $marker. Transcript: $($logged.Substring(0, [Math]::Min(1600, $logged.Length)))"
                  }
              }
              if ($logged -match '#< CLIXML|<Objs Version|Reading web response|Raw output:') {
                  throw 'Package log contains raw PowerShell CLIXML or noisy progress instead of readable output.'
              }
              if (([regex]::Matches($logged, 'WMT_CUSTOM_HOST_TEST')).Count -ne 1) {
                  throw 'Write-Host message was duplicated in the package log.'
              }
              Write-Host 'PASS: Custom overrides produced human-readable stdout/stderr, warnings, errors and exit status.'
          }
          finally {
              foreach ($path in @($generatedRunnerFiles)) {
                  Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
              }
              Remove-Item -LiteralPath $logPath -Force -ErrorAction SilentlyContinue
          }
          # Exit explicitly after verifying the deliberately failing child process.
          # Otherwise GitHub Actions inherits native LASTEXITCODE=7.
          exit 0

      - name: Test shared WPF controls
        shell: powershell -NoProfile -STA -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $SourcePath = Join-Path $repoRoot 'WMT-GUI.ps1'
          Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
          if ([Threading.Thread]::CurrentThread.ApartmentState -ne 'STA') { throw 'Run with powershell.exe -STA.' }
          $tokens = $null
          $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $SourcePath).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors.Message -join '; ') }
          # Load helpers without elevation, startup, network access, or maintenance actions.
          foreach ($fn in $ast.FindAll({ param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] }, $false)) {
              Invoke-Expression $fn.Extent.Text
          }
          # This UI helper is nested in the startup-manager dialog.
          $gridMenuFunction = $ast.Find({ param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Add-GridContextMenu' }, $true)
          Invoke-Expression $gridMenuFunction.Extent.Text
          $paletteAssignment = $ast.Find({ param($n)
              $n -is [Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '$script:ThemePalettes'
          }, $true)
          Invoke-Expression $paletteAssignment.Extent.Text
          $script:CurrentTheme = 'dark'
          $script:WmtThemedElements = [Collections.ArrayList]::new()
          $script:WmtUiBackgroundCommands = @{}
          $script:WmtUiPollOperations = @{}
          # Use isolated real workers rather than WMT's pool, which loads system helpers.
          function New-WmtPooledPowerShell { param($PoolKind) [PowerShell]::Create() }
          function Write-GuiLog { param($Message) }
          $failures = [Collections.Generic.List[string]]::new()
          function Assert([bool]$Condition, [string]$Message) { if (-not $Condition) { throw $Message } }
          function Test-Case([string]$Name, [scriptblock]$Body) {
              try { & $Body; Write-Host "PASS: $Name" }
              catch { $failures.Add("${Name}: $($_.Exception.Message)"); Write-Host "FAIL: ${Name}: $($_.Exception.Message)" }
          }
          function Arrange-Window([string]$Content) {
              New-WmtWindowFromXaml -Title 'Component test' -ContentXaml $Content -NoOwner
          }
          function Measure-Window($Dialog, [double]$Width = 600, [double]$Height = 400) {
              # Settle queued column sizing after the real scroll viewport is measured.
              for ($pass=0; $pass -lt 3; $pass++) {
                  $Dialog.Content.Measure([Windows.Size]::new($Width, $Height))
                  $Dialog.Content.Arrange([Windows.Rect]::new(0, 0, $Width, $Height))
                  $Dialog.Content.UpdateLayout()
                  Invoke-WmtDispatcherPump
              }
          }
          function Wait-Progress($Progress, [int]$TimeoutMs = 5000) {
              $watch = [Diagnostics.Stopwatch]::StartNew()
              while ($Progress.State -eq 'Running' -and $watch.ElapsedMilliseconds -lt $TimeoutMs) {
                  Invoke-WmtDispatcherPump
                  Start-Sleep -Milliseconds 20
              }
              Assert ($Progress.State -ne 'Running') 'The progress component never finished.'
          }
          function Find-TextBlocks($Element) {
              if ($Element -is [Windows.Controls.TextBlock]) { $Element }
              for ($i=0; $i -lt [Windows.Media.VisualTreeHelper]::GetChildrenCount($Element); $i++) {
                  Find-TextBlocks ([Windows.Media.VisualTreeHelper]::GetChild($Element,$i))
              }
          }
          function Find-VisualsOfType($Element, [type]$Type) {
              if ($Element -is $Type) { $Element }
              for ($i=0; $i -lt [Windows.Media.VisualTreeHelper]::GetChildrenCount($Element); $i++) {
                  Find-VisualsOfType ([Windows.Media.VisualTreeHelper]::GetChild($Element,$i)) $Type
              }
          }

          Test-Case 'Shared named resources are available while window XAML loads' {
              $d = Arrange-Window '<ComboBox Style="{StaticResource WmtComboBoxStyle}"/>'
              try { Assert ($null -ne $d.Content.Style) 'Shared style was not resolved.' }
              finally { $d.Close() }
          }
          Test-Case 'Selected ComboBox items retain readable brushes across both themes' {
              $d = Arrange-Window '<ComboBox Name="combo"><ComboBoxItem Content="A"/><ComboBoxItem Content="B"/></ComboBox>'
              try {
                  $c = $d.FindName('combo'); $c.SelectedIndex = 1
                  foreach ($theme in @('dark', 'light')) {
                      Set-WmtThemeResources -Element $d -Palette $script:ThemePalettes[$theme]
                      Measure-Window $d
                      $item = $c.Items[1]; [void]$item.ApplyTemplate()
                      Assert ($item.Foreground.Color -eq $d.Resources['AccentText'].Color) "Unreadable selection in $theme."
                      Assert ($item.Background.Color -eq $d.Resources['Accent'].Color) "Wrong selected background in $theme."
                      Assert ($c.Foreground.Color -eq $d.Resources['TextPrimary'].Color) "Wrong closed selection in $theme."
                  }
              } finally { $d.Close() }
          }
          Test-Case 'Editable ComboBox typing leaves space for the dropdown arrow' {
              $d = Arrange-Window '<ComboBox Name="combo" IsEditable="True" Width="220" Height="34"/>'
              try {
                  Measure-Window $d
                  $c = $d.FindName('combo'); [void]$c.ApplyTemplate()
                  $text = $c.Template.FindName('PART_EditableTextBox',$c)
                  $text.Text = 'en-US'
                  Assert ($c.Text -eq 'en-US') 'Typed text did not reach the combo.'
                  Assert ($text.ActualWidth -le $c.ActualWidth - 32) 'Editable text extends under the arrow.'
              } finally { $d.Close() }
          }
          Test-Case 'Shared ListView and DataGrid selection follows theme brushes' {
              $d = Arrange-Window '<Grid><Grid.RowDefinitions><RowDefinition/><RowDefinition/></Grid.RowDefinitions><ListView Name="list"><ListView.View><GridView><GridViewColumn Header="Name" DisplayMemberBinding="{Binding Name}"/></GridView></ListView.View></ListView><DataGrid Grid.Row="1" Name="grid" AutoGenerateColumns="True"/></Grid>'
              try {
                  $list=$d.FindName('list'); $grid=$d.FindName('grid')
                  $list.ItemsSource=@([pscustomobject]@{Name='Selected row'})
                  $grid.ItemsSource=@([pscustomobject]@{Name='Selected row'})
                  $list.SelectedIndex=0; $grid.SelectedIndex=0
                  foreach ($theme in @('dark','light')) {
                      Set-WmtThemeResources -Element $d -Palette $script:ThemePalettes[$theme]
                      Measure-Window $d
                      foreach ($control in @($list,$grid)) {
                          $row=$control.ItemContainerGenerator.ContainerFromIndex(0)
                          Assert ($null -ne $row) 'No selected row was generated.'
                          Assert ($row.Background.Color -eq $d.Resources['Accent'].Color) "$theme selected row background is incorrect."
                          Assert ($row.Foreground.Color -eq $d.Resources['AccentText'].Color) "$theme selected row text is incorrect."
                      }
                  }
              } finally { $d.Close() }
          }
          Test-Case 'DataGrid status text inherits readable selection colors and restores status colors' {
              $d=Arrange-Window '<DataGrid Name="grid" IsReadOnly="True"/>'
              try {
                  $grid=$d.FindName('grid')
                  Set-WmtDataGridColumns -DataGrid $grid -Columns @('Name','State','Action')
                  $grid.ItemsSource=@([pscustomobject]@{Name='Example'; State='Enabled'; Action='Delete'})
                  foreach ($theme in @('dark','light')) {
                      Set-WmtThemeResources -Element $d -Palette $script:ThemePalettes[$theme]
                      $grid.SelectedIndex=-1
                      Measure-Window $d
                      $row=$grid.ItemContainerGenerator.ContainerFromIndex(0)
                      $status=@(Find-TextBlocks $row | Where-Object Text -eq 'Enabled')[0]
                      $statusColor=$status.Foreground.Color
                      $grid.SelectedIndex=0
                      Measure-Window $d
                      foreach ($text in @(Find-TextBlocks $row)) {
                          Assert ($text.Foreground.Color -eq $d.Resources['AccentText'].Color) "$theme selected text '$($text.Text)' ignores the selection foreground."
                      }
                      $grid.SelectedIndex=-1
                      Measure-Window $d
                      Assert ($status.Foreground.Color -eq $statusColor) "$theme deselection lost the status color."
                      $cell=@(Find-VisualsOfType $row ([Windows.Controls.DataGridCell]))[0]
                      $label=@(Find-TextBlocks $cell)[0]
                      $position=$label.TranslatePoint([Windows.Point]::new(0,0),$cell)
                      Assert ($position.Y -ge 4 -and $cell.ActualHeight - $position.Y - $label.ActualHeight -ge 4) 'DataGrid text has no breathing room inside its row.'
                  }
              } finally { $d.Close() }
          }
          Test-Case 'Themed DataGrid headers preserve sorting and column resizing' {
              $d=Arrange-Window '<DataGrid Name="grid" IsReadOnly="True"/>'
              try {
                  $grid=$d.FindName('grid')
                  Set-WmtDataGridColumns -DataGrid $grid -Columns @('Name','State')
                  $grid.ItemsSource=@([pscustomobject]@{Name='Zebra';State='Enabled'},[pscustomobject]@{Name='Alpha';State='Disabled'})
                  Measure-Window $d
                  $header=@(Find-VisualsOfType $grid ([Windows.Controls.Primitives.DataGridColumnHeader]) | Where-Object Content -eq 'Name')[0]
                  $click=$header.GetType().GetMethod('OnClick',[Reflection.BindingFlags]'Instance,NonPublic')
                  [void]$click.Invoke($header,$null)
                  Measure-Window $d
                  Assert ($grid.Items[0].Name -eq 'Alpha' -and $grid.Columns[0].SortDirection -eq 'Ascending') 'The themed header cannot sort ascending.'
                  Assert (@(Find-VisualsOfType $header ([Windows.Shapes.Path]) | Where-Object Visibility -eq 'Visible').Count -eq 1) 'The sorted column has no direction indicator.'
                  [void]$click.Invoke($header,$null)
                  Measure-Window $d
                  Assert ($grid.Items[0].Name -eq 'Zebra' -and $grid.Columns[0].SortDirection -eq 'Descending') 'The themed header cannot sort descending.'
                  $width=$grid.Columns[0].ActualWidth
                  $gripper=$header.Template.FindName('PART_RightHeaderGripper',$header)
                  Assert ($gripper.Visibility -eq 'Visible' -and $gripper.ActualWidth -gt 0) 'The themed header lost its resize handle.'
                  $gripper.RaiseEvent([Windows.Controls.Primitives.DragStartedEventArgs]::new(0,0))
                  $gripper.RaiseEvent([Windows.Controls.Primitives.DragDeltaEventArgs]::new(30,0))
                  $gripper.RaiseEvent([Windows.Controls.Primitives.DragCompletedEventArgs]::new(30,0,$false))
                  Measure-Window $d
                  Assert ($grid.Columns[0].ActualWidth -gt $width+20) 'Dragging the themed divider does not resize its column.'
              } finally { $d.Close() }
          }
          Test-Case 'Startup pages and shortcut grids use shared chrome through theme changes' {
              $startup=$ast.Find({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Show-StartupManager'},$true)
              foreach ($name in @('Set-StartupButtonRole','New-StartupPage')) {
                  $fn=$startup.Body.Find({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name},$true)
                  Invoke-Expression $fn.Extent.Text
              }
              $assignment=$startup.Body.Find({param($n) $n -is [Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '$content'},$false)
              Invoke-Expression $assignment.Extent.Text
              $dialog=Arrange-Window $content
              try {
                  $mainHost=$dialog.FindName('mainHost'); $tabs=@{}
                  $pages=@(foreach ($title in @('Windows','Scheduled Tasks','Context Menu','Services')) {
                      $page=New-StartupPage $title
                      Set-WmtDataGridColumns -DataGrid $page.Grid -Columns @('Name','State')
                      $page.Grid.ItemsSource=@([pscustomobject]@{Name='Zebra';State='Enabled'},[pscustomobject]@{Name='Alpha';State='Disabled'})
                      $page
                  })
                  foreach ($page in $pages) {
                      foreach ($other in $pages) { $other.Root.Visibility='Collapsed' }
                      $page.Root.Visibility='Visible'
                      foreach ($theme in @('dark','light')) {
                          Set-WmtThemeResources -Element $dialog -Palette $script:ThemePalettes[$theme]
                          Measure-Window $dialog 960 560
                          Assert ($page.Root.Background.Color -eq $dialog.Resources['BgDark'].Color) "$theme startup page retains the previous theme background."
                          Assert ($page.Grid.GridLinesVisibility -eq 'None') 'Startup overrides the shared grid separators.'
                          $headers=@(Find-VisualsOfType $page.Grid ([Windows.Controls.Primitives.DataGridColumnHeader]) | Where-Object { $null -ne $_.Column })
                          Assert ($headers.Count -eq 2) "$($page.Header) did not render its column headers."
                          foreach ($header in $headers) {
                              Assert ($header.Style.BasedOn -eq $dialog.TryFindResource('WmtColumnHeaderStyle') -and $null -ne $header.Style.BasedOn) "$($page.Header) bypasses shared column header styling."
                              Assert ($header.Template.FindName('HeaderBorder',$header).Background.Color -eq $dialog.Resources['BgPanel'].Color) "$($page.Header) renders headers with the wrong background."
                              $handle=$header.Template.FindName('PART_RightHeaderGripper',$header)
                              Assert ($handle.Style -eq $dialog.TryFindResource('WmtColumnHeaderGripperStyle')) "$($page.Header) bypasses shared column divider styling."
                          }
                      }
                      $header=$headers[0]
                      $click=$header.GetType().GetMethod('OnClick',[Reflection.BindingFlags]'Instance,NonPublic')
                      [void]$click.Invoke($header,$null)
                      Assert ($page.Grid.Items[0].Name -eq 'Alpha') "$($page.Header) lost column sorting."
                      $vC=$header.Column
                      $oldWidth=$vC.ActualWidth
                      $handle=$header.Template.FindName('PART_RightHeaderGripper',$header)
                      $handle.RaiseEvent([Windows.Controls.Primitives.DragStartedEventArgs]::new(0,0))
                      $handle.RaiseEvent([Windows.Controls.Primitives.DragDeltaEventArgs]::new(30,0))
                      $handle.RaiseEvent([Windows.Controls.Primitives.DragCompletedEventArgs]::new(30,0,$false))
                      Measure-Window $dialog 960 560
                      Assert ($vC.ActualWidth -gt $oldWidth+20) "$($page.Header) lost column resizing."
                  }
              } finally { $dialog.Close() }
              $shortcuts=$ast.Find({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Show-BrokenShortcuts'},$true)
              $assignment=$shortcuts.Body.Find({param($n) $n -is [Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '$content'},$false)
              Invoke-Expression $assignment.Extent.Text
              $dialog=Arrange-Window $content
              try {
                  $grid=$dialog.FindName('dgShortcuts')
                  Set-WmtDataGridColumns -DataGrid $grid -Columns @('Shortcut','Action')
                  $grid.ItemsSource=@([pscustomobject]@{Shortcut='Example.lnk';Action='Fix'})
                  foreach ($theme in @('dark','light')) {
                      Set-WmtThemeResources -Element $dialog -Palette $script:ThemePalettes[$theme]
                      Measure-Window $dialog 940 560
                      Assert ($grid.Background.Color -eq $dialog.Resources['BgDark'].Color -and $grid.GridLinesVisibility -eq 'None') "$theme shortcut grid overrides the shared theme."
                      $position=$grid.TranslatePoint([Windows.Point]::new(0,0),$dialog.Content)
                      Assert ($dialog.Content.Margin -eq [Windows.Thickness]::new(0) -and $position.X -eq 0 -and $position.Y -eq 0 -and [Math]::Abs($grid.ActualWidth-$dialog.Content.ActualWidth) -lt 1) 'Shortcut fixer still has outer padding around the table.'
                  }
              } finally { $dialog.Close() }
          }
          Test-Case 'Scrollbars share visible themed thumbs in main and dialog windows on both axes' {
              $assignment=$ast.Find({param($n) $n -is [Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '[xml]$xaml'},$true)
              $AppVersion='test'
              Invoke-Expression $assignment.Extent.Text
              foreach ($main in @($false,$true)) {
                  if ($main) {
                      $d=New-WmtWindowFromFullXaml -Xaml $xaml -NoOwner
                      $d.Content=[Windows.Markup.XamlReader]::Parse('<ScrollViewer xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" HorizontalScrollBarVisibility="Auto" VerticalScrollBarVisibility="Auto"><Border Width="1000" Height="1000"/></ScrollViewer>')
                  } else {
                      $d=Arrange-Window '<ScrollViewer HorizontalScrollBarVisibility="Auto" VerticalScrollBarVisibility="Auto"><Border Width="1000" Height="1000"/></ScrollViewer>'
                  }
                  try {
                      foreach ($theme in @('dark','light')) {
                          Set-WmtThemeResources -Element $d -Palette $script:ThemePalettes[$theme]
                          Measure-Window $d 500 260
                          $viewer=$d.Content
                          $bars=@(Find-VisualsOfType $viewer ([Windows.Controls.Primitives.ScrollBar]))
                          Assert ($bars.Count -eq 2) 'The fixture did not render both scrollbar axes.'
                          $corner=@(Find-VisualsOfType $viewer ([Windows.Shapes.Rectangle]))[0]
                          Assert ($corner.Fill.Color -eq $d.Resources['BgPanel'].Color) "$theme scrollbar corner retains the native system color."
                          foreach ($bar in $bars) {
                              $track=$bar.Template.FindName('PART_Track',$bar)
                              $thumb=$track.Thumb
                              Assert ($thumb.Background.Color -eq $d.Resources['TextMuted'].Color) "$theme scrollbar thumb is too faint against a panel."
                              Assert ($track.Orientation -eq $bar.Orientation) 'Scrollbar track uses the wrong axis.'
