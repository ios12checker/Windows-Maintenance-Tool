      - name: Smoke test driver usage worker fails on incomplete service inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $fn = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Start-DriverUsageLoad'
          }, $true)
          if (-not $fn) { throw 'Driver usage loader is missing.' }
          $workerMatch = [regex]::Match($fn.Extent.Text, '(?s)\$usageWorker\s*=\s*@''\r?\n(.*?)\r?\n''@')
          if (-not $workerMatch.Success) { throw 'Could not extract driver usage worker.' }
          $worker = [scriptblock]::Create($workerMatch.Groups[1].Value)
          function Get-CimInstance {
              [CmdletBinding()]
              param([string]$ClassName, [string[]]$Property)
              if ($ClassName -eq 'Win32_SystemDriver') { throw 'Simulated service inventory failure' }
          }
          $result = & $worker @('oem5.inf') @{}
          if (-not $result -or $result.Success -or $result.Error -notmatch 'Simulated service inventory failure') {
              throw 'Incomplete service inventory was accepted as verified.'
          }
          Write-Host 'PASS: background driver usage rejects incomplete service inventory.'
          # The same worker must keep unparseable AddService identities UNKNOWN,
          # not silently treat them as zero registered services (or fail all INFs).
          function Get-CimInstance {
              [CmdletBinding()]
              param([string]$ClassName, [string[]]$Property)
          }
          function Test-Path {
              [CmdletBinding()]
              param([string]$LiteralPath, [string]$PathType)
              return $true
          }
          function Get-Item {
              [CmdletBinding()]
              param([string]$LiteralPath)
              [PSCustomObject]@{ LastWriteTimeUtc = [DateTime]::UtcNow }
          }
          function Get-Content {
              [CmdletBinding()]
              param([string]$LiteralPath)
              'AddService = %UnresolvedSvc%, 0x2, ServiceSection'
          }
          $uncertain = & $worker @('oem5.inf') @{}
          if (-not $uncertain.Success -or
              -not $uncertain.Services.ContainsKey('oem5.inf') -or
              -not @($uncertain.Services['oem5.inf'])[0].Unverified -or
              @($uncertain.Services['oem5.inf'])[0].Running) {
              throw 'Unparseable AddService identity did not remain explicitly unverified.'
          }
          # Verify cached parse-confidence survives a repeat read.
          $cache = $uncertain.InfServiceCache
          $uncertainAgain = & $worker @('oem5.inf') $cache
          if (-not $uncertainAgain.Success -or
              -not @($uncertainAgain.Services['oem5.inf'])[0].Unverified) {
              throw 'Service parse cache incorrectly marked unverified INF as safe.'
          }
          Write-Host 'PASS: unknown AddService names remain protected on fresh and cached scans.'

      - name: Smoke test fast ghost-device scan and full-width dialog
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $fn = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Get-WmtGhostDeviceCandidates'
          }, $true)
          if (-not $fn) { throw 'Fast ghost-device candidate helper is missing.' }
          Invoke-Expression $fn.Extent.Text
          function Get-PnpDevice {
              [CmdletBinding()]
              param()
              [PSCustomObject]@{ Status = 'Unknown'; InstanceId = 'USB\GHOST'; Class = 'USB'; FriendlyName = 'Unplugged test device' }
              [PSCustomObject]@{ Status = 'OK'; InstanceId = 'USB\CONNECTED'; Class = 'USB'; FriendlyName = 'Present test device' }
              [PSCustomObject]@{ Status = 'Unknown'; InstanceId = 'USB\GHOST'; Class = 'USB'; FriendlyName = 'Duplicate ghost' }
              [PSCustomObject]@{ Status = 'Unknown'; InstanceId = ''; Class = 'USB'; FriendlyName = 'Invalid ghost' }
          }
          $rows = @(Get-WmtGhostDeviceCandidates)
          if ($rows.Count -ne 1 -or [string]$rows[0].InstanceId -ne 'USB\GHOST') {
              throw ('Fast ghost candidate scan returned unexpected rows: ' + ($rows | ConvertTo-Json -Compress))
          }
          $dialogText = [regex]::Match($source, '(?ms)^function Show-GhostDevicesDialog\s*\{(.*?)(?=^function Invoke-DriverUpdates)')
          if (-not $dialogText.Success) { throw 'Ghost-device dialog definition missing.' }
          if ($dialogText.Value -notmatch '(?s)\$content\s*=\s*@"\r?\n<Grid>\r?\n') {
              throw 'Ghost-device dialog no longer has an edge-to-edge root grid.'
          }
          if ($dialogText.Value -notmatch 'BorderThickness="0"' -or $dialogText.Value -notmatch 'BorderThickness="0,1,0,0"') {
              throw 'Ghost-device full-width data grid/footer layout regressed.'
          }
          if ($dialogText.Value -match 'WmtGhostScan_|\$ghostScanScript|Starting disconnected.device scan') {
              throw 'Broken child scanner was reintroduced in the ghost dialog.'
          }
          if ($dialogText.Value -notmatch 'Get-PnpDevice -ErrorAction Stop' -or
              $dialogText.Value -notmatch 'GhostDeviceScan_' -or
              $dialogText.Value -notmatch 'Get-PnpDevice -PresentOnly -ErrorAction Stop') {
              throw 'Fast scanning or pre-removal connected-device verification missing.'
          }
          $themedHeaderBands = [regex]::Matches($source,
              '<ControlTemplate TargetType="\{x:Type (?:GridViewColumnHeader|DataGridColumnHeader)\}">\s*<Grid Background="\{DynamicResource BgPanel\}">')
          $transparentFillers = [regex]::Matches($source,
              '<Setter TargetName="HeaderBorder" Property="Background" Value="Transparent"/>')
          if ($themedHeaderBands.Count -ne 2 -or $transparentFillers.Count -lt 2) {
              throw 'Full-width themed header bands or transparent fillers regressed.'
          }
          Write-Host 'PASS: fast ghost candidates, deduplication, edge-to-edge dialog, removal presence guard, and themed headers.'

