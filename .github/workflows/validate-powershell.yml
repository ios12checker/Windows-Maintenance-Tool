          Test-Case 'Responsive sizing accepts an ordinary Window owner and clears removed columns' {
              $d=[Windows.Window]::new()
              try {
                  $list=[Windows.Controls.ListView]::new()
                  $list.View=[Windows.Controls.GridView]::new()
                  $column=[Windows.Controls.GridViewColumn]::new()
                  $column.Header='Name'; $column.Width=180
                  [void]$list.View.Columns.Add($column)
                  $d.Content=$list
                  Connect-WmtResponsiveColumns -Table $list -Owner $d
                  Measure-Window $d 600 250
                  $state=$list.Resources['__WmtResponsiveColumns']
                  Assert ($state.Columns.Count -eq 1) 'The column was not connected.'
                  $list.View.Columns.Clear()
                  Measure-Window $d 600 250
                  Assert ($state.Columns.Count -eq 0) 'Clearing columns retained their layout state.'
                  $column.Width=[double]::NaN
                  Assert ($null -eq $state.Operation) 'A removed column still queues width-reset work for its former table.'
                  Request-WmtResponsiveColumnResize -Table $list
