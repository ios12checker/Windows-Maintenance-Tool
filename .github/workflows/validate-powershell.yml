                  $stateWidth=$grid.Columns[2].ActualWidth
                  Measure-Window $d 900 250
                  $nameGrowth=$grid.Columns[1].ActualWidth-$nameWidth
                  $stateGrowth=$grid.Columns[2].ActualWidth-$stateWidth
                  Assert ($grid.Columns[0].ActualWidth -le 100 -and [Math]::Abs($nameGrowth-2*$stateGrowth) -le 3) 'Capped columns consume spare space or declared star ratios are lost.'
                  $viewer=Get-WmtVisualDescendant -Element $grid -DescendantType ([Windows.Controls.ScrollViewer])
                  $total=($grid.Columns | Where-Object Visibility -eq 'Visible' | Measure-Object -Property ActualWidth -Sum).Sum
                  Assert ([Math]::Abs($total-$viewer.ViewportWidth) -le 1 -and $viewer.ScrollableWidth -eq 0) 'Width limits or hidden columns leave unused viewport space.'
                  $grid.Columns[3].Visibility='Visible'
                  Measure-Window $d 1200 250
                  $total=($grid.Columns | Measure-Object -Property ActualWidth -Sum).Sum
                  Assert ([Math]::Abs($total-$viewer.ViewportWidth) -le 1) 'A newly visible column does not participate in shared sizing.'
                  $grid.Columns[1].MinWidth=200
                  $grid.Columns.RemoveAt(2)
