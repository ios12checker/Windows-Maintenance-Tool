          }
          function Get-Content {
              [CmdletBinding()]
              param([string]$LiteralPath)
              'AddService = %UnresolvedSvcName%, 0x2, UnknownService'
          }
          $rejected = $false
          try { $null = Get-WmtDriverCleanupUsage -PublishedName 'oem17.inf' } catch { $rejected = $true }
          if (-not $rejected) { throw 'An unresolved AddService name was treated as safe.' }
          function Test-Path {
              [CmdletBinding()]
              param([string]$LiteralPath, [string]$PathType)
              return $false
          }
          $rejected = $false
          try { $null = Get-WmtDriverCleanupUsage -PublishedName 'oem17.inf' } catch { $rejected = $true }
