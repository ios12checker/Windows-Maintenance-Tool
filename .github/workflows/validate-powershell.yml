          }
          # Exercise the actual registry snapshot mapper against a temporary HKCU key.
          # The unnamed default value formerly caused [PSCustomObject]$values to
          # throw and left the entire Tweaks page blocked.
          Invoke-Expression (Find-FunctionText 'ConvertTo-WmtRegistrySnapshotValues')
          Invoke-Expression (Find-FunctionText 'Get-WmtRegistrySnapshotValue')
          $smokePath = 'Software\\WMT-Snapshot-Test-' + [Guid]::NewGuid().ToString('N')
          $testKey = $null
          try {
              $testKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey($smokePath)
              if (-not $testKey) { throw 'Unable to create temporary registry test key.' }
              $testKey.SetValue('', '.default', [Microsoft.Win32.RegistryValueKind]::String)
              $testKey.SetValue('System.IsPinnedToNameSpaceTree', 0, [Microsoft.Win32.RegistryValueKind]::DWord)
              $testKey.SetValue('Data', [byte[]]@(1, 2, 3), [Microsoft.Win32.RegistryValueKind]::Binary)
              $snapshot = ConvertTo-WmtRegistrySnapshotValues -RegistryKey $testKey
              if ($snapshot -isnot [System.Collections.IDictionary] -or
                  -not $snapshot.Contains('') -or
                  (Get-WmtRegistrySnapshotValue -Item $snapshot -Name '(Default)' -Default 'MISSING') -ne '.default' -or
                  (Get-WmtRegistrySnapshotValue -Item $snapshot -Name 'System.IsPinnedToNameSpaceTree' -Default -1) -ne 0 -or
                  (Get-WmtRegistrySnapshotValue -Item $snapshot -Name 'missing' -Default 17) -ne 17 -or
                  @(Get-WmtRegistrySnapshotValue -Item $snapshot -Name 'Data').Count -ne 3) {
                  throw 'Registry snapshot lost unnamed, named, or binary values.'
              }
              $testKey.SetValue('', '', [Microsoft.Win32.RegistryValueKind]::String)
              $emptySnapshot = ConvertTo-WmtRegistrySnapshotValues -RegistryKey $testKey
              if ((Get-WmtRegistrySnapshotValue -Item $emptySnapshot -Name '(Default)' -Default 'MISSING') -ne '') {
                  throw 'Empty unnamed registry value was confused with a missing value.'
              }
              $legacy = [pscustomobject]@{ Existing = 'value' }
              if ((Get-WmtRegistrySnapshotValue -Item $legacy -Name 'Existing') -ne 'value') {
                  throw 'Legacy registry PSObject lookup regressed.'
              }
          }
          finally {
              if ($testKey) { $testKey.Dispose() }
              [Microsoft.Win32.Registry]::CurrentUser.DeleteSubKeyTree($smokePath, $false)
          }
          # Regression guard: click handlers clear the registry snapshot and then
          # immediately read the selected value. The helper must read the actual
          # registry value on cache miss and refresh every value in that key.
          Invoke-Expression (Find-FunctionText 'Convert-WmtRegistryPath')
          Invoke-Expression (Find-FunctionText 'Get-WmtRegistryKeyValuesCached')
          Invoke-Expression (Find-FunctionText 'Read-WmtRegistryKeyValuesLive')
          Invoke-Expression (Find-FunctionText 'Get-WmtRegValue')
          function Write-GuiLog([string]$Message) { Write-Host $Message }
          $cacheTestSubPath = 'Software\WMT-RegValue-Cache-Test-' + [Guid]::NewGuid().ToString('N')
          $cacheTestFullPath = "HKCU:\$cacheTestSubPath"
          $cacheTestKey = $null
          $script:TweakButtonStatesCache = @{}
          try {
              $cacheTestKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey($cacheTestSubPath)
              if (-not $cacheTestKey) { throw 'Unable to create temporary registry cache test key.' }
              $cacheTestKey.SetValue('HideFileExt', 0, [Microsoft.Win32.RegistryValueKind]::DWord)
              $cacheTestKey.SetValue('Hidden', 1, [Microsoft.Win32.RegistryValueKind]::DWord)
              $firstRead = Get-WmtRegValue -Path $cacheTestFullPath -Name 'HideFileExt' -Default 1
              if ($firstRead -ne 0) {
                  throw "Get-WmtRegValue returned $firstRead instead of the live HideFileExt value 0 on cache miss."
              }
              $cacheTestKey.SetValue('HideFileExt', 1, [Microsoft.Win32.RegistryValueKind]::DWord)
              $cacheTestKey.SetValue('Hidden', 2, [Microsoft.Win32.RegistryValueKind]::DWord)
              [void]$script:TweakButtonStatesCache.Remove($cacheTestFullPath)
              $freshRead = Get-WmtRegValue -Path $cacheTestFullPath -Name 'HideFileExt' -Default 0
              $freshSnapshot = $script:TweakButtonStatesCache[$cacheTestFullPath]
              if ($freshRead -ne 1 -or -not $freshSnapshot -or
                  $freshSnapshot['HideFileExt'] -ne 1 -or $freshSnapshot['Hidden'] -ne 2) {
                  throw 'Clearing the registry snapshot did not read the new HideFileExt value and refresh sibling values.'
              }
              # A WMT click handler reads and caches the original state, then writes.
              # The writer must invalidate that now-stale snapshot before any later UI refresh.
              Invoke-Expression (Find-FunctionText 'Clear-WmtRegCache')
              Invoke-Expression (Find-FunctionText 'Sync-WmtRegCacheAfterWrite')
              Invoke-Expression (Find-FunctionText 'Set-WmtRegDword')
              Set-WmtRegDword -Path $cacheTestFullPath -Name 'HideFileExt' -Value 0
              $snapshotAfterWrite = $script:TweakButtonStatesCache[$cacheTestFullPath]
              if (-not $snapshotAfterWrite -or $snapshotAfterWrite['HideFileExt'] -ne 0 -or $snapshotAfterWrite['Hidden'] -ne 2) {
                  throw 'Set-WmtRegDword did not repopulate the registry snapshot before the next UI state refresh.'
              }
              $afterWrite = Get-WmtRegValue -Path $cacheTestFullPath -Name 'HideFileExt' -Default 1
              if ($afterWrite -ne 0) {
                  throw "A registry write left the cached HideFileExt state stale; expected 0, got $afterWrite."
              }
              Write-Host 'PASS: registry writes refresh the cached snapshot before the next state read.'
              Write-Host 'PASS: registry-cache invalidation re-reads HideFileExt and refreshes the whole key.'
          }
          finally {
              if ($cacheTestKey) { $cacheTestKey.Dispose() }
              [Microsoft.Win32.Registry]::CurrentUser.DeleteSubKeyTree($cacheTestSubPath, $false)
              $script:TweakButtonStatesCache = @{}
          }
          if ($source -match '\\$regCache\\[\\$path\\]\\s*=\\s*\\[PSCustomObject\\]\\$values') {
              throw 'Registry snapshot once again casts unnamed values to PSCustomObject.'
          }
          if ($source -match '\$result\[\$path\]\s*=\s*\[PSCustomObject\]\$values' -or
              (Find-FunctionText 'Get-WmtRegistryKeyValuesCached') -match 'Read-WmtRegValuesFast|OpenSubKey|Get-ItemProperty') {
              throw 'Registry cache fallback can block on WPF or lose unnamed registry values.'
          }
          # Phone Link must read the actual Start-menu companion setting, not the
          # unrelated Start_ShowAccountBadges account-badge setting.
          $phoneLinkPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Start\Companions\Microsoft.YourPhone_8wekyb3d8bbwe'
          $phoneHandlerStart = $source.IndexOf('$btnTogglePhoneLink = Get-Ctrl "btnTogglePhoneLink"')
          $phoneHandlerEnd = $source.IndexOf('function Register-WmtTweakButton', $phoneHandlerStart)
          if ($phoneHandlerStart -lt 0 -or $phoneHandlerEnd -le $phoneHandlerStart) { throw 'Cannot locate Phone Link click handler.' }
          $phoneHandler = $source.Substring($phoneHandlerStart, $phoneHandlerEnd - $phoneHandlerStart)
          if ($phoneHandler -match 'Start_ShowAccountBadges' -or
              $phoneHandler -notmatch 'Get-WmtRegValue \$p "IsEnabled" 1' -or
