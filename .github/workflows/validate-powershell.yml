                  Measure-Window $d 420 280
                  $b = $d.FindName('btnInstall')
                  $p = $b.TranslatePoint([Windows.Point]::new(0,0), $d.Content)
                  Assert ($p.Y -ge 0 -and $p.Y + $b.ActualHeight -le 280) 'Install button is outside the window.'
                  $scroll = $d.FindName('InstallerScroll')
                  Assert ($scroll.ScrollableHeight -gt 0) 'Provider options do not scroll.'
                  Assert ($null -ne $d.FindName('providerOption')) 'Provider option names are unavailable.'
                  Assert ($null -ne $d.FindName('chkDesktopShortcut')) 'Common shortcut options are missing.'
              } finally { $d.Close() }
          }
          Test-Case 'Footer wraps several long actions without clipping buttons' {
              $d = Arrange-Window '<ContentControl Name="host"/>'
              try {
                  $d.Content.Content = New-WmtActionButtonPanel -Owner $d -Buttons @(
                      @{ Name='first'; Content='First very long action' }, @{ Name='second'; Content='Second very long action' }, @{ Name='close'; Content='Close'; IsCancel=$true })
                  Measure-Window $d 260 200
                  foreach ($name in @('first','second','close')) {
                      $b = $d.FindName($name); $p = $b.TranslatePoint([Windows.Point]::new(0,0), $d.Content)
                      Assert ($p.X -ge 0 -and $p.X + $b.ActualWidth -le 260) "$name is clipped horizontally."
                  }
                  Assert ($d.FindName('second').TranslatePoint([Windows.Point]::new(0,0), $d.Content).Y -gt $d.FindName('first').TranslatePoint([Windows.Point]::new(0,0), $d.Content).Y) 'Actions did not wrap.'
              } finally { $d.Close() }
          }
          Test-Case 'Long installer validation errors keep the install action visible' {
              $d=New-WmtInstallerDialog -Title 'Validation' -OptionsXaml '<Border Height="1000"/>'
              try {
                  $d.FindName('lblError').Text=('Long validation error. ' * 150)
                  Measure-Window $d 420 280
                  $button=$d.FindName('btnInstall')
                  $position=$button.TranslatePoint([Windows.Point]::new(0,0),$d.Content)
                  Assert ($position.Y -ge 0 -and $position.Y+$button.ActualHeight -le 280) 'Long validation text pushed actions outside the window.'
              } finally { $d.Close() }
          }
          Test-Case 'Long worker errors keep the progress close button visible' {
              $d=Arrange-Window '<ContentControl/>'
              try {
                  $p=New-WmtAsyncProgress -Owner $d
                  $d.Content.Content=$p.View
                  $longError = 'Long worker error. ' * 150
                  Set-WmtAsyncProgressState -Progress $p -State Failed -Message $longError
                  Measure-Window $d 420 160
                  $position=$p.CancelButton.TranslatePoint([Windows.Point]::new(0,0),$d.Content)
                  Assert ($position.Y -ge 0 -and $position.Y+$p.CancelButton.ActualHeight -le 160) 'Long worker error pushed the close button outside the window.'
                  Assert ($p.Output.Text.Contains($longError)) 'The full worker error was not preserved in the scrollable output.'
                  Assert ($p.Status.Text -match 'details are shown below') 'Long worker error did not leave a concise visible status.'
              } finally { $d.Close() }
          }
          Test-Case 'Installer option labels wrap inside the narrow scroll viewport' {
              $d=New-WmtInstallerDialog -Title 'Narrow installer' -OptionsXaml '<Border/>'
              try {
                  Measure-Window $d 420 280
                  $scroll=$d.FindName('InstallerScroll')
                  foreach ($name in @('chkKeepOpen','chkDesktopShortcut','chkStartMenuShortcut')) {
                      foreach ($label in @(Find-TextBlocks $d.FindName($name))) {
                          $position=$label.TranslatePoint([Windows.Point]::new(0,0),$scroll)
                          Assert ($position.X+$label.ActualWidth -le $scroll.ActualWidth) "$name label extends outside the scroll viewport."
                      }
                  }
              } finally { $d.Close() }
          }
          Test-Case 'Checkable menu actions show a visible indicator only when checked' {
              $d=Arrange-Window '<ContentControl/>'
              try {
                  $menu=New-WmtContextMenu -Items @(@{Header='Toggle option'; IsCheckable=$true; IsChecked=$false})
                  $item=$menu.Items[0]
                  $d.Content.Content=$item
                  Measure-Window $d
                  [void]$item.ApplyTemplate()
                  $mark=$item.Template.FindName('CheckMark',$item)
                  Assert ($null -ne $mark) 'Checkable menu item has no check indicator.'
                  Assert ($mark.Visibility -eq [Windows.Visibility]::Visible -and $mark.Opacity -eq 0) 'Unchecked item shows a check.'
                  $item.IsChecked=$true
                  Assert ($mark.Opacity -eq 1) 'Checked item has no visible check.'
              } finally { $d.Close() }
          }
          Test-Case 'Path picker uses an existing ancestor and preserves text on cancellation' {
              $d = Arrange-Window '<ContentControl/>'
              try {
                  $d.Content.Content = New-WmtPathPicker -Owner $d -TextBoxName 'path' -BrowseButtonName 'browse'
                  $text = $d.FindName('path'); $button = $d.FindName('browse')
                  $testPath = Join-Path $repoRoot 'Missing [game]\Deep\Folder'
                  $text.Text = $testPath
                  $script:PickedInitial = $null
                  function global:Select-WmtExplorerFolder { param($Description, $InitialDirectory, $Owner) $script:PickedInitial = $InitialDirectory; return $null }
                  $button.RaiseEvent([Windows.RoutedEventArgs]::new([Windows.Controls.Primitives.ButtonBase]::ClickEvent))
                  Assert ($text.Text -eq $testPath) 'Cancelling changed the typed path.'
                  Assert ($script:PickedInitial -eq $repoRoot) 'Picker did not find the nearest existing parent.'
                  function global:Select-WmtExplorerFolder { param($Description, $InitialDirectory, $Owner) return 'C:\Games [new]' }
                  $button.RaiseEvent([Windows.RoutedEventArgs]::new([Windows.Controls.Primitives.ButtonBase]::ClickEvent))
                  Assert ($text.Text -eq 'C:\Games [new]') 'Accepted folder was not applied.'
              } finally { Remove-Item Function:\global:Select-WmtExplorerFolder -ErrorAction SilentlyContinue; $d.Close() }
          }
          Test-Case 'Menu builder preserves distinct callbacks and button enablement' {
              $state = @{ First=0; Second=0 }
              $firstAction = { $state.First++ }.GetNewClosure()
              $secondAction = { $state.Second++ }.GetNewClosure()
              $menu = New-WmtContextMenu -Items @(@{Header='First'; Action=$firstAction}, @{Separator=$true}, @{Header='Second'; Action=$secondAction})
              $menu.Items[0].RaiseEvent([Windows.RoutedEventArgs]::new([Windows.Controls.MenuItem]::ClickEvent))
              $menu.Items[2].RaiseEvent([Windows.RoutedEventArgs]::new([Windows.Controls.MenuItem]::ClickEvent))
              Assert ($state.First -eq 1 -and $state.Second -eq 1) 'Menu actions captured the wrong descriptor.'
              $button = [Windows.Controls.Button]::new(); $button.Content = 'Action'; $button.IsEnabled = $false
              $tab = @{ Grid=[Windows.Controls.DataGrid]::new() }
              Add-GridContextMenu -TabObj $tab -Buttons @($button)
              Assert (-not $tab.Grid.ContextMenu.Items[0].IsEnabled) 'Disabled action is enabled in the menu.'
              $button.IsEnabled = $true
              Assert ($tab.Grid.ContextMenu.Items[0].IsEnabled) 'Menu enablement did not follow the button.'
          }
          Test-Case 'Async progress completes real work and restores original control states' {
              $enabled = [Windows.Controls.Button]::new(); $disabled = [Windows.Controls.Button]::new(); $disabled.IsEnabled=$false
              $p = New-WmtAsyncProgress -BusyControls @($enabled,$disabled)
              $state = @{Result=$null}
              $callback = { param($r) $state.Result = $r[0] }.GetNewClosure()
              $job = Invoke-WmtUiBackgroundCommand -Name 'ComponentSuccess' -Sb { 'worker result' } -Progress $p -OnComplete $callback
              Assert (-not $enabled.IsEnabled) 'Busy controls were not disabled.'
              Wait-Progress $p
              Assert ($p.State -eq 'Succeeded' -and $state.Result -eq 'worker result') 'Completion/result was lost.'
              Assert ($enabled.IsEnabled -and -not $disabled.IsEnabled) 'Original control enablement was not restored.'
              Assert (-not $script:WmtUiBackgroundCommands.ContainsKey('ComponentSuccess')) 'Completed job was retained.'
          }
          Test-Case 'Async progress surfaces worker failure and removes its monitor' {
              $p = New-WmtAsyncProgress
              [void](Invoke-WmtUiBackgroundCommand -Name 'ComponentFailure' -Sb { Write-Error 'worker failed' } -Progress $p)
              Wait-Progress $p
              Assert ($p.State -eq 'Failed' -and $p.Status.Text -match 'worker failed') 'Worker error was presented as success.'
              Assert (-not (Test-WmtUiPollOperation 'UiCommand:ComponentFailure')) 'Failed worker monitor was retained.'
          }
          Test-Case 'Async cancellation restores controls and unregisters the monitor' {
              $b = [Windows.Controls.Button]::new(); $p = New-WmtAsyncProgress -BusyControls @($b)
              [void](Invoke-WmtUiBackgroundCommand -Name 'ComponentCancel' -Sb { Start-Sleep -Seconds 30 } -Progress $p)
              Stop-WmtUiBackgroundCommand -Name 'ComponentCancel'
              Assert ($p.State -eq 'Cancelled' -and $b.IsEnabled) 'Cancellation did not finish progress.'
              Assert (-not (Test-WmtUiPollOperation 'UiCommand:ComponentCancel')) 'Cancelled worker monitor was retained.'
          }
          Test-Case 'Async timeout reports failure and restores controls' {
              $b = [Windows.Controls.Button]::new(); $p = New-WmtAsyncProgress -BusyControls @($b)
              [void](Invoke-WmtUiBackgroundCommand -Name 'ComponentTimeout' -Sb { Start-Sleep -Seconds 30 } -TimeoutMs 60 -Progress $p)
              Wait-Progress $p
              Assert ($p.State -eq 'Failed' -and $p.Status.Text -match 'timed out' -and $b.IsEnabled) 'Timeout did not finalize progress.'
          }
          Test-Case 'Closing the owning window cancels the worker and restores controls' {
              $d=Arrange-Window '<ContentControl/>'
              $b=[Windows.Controls.Button]::new()
              $p=New-WmtAsyncProgress -Owner $d -BusyControls @($b)
              $d.Content.Content=$p.View
              [void](Invoke-WmtUiBackgroundCommand -Name 'ComponentOwnerClose' -Sb { Start-Sleep -Seconds 30 } -Progress $p)
              $d.Close()
              Assert ($p.State -eq 'Cancelled' -and $b.IsEnabled) 'Closing the owner left a running worker.'
              Assert (-not (Test-WmtUiPollOperation 'UiCommand:ComponentOwnerClose')) 'Owner closure retained the monitor.'
          }
          # Cancellation finalizes workers asynchronously. Let the real stop collectors
          # release their PowerShell instances before stopping the shared dispatcher timer.
          $cleanupWatch=[Diagnostics.Stopwatch]::StartNew()
          while (($script:WmtUiPollOperations.Count -or $script:WmtBackgroundOperationState.Operations.Count) -and $cleanupWatch.ElapsedMilliseconds -lt 5000) {
              Invoke-WmtDispatcherPump
              Start-Sleep -Milliseconds 20
          }
          Assert ($script:WmtUiPollOperations.Count -eq 0) 'Background cleanup monitors did not drain.'
          Assert ($script:WmtBackgroundOperationState.Operations.Count -eq 0) 'Background manager operations did not drain.'
          Stop-WmtUiPoller
          [void](Stop-WmtBackgroundOperationManager)
          try { $script:WmtTestRunspacePool.Close() } catch {}
          try { $script:WmtTestRunspacePool.Dispose() } catch {}
          if ($failures.Count) { throw ($failures -join "`n") }
          Write-Host 'All WPF component tests passed.'

      - name: Test Legendary library recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Load production functions and the real cache worker without starting the GUI.
          $repoRoot = (Get-Location).Path
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $repoRoot 'WMT-GUI.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors.Message -join '; ') }
          foreach ($name in @('Invoke-WmtLegendaryLibraryJson', 'Invoke-WmtLegendaryInstalledData',
                  'Get-WmtLegendaryCachedLibrary', 'Merge-WmtLegendaryCachedDetails', 'Set-WmtJsonCacheFile', 'New-WmtRunspaceInitialState', 'Start-WmtLibraryCacheBuilder', 'Get-WmtLibraryItemInstallDir')) {
              $fn = $ast.Find({ param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
              }, $true)
              if ($fn) { Invoke-Expression $fn.Extent.Text }
          }
          $builder = $ast.Find({ param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Start-WmtLibraryCacheBuilder'
          }, $true)
          $worker = $builder.Find({ param($n)
              $n -is [System.Management.Automation.Language.ScriptBlockExpressionAst] -and
              $n.ScriptBlock.ParamBlock.Parameters.Count -eq 11
          }, $true).ScriptBlock.Extent.Text
          $worker = $worker.Substring(1, $worker.Length - 2)
          $scan = $ast.Find({ param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Start-WmtLibraryScan'
          }, $true)
          $scanWorker = $scan.Find({ param($n)
              $n -is [System.Management.Automation.Language.ScriptBlockExpressionAst] -and
              $n.ScriptBlock.ParamBlock.Parameters.Count -eq 5
          }, $true).ScriptBlock.Extent.Text
          $scanWorker = $scanWorker.Substring(1, $scanWorker.Length - 2)

          # Only the external process is faked. Parsing, runspace registration, merging,
          # and atomic cache writes are production code. No Epic credentials are used.
          function Invoke-WmtProcess {
              param($FilePath, $Arguments, $TimeoutMs, $Encoding, [switch]$KillTree)
              if ($Arguments -eq 'list-installed --json' -and
                  -not (Test-Path -LiteralPath (Join-Path (Split-Path -Parent $FilePath) 'fail-installed'))) {
                  $rows = @(1..9 | ForEach-Object {
                      @{ app_name = "game$_"; title = "Installed game $_"; version = '1.0';
                         install_path = "C:\Games\Game$_"; platform = 'Windows'; install_size = 1024 }
                  })
                  return [pscustomobject]@{ ExitCode = 0; StdOut = ($rows | ConvertTo-Json); StdErr = ''; TimedOut = $false; Error = '' }
              }
              return [pscustomobject]@{ ExitCode = -1; StdOut = ''; StdErr = 'Epic API read timed out'; TimedOut = $true; Error = '' }
          }

          $testRoot = Join-Path ([IO.Path]::GetTempPath()) ('WmtLegendaryTests-' + [guid]::NewGuid().ToString('N'))
          $originalConfig = $env:LEGENDARY_CONFIG_PATH
          $failures = [System.Collections.Generic.List[string]]::new()

          function Test-Case([string]$Name, [scriptblock]$Body) {
              try { & $Body; Write-Host "PASS: $Name" }
              catch { [void]$failures.Add("${Name}: $($_.Exception.Message)"); Write-Host "FAIL: ${Name}: $($_.Exception.Message)" }
          }
          function Invoke-TestWorker([string]$Directory) {
              [void][IO.Directory]::CreateDirectory($Directory)
              $cachePath = Join-Path $Directory 'legendary_library.json'
              $rs = [runspacefactory]::CreateRunspace((New-WmtRunspaceInitialState))
              $ps = [PowerShell]::Create()
              try {
                  $rs.Open()
                  $ps.Runspace = $rs
                  [void]$ps.AddScript($worker).AddArgument($true).AddArgument($false).
                      AddArgument((Join-Path $testRoot 'legendary.exe')).AddArgument($cachePath)
                  $logs = @($ps.Invoke())
                  if ($ps.HadErrors) { throw ($ps.Streams.Error -join '; ') }
                  if (-not (Test-Path -LiteralPath $cachePath)) { throw "Cache was not written. $($logs -join '; ')" }
                  $rows = [IO.File]::ReadAllText($cachePath) | ConvertFrom-Json
                  return [pscustomobject]@{ Rows = @($rows); Logs = $logs }
              }
              finally { $ps.Dispose(); $rs.Dispose() }
          }

          try {
              [void][IO.Directory]::CreateDirectory($testRoot)
              [IO.File]::WriteAllText((Join-Path $testRoot 'legendary.exe'), '')
              $env:LEGENDARY_CONFIG_PATH = Join-Path $testRoot 'config'
              [void][IO.Directory]::CreateDirectory($env:LEGENDARY_CONFIG_PATH)

              Test-Case 'A displayed Legendary library row opens its cached directory without a CLI query' {
                  $installDirectory = Join-Path $testRoot 'Installed [Epic] Game'
                  [void][IO.Directory]::CreateDirectory($installDirectory)
                  $libraryFile = Join-Path $testRoot 'folder-library.json'
                  $fixture = @(@{ Id = 'game1'; Title = 'Installed game'; IsInstalled = $true;
                      InstalledVersion = '1.0'; InstallPath = $installDirectory; Platform = 'Windows' })
                  [IO.File]::WriteAllText($libraryFile, (ConvertTo-Json -InputObject $fixture))
                  $ps = [PowerShell]::Create()
                  try {
                      [void]$ps.AddScript($scanWorker).AddArgument($libraryFile).
                          AddArgument((Join-Path $testRoot 'missing-gog.json')).AddArgument('').AddArgument(@()).AddArgument(@())
                      $scanOutput = @($ps.Invoke())
                      if ($ps.HadErrors) { throw ($ps.Streams.Error -join '; ') }
                      $row = $scanOutput | Where-Object { $_ -isnot [string] -and $_.Id -eq 'game1' }
                      if (-not $row -or $row.InstallPath -ne $installDirectory) { throw 'The library scan dropped the installed directory.' }
                      function Invoke-WmtProcess { throw 'Opening a cached folder must not require the CLI.' }
                      if ((Get-WmtLibraryItemInstallDir -Item $row) -ne $installDirectory) { throw 'The folder action ignored the cached directory.' }
                  }
                  finally { $ps.Dispose() }
              }

              Test-Case 'Legendary folder lookup recovers missing and stale paths from local installed JSON' {
                  $installDirectory = Join-Path $testRoot 'Recovered [Epic] Game'
                  [void][IO.Directory]::CreateDirectory($installDirectory)
                  $fixtureFile = Join-Path $testRoot 'not-a-directory.txt'
                  [IO.File]::WriteAllText($fixtureFile, '')
                  function Get-WmtLegendaryExePath { Join-Path $testRoot 'legendary.exe' }
                  function Invoke-WmtProcess {
                      param($FilePath, $Arguments, $TimeoutMs, $Encoding, [switch]$KillTree)
                      if ($Arguments -ne 'list-installed --json') { throw 'Folder resolution must use the local installed list.' }
                      $rows = @(
                          @{ app_name = 'another-game'; title = 'Other'; install_path = $testRoot; version = '1'; platform = 'Windows' },
                          @{ app_name = 'game1'; title = 'Installed'; install_path = $installDirectory; version = '1'; platform = 'Windows' }
                      )
                      [pscustomobject]@{ ExitCode = 0; StdOut = ($rows | ConvertTo-Json); StdErr = ''; Error = ''; TimedOut = $false }
                  }
                  foreach ($source in @('Epic', 'Legendary')) {
                      foreach ($oldPath in @('', (Join-Path $testRoot 'missing-directory'), $fixtureFile)) {
                          $row = [pscustomobject]@{ Id = 'GAME1'; Source = $source; InstallPath = $oldPath; IsInstalled = $true }
                          if ((Get-WmtLibraryItemInstallDir -Item $row) -ne $installDirectory) { throw "Could not recover $source directory from the local installed list." }
                      }
                  }
              }

              Test-Case 'An API failure still writes all nine installed games' {
                  $r = Invoke-TestWorker (Join-Path $testRoot 'installed-only')
                  if ($r.Rows.Count -ne 9 -or @($r.Rows | Where-Object IsInstalled).Count -ne 9) {
                      throw "Expected 9 installed games, got $($r.Rows.Count) rows."
                  }
                  if (($r.Rows | Where-Object Id -eq 'game1').InstallPath -ne 'C:\Games\Game1') { throw 'Install path was lost.' }
              }

              $assets = @(1..2000 | ForEach-Object {
                  @{ app_name = "asset$_"; namespace = 'ue'; catalog_item_id = "catalog$_"; build_version = '5.4' }
              }) + @(@{ app_name = 'game1'; namespace = 'game'; catalog_item_id = 'game-catalog'; build_version = '2.0' })
              [IO.File]::WriteAllText((Join-Path $env:LEGENDARY_CONFIG_PATH 'assets.json'), (@{ Windows = $assets } | ConvertTo-Json -Depth 5))
              $metadataRoot = Join-Path $env:LEGENDARY_CONFIG_PATH 'metadata'
              [void][IO.Directory]::CreateDirectory($metadataRoot)
              [IO.File]::WriteAllText((Join-Path $metadataRoot 'game1.json'), '{"app_name":"game1","app_title":"Owned game one","metadata":{"id":"game-catalog","namespace":"game"}}')
              [IO.File]::WriteAllText((Join-Path $metadataRoot 'asset1.json'), '{"app_name":"asset1","app_title":"Fab asset one","metadata":{"id":"catalog1","namespace":"ue"}}')

              Test-Case 'An API failure recovers thousands of cached assets and merges installs without duplicates' {
                  $directory = Join-Path $testRoot 'with-assets'
                  [void][IO.Directory]::CreateDirectory($directory)
                  [IO.File]::WriteAllText((Join-Path $directory 'settings.json'), '{"HideLegendaryUeAssets":false}')
                  $r = Invoke-TestWorker $directory
                  if ($r.Rows.Count -ne 2009) { throw "Expected 2009 rows, got $($r.Rows.Count)." }
                  if (@($r.Rows | Where-Object IsInstalled).Count -ne 9) { throw 'Installed count must be 9.' }
                  if (@($r.Rows | Where-Object IsUe).Count -ne 2000) { throw 'Fab assets must retain their namespace tag.' }
                  $game = @($r.Rows | Where-Object Id -eq 'game1')
                  if ($game.Count -ne 1 -or $game[0].Title -ne 'Owned game one' -or $game[0].Version -ne '2.0') { throw 'Owned/installed merge lost the title or current version.' }
                  if (($r.Rows | Where-Object Id -eq 'asset1').Title -ne 'Fab asset one') { throw 'Cached asset title was lost.' }
                  if (($r.Logs -join '; ') -notmatch '(?i)using.*local.*catalog') { throw 'Catalog fallback must be reported.' }
              }

              Test-Case 'Hiding Fab assets keeps the nine installed games' {
                  $r = Invoke-TestWorker (Join-Path $testRoot 'hide-assets')
                  if ($r.Rows.Count -ne 9 -or @($r.Rows | Where-Object IsUe).Count -ne 0) { throw 'Hidden assets leaked into the game library.' }
              }

              Test-Case 'Offline recovery preserves known titles and installed state if the install query fails' {
                  $directory = Join-Path $testRoot 'preserve-cache'
                  [void][IO.Directory]::CreateDirectory($directory)
                  $oldRows = @(
                      @{ Id = 'asset2'; Title = 'Known Fab title'; Version = '5.4'; IsInstalled = $false; IsUe = $true },
                      @{ Id = 'game1'; Title = 'Known installed game'; Version = '2.0'; IsInstalled = $true;
                         InstalledVersion = '1.0'; InstallPath = 'C:\Games\Game1'; Platform = 'Windows'; IsUe = $false },
                      @{ Id = 'previous-only'; Title = 'Previously owned'; Version = '1'; IsInstalled = $false; IsUe = $false }
                  )
                  [IO.File]::WriteAllText((Join-Path $directory 'legendary_library.json'), ($oldRows | ConvertTo-Json))
                  [IO.File]::WriteAllText((Join-Path $directory 'settings.json'), '{"HideLegendaryUeAssets":false}')
                  $failureFlag = Join-Path $testRoot 'fail-installed'
                  [IO.File]::WriteAllText($failureFlag, '')
                  try {
                      $r = Invoke-TestWorker $directory
                      $game = $r.Rows | Where-Object Id -eq 'game1'
                      if (-not $game.IsInstalled -or $game.InstalledVersion -ne '1.0' -or $game.InstallPath -ne 'C:\Games\Game1') { throw 'An unavailable installed query erased the last known install.' }
                      if (($r.Rows | Where-Object Id -eq 'asset2').Title -ne 'Known Fab title') { throw 'A cached title was replaced with an app ID.' }
                      if (@($r.Rows | Where-Object Id -eq 'previous-only').Count -ne 0) { throw 'Fallback imported an entry absent from the active account assets.' }
                  }
                  finally { Remove-Item -LiteralPath $failureFlag }
              }

              # Exercise the scheduler and completion callback too: a fresh [] cache used
              # to suppress rebuilding for 24 hours, and runspace errors were discarded.
              function Get-WmtSettings { @{ EnabledProviders = @('legendary') } }
              function Get-WmtProviderToggles { param($Settings) @{} }
              function Get-DataPath { Join-Path $testRoot 'scheduler' }
              function Get-WmtLegendaryExePath { Join-Path $testRoot 'legendary.exe' }
              function Get-WmtGogdlAuthConfigPath { Join-Path $testRoot 'missing-auth.json' }
              function Write-GuiLog { param($Message) [void]$script:testLogs.Add([string]$Message) }
              function Unregister-WmtUiPollOperation { param($Name) }
              function Start-WmtLibraryScan { param([switch]$Silent) }
              function Register-WmtUiPollOperation {
                  param($Name, $IntervalMs, $TestComplete, $OnComplete)
                  $script:testOnComplete = $OnComplete
              }
              function New-WmtPooledPowerShell {
                  $script:testRunspace = [runspacefactory]::CreateRunspace((New-WmtRunspaceInitialState))
                  $script:testRunspace.Open()
                  $ps = [PowerShell]::Create()
                  $ps.Runspace = $script:testRunspace
                  # Non-terminating errors are not thrown by EndInvoke.
                  [void]$ps.AddScript('Write-Error "Diagnostic stream regression"')
                  return $ps
              }
              foreach ($cacheText in @('[]', '{broken')) {
                  Test-Case "A fresh invalid cache ($cacheText) rebuilds and reports worker errors" {
                      $script:testLogs = [System.Collections.Generic.List[string]]::new()
                      $script:testOnComplete = $null
                      $script:WmtLibraryCacheRunspace = $null
                      $script:WmtLibraryCacheAsyncResult = $null
                      $directory = Get-DataPath
                      [void][IO.Directory]::CreateDirectory($directory)
                      [IO.File]::WriteAllText((Join-Path $directory 'legendary_library.json'), $cacheText)
                      try {
                          Start-WmtLibraryCacheBuilder
                          if (-not $script:WmtLibraryCacheAsyncResult) { throw 'Invalid cache suppressed the rebuild.' }
                          if (-not $script:WmtLibraryCacheAsyncResult.AsyncWaitHandle.WaitOne(15000)) { throw 'Worker did not finish.' }
                          & $script:testOnComplete
                          $rows = [IO.File]::ReadAllText((Join-Path $directory 'legendary_library.json')) | ConvertFrom-Json
                          if (@($rows).Count -ne 9) { throw 'Scheduler did not rebuild the installed library.' }
                          if (($script:testLogs -join '; ') -notmatch 'Diagnostic stream regression') { throw 'Worker error stream was swallowed.' }
                      }
                      finally {
                          if ($script:WmtLibraryCacheRunspace) { $script:WmtLibraryCacheRunspace.Dispose() }
                          if ($script:testRunspace) { $script:testRunspace.Dispose() }
                      }
                  }
              }
          }
          finally {
              $env:LEGENDARY_CONFIG_PATH = $originalConfig
              $resolvedTestRoot = [IO.Path]::GetFullPath($testRoot)
              $tempRoot = [IO.Path]::GetFullPath([IO.Path]::GetTempPath()).TrimEnd('\') + '\'
              if ($resolvedTestRoot.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase) -and
                  [IO.Path]::GetFileName($resolvedTestRoot).StartsWith('WmtLegendaryTests-')) {
                  Remove-Item -LiteralPath $resolvedTestRoot -Recurse -Force
              }
          }
          if ($failures.Count) { throw ($failures -join [Environment]::NewLine) }

      - name: Test pagefile configuration contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'WMT-GUI.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          foreach ($name in @('ConvertTo-WmtPagefileConfiguration', 'Get-WmtPagefileConfiguredState', 'Write-WmtPagefileBackup', 'Read-WmtPagefileBackup')) {
            $fn = $ast.Find({ param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
            }, $true)
            if (-not $fn) { throw "Missing pagefile function $name" }
            Invoke-Expression $fn.Extent.Text
          }
          $configuration = [pscustomobject]@{
            Version = 1
            AutomaticManagedPagefile = $false
            PagingFilesPresent = $true
            PagingFiles = [string[]]@('C:\pagefile.sys 1024 2048', 'D:\pagefile.sys 4096 8192')
          }
          if (-not (Get-WmtPagefileConfiguredState $configuration)) { throw 'Multiple paging files not detected' }
          $disabled = [pscustomobject]@{ Version = 1; AutomaticManagedPagefile = $false; PagingFilesPresent = $true; PagingFiles = [string[]]@() }
          if (Get-WmtPagefileConfiguredState $disabled) { throw 'Empty manual paging configuration reported enabled' }
          $automatic = [pscustomobject]@{ Version = 1; AutomaticManagedPagefile = $true; PagingFilesPresent = $true; PagingFiles = [string[]]@() }
          if (-not (Get-WmtPagefileConfiguredState $automatic)) { throw 'Automatic management reported disabled' }
          $backup = Join-Path $env:RUNNER_TEMP ('wmt-pagefile-' + [guid]::NewGuid().ToString('N') + '.json')
          try {
            Write-WmtPagefileBackup -Configuration $configuration -BackupPath $backup
            $restored = Read-WmtPagefileBackup -BackupPath $backup
            if ($restored.PagingFiles.Count -ne 2 -or -not ($restored.PagingFiles[1] -eq 'D:\pagefile.sys 4096 8192')) { throw 'Multi-drive backup round-trip mismatch' }
            [IO.File]::WriteAllText($backup, '{broken')
            $rejected = $false
            try { $null = Read-WmtPagefileBackup -BackupPath $backup } catch { $rejected = $true }
            if (-not $rejected) { throw 'Corrupt backup was silently accepted' }
            Write-Host 'Pagefile configuration and restore tests passed.'
          }
          finally { if (Test-Path -LiteralPath $backup) { Remove-Item -LiteralPath $backup -Force } }

      - name: Smoke test settings persistence
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = [System.IO.File]::ReadAllText((Resolve-Path ".\WMT-GUI.ps1").Path)
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput(
              $source,
              [ref]$tokens,
              [ref]$parseErrors
          )
          if ($parseErrors -and $parseErrors.Count -gt 0) {
              throw "WMT-GUI.ps1 unexpectedly failed AST parsing in settings smoke test."
          }

          $needed = @(
              "Get-WmtSettingsFileStamp",
              "Test-WmtSettingsMember",
              "Get-WmtSettingsMember",
              "ConvertTo-WmtSettingsBoolean",
              "Test-WmtFiniteDouble",
              "Move-WmtCorruptSettingsFile",
              "Write-WmtSettingsFileAtomic",
              "Copy-WmtSettingsValue",
              "Copy-WmtSettings",
              "Save-WmtSettings",
              "Get-WmtSettings",
              "Get-WmtWingetIncludeUnknown",
              "Get-WmtCustomUpdateCommands",
              "Get-WmtUpdateAutoScanMinutes",
              "Get-WmtUpdateNotificationsEnabled",
              "Get-WmtUpdateSilentInstallEnabled",
              "Get-WmtUpdateAutoInstallEnabled",
              "Get-WmtRunInTrayOnClose",
              "Get-WmtReduceRamInTray",
              "Get-WmtDisableBackgroundJobs",
              "Get-WmtDebugMode",
              "Get-WmtUpdateScansDisabled",
              "Get-WmtHideLegendaryUeAssets",
              "Get-WmtSavedUpdateAutoScanMinutes",
              "Get-WmtCleanerLocalRefreshMinutes",
              "Get-WmtCleanerRemoteCheckMinutes",
              "Get-WmtCleanerAutoCleanMinutes"
          )

          foreach ($name in $needed) {
              $fn = $ast.Find({
                      param($node)
                      $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                      $node.Name -eq $name
                  }, $true)
              if (-not $fn) { throw "Required settings function '$name' was not found." }
              Invoke-Expression $fn.Extent.Text
          }

          function Get-DataPath { return $script:SettingsTestDataPath }
          function Write-GuiLog { param([string]$Message) }
          function ConvertTo-Int {
              param($Value, [int]$Default = 0)
              try {
                  if ($null -eq $Value -or "" -eq $Value) { return $Default }
                  return [int]$Value
              }
              catch { return $Default }
          }

          $script:SettingsTestDataPath = Join-Path $env:RUNNER_TEMP ("wmt-settings-" + [guid]::NewGuid().ToString("N"))
          [void][System.IO.Directory]::CreateDirectory($script:SettingsTestDataPath)
          $script:WmtSettingsCache = $null
          $script:WmtSettingsCacheStamp = $null
          $script:WmtSettingsWriteMutexName = "Local\Wmt_Settings_CI_" + [guid]::NewGuid().ToString("N")

          try {
              $s = Get-WmtSettings
              $s.CleanerLocalRefreshMinutes = 17
              $s.CleanerRemoteCheckMinutes = 31
              $s.CleanerAutoCleanMinutes = 47
              $s.DebugMode = $true
              $s.RememberSubwindowBounds = $false
              $s.SubwindowBounds = @{
                  DiskUsageAnalyzer = @{ Width = 1300; Height = 900; WindowState = "Maximized" }
                  GhostDevices = @{ Width = 1000; Height = 700; WindowState = "Normal" }
              }
              Save-WmtSettings -Settings $s

              $script:WmtSettingsCache = $null
              $script:WmtSettingsCacheStamp = $null
              $loaded = Get-WmtSettings
              if ($loaded.CleanerLocalRefreshMinutes -ne 17 -or
                  $loaded.CleanerRemoteCheckMinutes -ne 31 -or
                  $loaded.CleanerAutoCleanMinutes -ne 47) {
                  throw "Cleaner interval settings did not survive the first save/reload."
              }
              if (-not (Get-WmtDebugMode -Settings $loaded)) {
                  throw "DebugMode did not survive the first save/reload."
              }
              if ($loaded.RememberSubwindowBounds -ne $false) {
                  throw "RememberSubwindowBounds did not survive the first save/reload."
              }
              if ($loaded.SubwindowBounds.DiskUsageAnalyzer.Width -ne 1300 -or
                  $loaded.SubwindowBounds.GhostDevices.Height -ne 700 -or
                  $loaded.SubwindowBounds.DiskUsageAnalyzer.WindowState -ne "Maximized" -or
                  $loaded.SubwindowBounds.GhostDevices.WindowState -ne "Normal") {
                  throw "Resizable subwindow bounds did not survive the first save/reload."
              }

              # Regression guard for the original bug: an unrelated setting save
              # must not reset the cleaner interval values to 60/1440/0.
              $loaded.Theme = "light"
              Save-WmtSettings -Settings $loaded

              $settingsPath = Join-Path $script:SettingsTestDataPath "settings.json"
              $backupPath = "$settingsPath.bak"
              if (-not (Test-Path -LiteralPath $backupPath -PathType Leaf)) {
                  throw "Atomic settings save did not create settings.json.bak."
              }

              $script:WmtSettingsCache = $null
              $script:WmtSettingsCacheStamp = $null
              $again = Get-WmtSettings
              if ($again.CleanerLocalRefreshMinutes -ne 17 -or
                  $again.CleanerRemoteCheckMinutes -ne 31 -or
                  $again.CleanerAutoCleanMinutes -ne 47) {
                  throw "Unrelated settings save reset cleaner intervals."
              }
              if ($again.SubwindowBounds.DiskUsageAnalyzer.Width -ne 1300 -or
                  $again.SubwindowBounds.GhostDevices.Height -ne 700 -or
                  $again.SubwindowBounds.DiskUsageAnalyzer.WindowState -ne "Maximized") {
                  throw "Unrelated settings save reset resizable subwindow bounds."
              }
              if ($again.Theme -ne "light") { throw "Unrelated Theme setting was not persisted." }
              if (-not (Get-WmtDebugMode -Settings $again)) { throw "Unrelated settings save reset DebugMode." }
              if ($again.RememberSubwindowBounds -ne $false) { throw "Unrelated settings save reset RememberSubwindowBounds." }

              # Corrupt the primary file. Get-WmtSettings should archive it and
              # recover the previous known-good generation from .bak.
              [System.IO.File]::WriteAllText($settingsPath, "{ broken", [System.Text.UTF8Encoding]::new($false))
              $script:WmtSettingsCache = $null
              $script:WmtSettingsCacheStamp = $null
              $recovered = Get-WmtSettings
              if ($recovered.CleanerAutoCleanMinutes -ne 47) {
                  throw "Settings backup recovery did not restore saved cleaner values."
              }
              if (@(Get-ChildItem -LiteralPath $script:SettingsTestDataPath -Filter "settings.corrupt-*.json").Count -lt 1) {
                  throw "Corrupt settings file was not preserved for diagnosis."
              }

              # The cache must notice a valid external/manual edit.
              $disk = Get-Content -LiteralPath $settingsPath -Raw | ConvertFrom-Json
              $disk.Theme = "dark"
              $disk.DebugMode = $false
              [System.IO.File]::WriteAllText(
                  $settingsPath,
                  ($disk | ConvertTo-Json -Depth 8),
                  [System.Text.UTF8Encoding]::new($false)
              )
              $external = Get-WmtSettings
              if ($external.Theme -ne "dark" -or (Get-WmtDebugMode -Settings $external)) {
                  throw "Settings cache did not invalidate after an external file change."
              }

              Write-Host "OK: settings persistence, interval retention, DebugMode persistence, backup recovery, and cache invalidation."
          }
          finally {
              try { Remove-Item -LiteralPath $script:SettingsTestDataPath -Recurse -Force -ErrorAction SilentlyContinue } catch {}
          }


      - name: Smoke test centralized background-operation manager
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The manager now lives inside WMT-GUI.ps1; extract just that block
          # (state init through Stop-WmtBackgroundOperationManager) and load it.
          $source = [System.IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $startMarker = 'if (-not (Get-Variable -Name WmtBackgroundOperationState'
          $endMarker = 'Initialize-WmtBackgroundOperationManager -Log {'
          $start = $source.IndexOf($startMarker, [System.StringComparison]::Ordinal)
          $end = $source.IndexOf($endMarker, [System.StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) { throw 'Background-operation manager block not found in WMT-GUI.ps1.' }
          $managerSource = $source.Substring($start, $end - $start)
          Invoke-Expression $managerSource
          $script:managerCallbackState = $null
          Initialize-WmtBackgroundOperationManager
          $id = Start-WmtBackgroundOperation -Name 'ci-success' -ScriptBlock {
              param($value)
              Start-Sleep -Milliseconds 100
              return ($value * 2)
          } -ArgumentList @(21) -TimeoutSeconds 10 -OnCompleted {
              param($record)
              $script:managerCallbackState = $record
          }
          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while (@(Get-WmtBackgroundOperationSnapshot).Count -gt 0 -and [DateTime]::UtcNow -lt $deadline) {
              [void](Update-WmtBackgroundOperations)
              Start-Sleep -Milliseconds 25
          }
          if (@(Get-WmtBackgroundOperationSnapshot).Count -ne 0) { throw 'Completed operation was not retired.' }
          if (-not $script:managerCallbackState -or $script:managerCallbackState.Id -ne $id) { throw 'Completion callback was not delivered.' }
          if ($script:managerCallbackState.State -ne 'Completed' -or @($script:managerCallbackState.Result).Count -ne 1 -or $script:managerCallbackState.Result[0] -ne 42) {
              throw 'Successful operation result/state was not preserved.'
          }

          $cancelId = Start-WmtBackgroundOperation -Name 'ci-cancel' -ScriptBlock {
              Start-Sleep -Seconds 20
              return 'should-not-finish-normally'
          } -TimeoutSeconds 30
          if (-not (Request-WmtBackgroundOperationCancellation -Id $cancelId -Reason 'CI cancellation test')) {
              throw 'Cancellation request was rejected.'
          }
          $deadline = [DateTime]::UtcNow.AddSeconds(10)
          while (@(Get-WmtBackgroundOperationSnapshot).Count -gt 0 -and [DateTime]::UtcNow -lt $deadline) {
              [void](Update-WmtBackgroundOperations)
              Start-Sleep -Milliseconds 25
          }
          if (@(Get-WmtBackgroundOperationSnapshot).Count -ne 0) { throw 'Cancelled operation did not drain/retire.' }
          if ($script:WmtBackgroundOperationState.Operations.Count -ne 0) { throw 'Manager retained completed PowerShell instances.' }
          Write-Host 'Background-operation manager completion/cancellation checks passed.'

      - name: Verify Analyze mode never executes REMOVESELF deletion
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Regression guard for issue #168: Analyze mode (including the in-process
          # fallback used when the out-of-process analyzer fails) must never delete
          # a directory through a Winapp2 REMOVESELF rule.
          $path = (Resolve-Path '.\WMT-GUI.ps1').Path
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "Parse errors: $($errors[0].Message)" }

          $removeSelfIfs = @($ast.FindAll({
              param($n)
              $n -is [System.Management.Automation.Language.IfStatementAst] -and
              $n.Clauses.Count -gt 0 -and $n.Clauses[0].Item1.Extent.Text -match 'RemoveSelf'
          }, $true))
          if ($removeSelfIfs.Count -eq 0) { throw 'No REMOVESELF handling found; guard is stale.' }

          $checked = 0
          foreach ($rs in $removeSelfIfs) {
              $deletes = @($rs.FindAll({
                  param($n)
                  $n -is [System.Management.Automation.Language.CommandAst] -and $n.GetCommandName() -eq 'Remove-Item'
              }, $true))
              foreach ($cmd in $deletes) {
                  $checked++
                  $guarded = $false
                  $node = $cmd.Parent
                  while ($node -and -not [object]::ReferenceEquals($node, $rs.Parent)) {
                      if ($node -is [System.Management.Automation.Language.IfStatementAst]) {
                          $s = $cmd.Extent.StartOffset; $e = $cmd.Extent.EndOffset
                          if ($node.ElseClause -and $s -ge $node.ElseClause.Extent.StartOffset -and $e -le $node.ElseClause.Extent.EndOffset) {
                              if ($node.Clauses | Where-Object { $_.Item1.Extent.Text.Trim() -eq '$isAnalyze' }) { $guarded = $true }
                          }
                          foreach ($c in $node.Clauses) {
                              if ($c.Item1.Extent.Text -match '^\s*-not\s+\$isAnalyze\s*$' -and $s -ge $c.Item2.Extent.StartOffset -and $e -le $c.Item2.Extent.EndOffset) { $guarded = $true }
                          }
                      }
                      $node = $node.Parent
                  }
                  if (-not $guarded) {
                      throw "Unguarded Remove-Item in REMOVESELF block at line $($cmd.Extent.StartLineNumber): Analyze mode must never delete."
                  }
              }
          }
          if ($checked -eq 0) { throw 'REMOVESELF block has no Remove-Item; guard is stale.' }
          Write-Host "OK: $checked REMOVESELF deletion(s) are unreachable in Analyze mode."

          # Behavioural check: run the real REMOVESELF block against a disposable directory.
          $blockText = $removeSelfIfs[0].Extent.Text
          foreach ($mode in @($true, $false)) {
              $isAnalyze = $mode
              $root = Join-Path ([System.IO.Path]::GetTempPath()) ("wmt-removeself-" + [guid]::NewGuid().ToString('N'))
              try {
                  $null = New-Item -ItemType Directory -Path (Join-Path $root 'keep') -Force
                  Set-Content -LiteralPath (Join-Path $root 'keep/important.txt') -Value 'data'
                  $rule = [pscustomobject]@{ Path = $root; RemoveSelf = $true }
                  $stats = @{ Deleted = 0 }
                  Invoke-Expression $blockText
                  $exists = Test-Path -LiteralPath (Join-Path $root 'keep/important.txt')
                  if ($mode) {
                      if (-not $exists) { throw 'Analyze mode deleted files via REMOVESELF.' }
                      if ($stats.Deleted -ne 1) { throw 'Analyze mode did not record the REMOVESELF preview.' }
                  }
                  else {
                      if (Test-Path -LiteralPath $root) { throw 'Clean mode failed to remove the REMOVESELF directory.' }
                  }
              }
              finally { if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue } }
          }
          Write-Host 'OK: REMOVESELF behaviour verified (Analyze preserves files; Clean removes directory).'

      - name: Verify no calls to undefined functions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Catches calls to helpers that were renamed, deleted or never written
          # (they otherwise fail at runtime, often inside a swallowed catch block).
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }

          $defined = @{}
          foreach ($f in $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) { $defined[$f.Name] = $true }
          # Functions defined inside embedded here-string scripts are invisible to the AST.
          foreach ($m in [regex]::Matches($source, '(?im)^\s*function\s+(?:(?:script|global|local):)?([A-Za-z][\w-]*)')) { $defined[$m.Groups[1].Value] = $true }

          # Windows-only cmdlets that are not guaranteed to exist on every runner.
          $windowsOnly = @(
              'Add-WindowsCapability', 'Checkpoint-Computer', 'Clear-DnsClientCache',
              'Disable-ComputerRestore', 'Disable-MMAgent', 'Disable-WindowsOptionalFeature',
              'Enable-ComputerRestore', 'Enable-MMAgent', 'Enable-WindowsOptionalFeature', 'Get-Acl',
              'Get-AppxPackage', 'Get-BitLockerVolume', 'Get-BitsTransfer', 'Get-CimInstance',
              'Get-ComputerRestorePoint', 'Get-Disk', 'Get-MMAgent', 'Get-MpPreference', 'Get-NetAdapter', 'Get-NetIPInterface',
              'Get-NetFirewallPortFilter', 'Get-NetFirewallRule', 'Get-Partition', 'Get-PnpDevice',
              'Get-Service', 'Get-StartApps', 'Get-Volume', 'Get-WindowsCapability', 'Get-WindowsDriver',
              'Get-WindowsOptionalFeature', 'Get-WmiObject', 'Invoke-CimMethod', 'New-NetFirewallRule',
              'Optimize-Volume', 'Register-DnsClient', 'Remove-AppxPackage', 'Remove-BitsTransfer',
              'Remove-NetFirewallRule', 'Remove-WindowsCapability', 'Restart-NetAdapter', 'Restart-Service',
              'Restore-Computer', 'Set-Acl', 'Set-CimInstance', 'Set-DnsClientServerAddress',
              'Set-NetFirewallRule', 'Set-Service', 'Start-Service', 'Stop-Service'
          )

          $missing = @{}
          $commands = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] }, $true)
          foreach ($c in $commands) {
              $name = $c.GetCommandName()
              if (-not $name -or $name -notmatch '^[A-Za-z]+-[A-Za-z0-9]+$') { continue }
              if ($defined.ContainsKey($name) -or $windowsOnly -contains $name) { continue }
              if (Get-Command $name -ErrorAction SilentlyContinue) { continue }
              if (-not $missing.ContainsKey($name)) { $missing[$name] = $c.Extent.StartLineNumber }
          }
          if ($missing.Count -gt 0) {
              $missing.GetEnumerator() | Sort-Object Name | ForEach-Object { Write-Host ("Undefined command: {0} (first used at line {1})" -f $_.Name, $_.Value) }
              throw 'WMT-GUI.ps1 calls commands that are not defined. Fix the name, define the function, or (for a Windows-only cmdlet) add it to $windowsOnly.'
          }
          Write-Host 'OK: every called command is defined or a known cmdlet.'

      - name: Verify BAM NT path conversion
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $fn = @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -in 'Convert-BamNtToDos', 'Get-BamDeviceMap' }, $true))
          if ($fn.Count -ne 2) { throw "Expected Convert-BamNtToDos and Get-BamDeviceMap, found $($fn.Count)." }
          $convert = ($fn | Where-Object { $_.Name -eq 'Convert-BamNtToDos' }).Extent.Text
          $real = ($fn | Where-Object { $_.Name -eq 'Get-BamDeviceMap' }).Extent.Text

          # Conversion logic with a mocked device map: unmapped/ambiguous/network paths must yield $null.
          function Get-BamDeviceMap { @{ '\device\harddiskvolume3' = 'C:'; '\device\harddiskvolume4' = 'D:'; '\device\harddiskvolume7' = $null } }
          Invoke-Expression $convert
          $cases = @(
              @('\Device\HarddiskVolume3\Windows\System32\cmd.exe', 'C:\Windows\System32\cmd.exe'),
              @('\DEVICE\HARDDISKVOLUME4\Games\a.exe', 'D:\Games\a.exe'),
              @('\Device\HarddiskVolume3', 'C:'),
              @('\Device\HarddiskVolume9\a.exe', $null),
              @('\Device\HarddiskVolume7\a.exe', $null),
              @('\Device\HarddiskVolume33\a.exe', $null),
              @('\Device\Mup\srv\share\a.exe', $null),
              @('C:\already\dos.exe', $null),
              @('', $null)
          )
          foreach ($c in $cases) {
              $got = Convert-BamNtToDos -NtPath $c[0]
              if ($got -ne $c[1]) { throw "BAM conversion failed: '$($c[0])' => '$got' (expected '$($c[1])')" }
          }

          # The real QueryDosDevice-based map must see the system drive on Windows.
          Remove-Item function:Get-BamDeviceMap
          Invoke-Expression $real
          $map = Get-BamDeviceMap
          if ($env:OS -eq 'Windows_NT' -and $map.Values -notcontains $env:SystemDrive) {
              throw "Get-BamDeviceMap did not map the system drive $env:SystemDrive."
          }
          Write-Host 'OK: BAM NT path conversion verified.'

      - name: Verify no variable name swallows a trailing question mark
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # "$name?" reads a variable literally called "name?" (empty), so the name and the
          # question mark both vanish from the message. Use "$($name)?" or "${name}?".
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\WMT-GUI.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $bad = @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.VariableExpressionAst] -and $n.VariablePath.UserPath -match '\w\?$' }, $true))
          foreach ($v in $bad) { Write-Host ("Line {0}: `${1} swallows a trailing '?'" -f $v.Extent.StartLineNumber, $v.VariablePath.UserPath) }
          if ($bad.Count -gt 0) { throw 'Variable names ending in ? found; wrap the variable in $( ) or ${ }.' }
          Write-Host 'OK: no variable swallows a trailing question mark.'

      - name: Verify startup pool requests wait for an opening pool
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Pools open asynchronously, so the first request after startup (the pagefile status
          # refresh runs while the script is still loading) can see "still opening". Callers must
          # wait for that instead of failing with "The Background runspace pool is not available."
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          function Get-FirstFunction([string]$Name) {
              @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $Name }, $true))[0]
          }

          # 1) Both pool-acquisition points must go through the waiting helper.
          foreach ($name in 'Invoke-WmtUiBackgroundCommand', 'New-WmtPooledPowerShell') {
              $fn = Get-FirstFunction $name
              if (-not $fn) { throw "Function not found: $name" }
              $calls = @($fn.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] }, $true) | ForEach-Object { $_.GetCommandName() })
              if ($calls -notcontains 'Get-WmtReadyRunspacePool') { throw "$name must acquire its pool with Get-WmtReadyRunspacePool." }
              if ($calls -contains 'Get-WmtBackgroundRunspacePool' -or $calls -contains 'Get-WmtUiSupportRunspacePool') {
                  throw "$name must not call the non-waiting pool getters directly."
              }
          }

          # 2) Helper behaviour, using controlled stand-ins for the pool getters.
          $helper = Get-FirstFunction 'Get-WmtReadyRunspacePool'
          if (-not $helper) { throw 'Get-WmtReadyRunspacePool not found.' }
          Invoke-Expression $helper.Extent.Text
          $script:fakePool = [runspacefactory]::CreateRunspacePool(1, 1)
          try {
              $script:getCalls = 0
              function Get-WmtUiSupportRunspacePool { $null }
              function Get-WmtBackgroundRunspacePool { $script:getCalls++; if ($script:getCalls -ge 4) { $script:fakePool } else { $null } }

              # Still opening for the first 3 polls, then ready: must wait and return the pool.
              $script:WmtPoolOpenAsync = @{ Background = 1 }
              $pool = Get-WmtReadyRunspacePool -PoolKind Background -TimeoutMs 5000
              if ($pool -isnot [System.Management.Automation.Runspaces.RunspacePool]) { throw 'Helper did not return the pool once it opened.' }
              if ($script:getCalls -ne 4) { throw "Helper should have polled 4 times, polled $($script:getCalls)." }

              # Not opening at all (closed/broken): must return $null immediately, not wait.
              function Get-WmtBackgroundRunspacePool { $script:getCalls++; $null }
              $script:getCalls = 0; $script:WmtPoolOpenAsync = @{}
              $watch = [Diagnostics.Stopwatch]::StartNew()
              $none = Get-WmtReadyRunspacePool -PoolKind Background -TimeoutMs 5000
              if ($null -ne $none -or $script:getCalls -ne 1 -or $watch.ElapsedMilliseconds -gt 2000) { throw 'Helper waited on a pool that is not opening.' }

              # Opening but never finishing: must honour the timeout.
              $script:WmtPoolOpenAsync = @{ Background = 1 }
              $watch.Restart()
              $late = Get-WmtReadyRunspacePool -PoolKind Background -TimeoutMs 300
              if ($null -ne $late -or $watch.ElapsedMilliseconds -lt 250 -or $watch.ElapsedMilliseconds -gt 5000) { throw "Helper did not honour its timeout ($($watch.ElapsedMilliseconds) ms)." }
          }
          finally { $script:fakePool.Dispose() }
          Write-Host 'OK: startup pool requests wait for an opening pool.'

      - name: Verify quiet background operations still report failures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -Quiet exists so routine status checks (e.g. the startup pagefile refresh) do not clutter
          # the log. It must only hide success: failures and timeouts are always logged.
          $source = [System.IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $startMarker = 'if (-not (Get-Variable -Name WmtBackgroundOperationState'
          $endMarker = 'Initialize-WmtBackgroundOperationManager -Log {'
          $start = $source.IndexOf($startMarker, [System.StringComparison]::Ordinal)
          $end = $source.IndexOf($endMarker, [System.StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) { throw 'Background-operation manager block not found in WMT-GUI.ps1.' }
          Invoke-Expression $source.Substring($start, $end - $start)

          $script:logs = New-Object System.Collections.ArrayList
          Initialize-WmtBackgroundOperationManager -Log { param($m) [void]$script:logs.Add([string]$m) } | Out-Null
          $cases = @(
              @{ Name = 'QuietOk';   Script = { 1 };                        Timeout = 10; Expect = 'silent' },
              @{ Name = 'QuietFail'; Script = { throw 'boom' };             Timeout = 10; Expect = 'logged' },
              @{ Name = 'QuietSlow'; Script = { Start-Sleep -Seconds 20 };  Timeout = 1;  Expect = 'logged' }
          )
          foreach ($case in $cases) {
              $before = $script:logs.Count
              $null = Start-WmtBackgroundOperation -Name $case.Name -ScriptBlock $case.Script -TimeoutSeconds $case.Timeout -Quiet
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              while (@($script:WmtBackgroundOperationState.Operations.Keys).Count -gt 0 -and [DateTime]::UtcNow -lt $deadline) {
                  [void](Update-WmtBackgroundOperations)
                  Start-Sleep -Milliseconds 50
              }
              if (@($script:WmtBackgroundOperationState.Operations.Keys).Count -gt 0) { throw "$($case.Name) did not finish." }
              $new = @($script:logs | Select-Object -Skip $before)
              if (@($new | Where-Object { $_ -like '*Started*' }).Count -gt 0) { throw "$($case.Name): -Quiet must suppress the Started line." }
              if ($case.Expect -eq 'silent' -and $new.Count -gt 0) { throw "$($case.Name): a successful quiet operation must be silent." }
              if ($case.Expect -eq 'logged' -and @($new | Where-Object { $_ -match 'Finished: (Failed|TimedOut)' }).Count -eq 0) {
                  throw "$($case.Name): a failed or timed-out quiet operation must still be logged."
              }
          }
          Write-Host 'OK: quiet operations hide success but still report failures and timeouts.'

      - name: Verify worker errors are never reported blank
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Issue #167: Full Network Repair showed a bare "ERROR:". A native tool's stderr (even a blank
          # line) became an error record with no message, which marks the whole operation failed.
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          function Get-FirstFunction([string]$Name) {
              @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $Name }, $true))[0]
          }

          # 1) The summary text must never be blank.
          $summaryFn = Get-FirstFunction 'Get-WmtErrorSummary'
          if (-not $summaryFn) { throw 'Get-WmtErrorSummary not found.' }
          Invoke-Expression $summaryFn.Extent.Text
          $blank = [System.Management.Automation.ErrorRecord]::new([System.Management.Automation.RemoteException]::new('   '), 'NativeCommandError', 'NotSpecified', $null)
          $text = Get-WmtErrorSummary @($blank)
          if ([string]::IsNullOrWhiteSpace($text) -or $text -notmatch 'NativeCommandError') { throw "Blank error was not described: '$text'" }
          $real = [System.Management.Automation.ErrorRecord]::new([System.Exception]::new('The requested operation requires elevation.'), 'X', 'NotSpecified', $null)
          if ((Get-WmtErrorSummary @($real)) -ne 'The requested operation requires elevation.') { throw 'A real error message must be passed through unchanged.' }
          if ((Get-WmtErrorSummary @($blank, $real)) -notmatch "`n") { throw 'Multiple errors must be listed on separate lines.' }

          # 2) The runner must use the summary rather than raw ToString() of each record.
          $runner = Get-FirstFunction 'Invoke-WmtUiBackgroundCommand'
          if (-not $runner -or $runner.Extent.Text -notmatch 'Get-WmtErrorSummary') { throw 'Invoke-WmtUiBackgroundCommand must build failure text with Get-WmtErrorSummary.' }

          # 3) Full Network Repair must merge native stderr (2>&1) instead of leaking it as errors.
          $repair = Get-FirstFunction 'Start-NetRepair'
          if (-not $repair) { throw 'Start-NetRepair not found.' }
          $merges = @($repair.FindAll({ param($n) $n -is [System.Management.Automation.Language.MergingRedirectionAst] }, $true))
          if ($merges.Count -lt 1) { throw 'Start-NetRepair must merge native stderr with 2>&1.' }
          Write-Host 'OK: worker errors are never blank and Network Repair does not leak stderr as errors.'

      - name: Verify tweak toggles use one on/off convention
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Convention: for on/off tweak toggles the blue ("on") state means the feature is ENABLED. Pairs that
          # are a choice between two modes (not on/off) are listed below and exempt.
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          # Two-mode toggles are exempt; the list lives in the script so the tooltip logic and this check agree.
          $modeAssign = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '$script:WmtTweakModeTogglePairs' }, $true) | Select-Object -First 1
          if (-not $modeAssign) { throw '$script:WmtTweakModeTogglePairs not found in WMT-GUI.ps1.' }
          $modePairs = @($modeAssign.Right.FindAll({ param($n) $n -is [System.Management.Automation.Language.StringConstantExpressionAst] }, $true) | ForEach-Object { $_.Value })
          if ($modePairs.Count -lt 10) { throw "Only $($modePairs.Count) two-mode toggles were read from the script; the list is stale." }
          $problems = New-Object System.Collections.Generic.List[string]
          $calls = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] -and $n.GetCommandName() -eq 'Update-WmtTweakToggle' }, $true)
          $checked = 0
          foreach ($c in $calls) {
              $els = @($c.CommandElements | Select-Object -Skip 1)
              if ($els.Count -lt 4 -or $els[2].Extent.Text -notmatch '^["'']' -or $els[3].Extent.Text -notmatch '^["'']') { continue }
              $on = $els[2].Extent.Text.Trim('"', "'"); $off = $els[3].Extent.Text.Trim('"', "'")
              if ("$on | $off" -in $modePairs) { continue }
              $checked++
              # (1) label order: the blue label must say the feature is on (state labels) or offer the disabling action (verb labels)
              $offWord = '(?i)\b(Off|Disabled)\b'
              $onIsOff = [bool]($on -match $offWord); $offIsOff = [bool]($off -match $offWord)
              if ($onIsOff -xor $offIsOff) {
                  if ($onIsOff) { $problems.Add("Line $($c.Extent.StartLineNumber): blue label '$on' reads as off; blue means on.") }
              }
              elseif ($on -match '^(Show|Enable|Add|Restore)\b' -and $off -match '^(Hide|Disable|Remove)\b') {
                  $problems.Add("Line $($c.Extent.StartLineNumber): blue label '$on' offers to enable, so blue would mean off.")
              }
              # (2) in a click handler, the new state must come from a variable the handler assigns
              $inClick = $false; $handler = $null; $p = $c.Parent
              while ($p) { if ($p -is [System.Management.Automation.Language.InvokeMemberExpressionAst] -and $p.Member.Extent.Text -eq 'Add_Click') { $inClick = $true; $handler = $p; break }; $p = $p.Parent }
              if ($inClick) {
                  $assigned = @{}
                  foreach ($a in $handler.FindAll({ param($n) $n -is [System.Management.Automation.Language.AssignmentStatementAst] }, $true)) {
                      foreach ($v in $a.Left.FindAll({ param($n) $n -is [System.Management.Automation.Language.VariableExpressionAst] }, $true)) { $assigned[$v.VariablePath.UserPath.ToLowerInvariant()] = $true }
                  }
                  foreach ($pa in $handler.FindAll({ param($n) $n -is [System.Management.Automation.Language.ParameterAst] }, $true)) { $assigned[$pa.Name.VariablePath.UserPath.ToLowerInvariant()] = $true }
                  foreach ($v in $els[1].FindAll({ param($n) $n -is [System.Management.Automation.Language.VariableExpressionAst] }, $true)) {
                      $name = $v.VariablePath.UserPath.ToLowerInvariant()
                      if ($name -in 'true', 'false', 'null', '_') { continue }
                      if (-not $assigned.ContainsKey($name)) { $problems.Add("Line $($c.Extent.StartLineNumber): click handler passes `$$($v.VariablePath.UserPath) as the new state but never assigns it.") }
                  }
              }
          }
          if ($checked -lt 100) { throw "Only $checked toggle call sites were checked; the guard is stale." }
          if ($problems.Count -gt 0) { $problems | ForEach-Object { Write-Host $_ }; throw "$($problems.Count) toggle convention problem(s)." }
          Write-Host "OK: $checked toggle call sites follow the blue = on convention."

      - name: Verify Tweaks import migrates old export files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=[IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $t=$null;$e=$null;$ast=[System.Management.Automation.Language.Parser]::ParseInput($src,[ref]$t,[ref]$e)
          foreach($n in 'New-WmtTweaksExportPayload','Get-WmtTweaksImportPlan'){ $f=$ast.FindAll({param($x) $x -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $x.Name -eq $n},$true)[0]; if(-not $f){throw "missing $n"}; Invoke-Expression $f.Extent.Text }
          foreach($listName in '$script:WmtTweakExportV1InvertedNames','$script:WmtTweakExportV1AmbiguousNames'){
            $a=$ast.FindAll({param($x) $x -is [System.Management.Automation.Language.AssignmentStatementAst] -and $x.Left.Extent.Text -eq $listName},$true)[0]
            if(-not $a){ throw "$listName not found" }; Invoke-Expression $a.Extent.Text }
          function Get-Ctrl { param($n) [pscustomobject]@{ IsEnabled=$true; Name=$n } }
          $script:TweakCurrentStates=[ordered]@{
            'btnToggleCopilot'=[pscustomobject]@{On=$true;OnLabel='Copilot On';OffLabel='Copilot Off'}     # new meaning: Copilot enabled
            'btnToggleGameBarIntegration'=[pscustomobject]@{On=$true;OnLabel='x';OffLabel='y'}
            'btnToggleSpatialAudio'=[pscustomobject]@{On=$true;OnLabel='x';OffLabel='y'}                   # NOT in the inverted list (already blue = on)
            'btnMyDeviceCopilotToggle'=[pscustomobject]@{On=$true;OnLabel='x';OffLabel='y'} }
          $script:TweakToggleMirrorNames=@('btnMyDeviceCopilotToggle'); $script:TweakToggleSiblingNames=@{ 'btnMyDeviceCopilotToggle'='btnToggleCopilot' }
          function Make($ver,$tweaks){ $conv=[ordered]@{}; foreach($k in $tweaks.Keys){ $conv[$k]=[pscustomobject]$tweaks[$k] }; $o=[ordered]@{type='wmt-tweaks';tweaks=([pscustomobject]$conv)}; if($null -ne $ver){$o.version=$ver}; [pscustomobject]$o }
          function Check($label,$cond){ if(-not $cond){ throw "FAILED: $label" }; "  ok: $label" }
          "inverted-names list: $($script:WmtTweakExportV1InvertedNames.Count) buttons"
          Check 'invert list contains Copilot, Pagefile, Update ASAP' ((@('btnToggleCopilot','btnTogglePagefile','btnToggleUpdateASAP') | ? { $script:WmtTweakExportV1InvertedNames -notcontains $_ }).Count -eq 0)
          Check 'ambiguous toggles are NOT in the invert list' ((@($script:WmtTweakExportV1AmbiguousNames) | ? { $script:WmtTweakExportV1InvertedNames -contains $_ }).Count -eq 0)
          Check 'ambiguous list covers Ad ID, HAGS, Hibernation and their mirrors' ((@('btnToggleAds','btnToggleHags','btnMyDeviceHagsToggle','btnToggleHibernate','btnMyDeviceHibernateToggle') | ? { $script:WmtTweakExportV1AmbiguousNames -notcontains $_ }).Count -eq 0)
          Check 'list does NOT contain already-correct toggles' ((@('btnToggleSpatialAudio','btnToggleGameMode','btnToggleMemCompression') | ? { $script:WmtTweakExportV1InvertedNames -contains $_ }).Count -eq 0)
          # v1 (no version) file saved when Copilot was OFF (old meaning on=true). Copilot is currently enabled (On=true) => must be turned OFF
          $p=Get-WmtTweaksImportPlan (Make $null @{ btnToggleCopilot=@{on=$true} })
          Check 'v1 Copilot on=true is inverted (desired=false, pending)' ($p.Pending.Count -eq 1 -and $p.Pending[0].Desired -eq $false)
          $p=Get-WmtTweaksImportPlan (Make 1 @{ btnToggleCopilot=@{on=$false} })
          Check 'v1 Copilot on=false (Copilot was enabled) matches current => already ok' ($p.Pending.Count -eq 0 -and $p.AlreadyOk -eq 1)
          $p=Get-WmtTweaksImportPlan (Make 2 @{ btnToggleCopilot=@{on=$true} })
          Check 'v2 Copilot on=true is NOT inverted (already enabled)' ($p.Pending.Count -eq 0 -and $p.AlreadyOk -eq 1)
          $p=Get-WmtTweaksImportPlan (Make 1 @{ btnToggleSpatialAudio=@{on=$true} })
          Check 'v1 toggle that is not in the list keeps its value' ($p.Pending.Count -eq 0 -and $p.AlreadyOk -eq 1)
          $p=Get-WmtTweaksImportPlan (Make 1 @{ btnMyDeviceCopilotToggle=@{on=$true} })
          Check 'v1 mirror button follows its twin (inverted, applied to the twin)' ($p.Pending.Count -eq 1 -and $p.Pending[0].Name -eq 'btnToggleCopilot' -and $p.Pending[0].Desired -eq $false)
          $script:TweakCurrentStates['btnToggleAds']=[pscustomobject]@{On=$true;OnLabel='x';OffLabel='y'}
          $script:TweakCurrentStates['btnMyDeviceHibernateToggle']=[pscustomobject]@{On=$true;OnLabel='x';OffLabel='y'}
          $script:TweakToggleSiblingNames['btnMyDeviceHibernateToggle']='btnToggleHibernate'
          $p=Get-WmtTweaksImportPlan (Make 1 @{ btnToggleAds=@{on=$true} })
          Check 'v1 ambiguous toggle is skipped, not guessed' ($p.Pending.Count -eq 0 -and $p.AlreadyOk -eq 0 -and $p.Skipped -eq 1 -and ($p.SkippedNames -join ' ') -match 'saved by an older version')
          $p=Get-WmtTweaksImportPlan (Make 1 @{ btnMyDeviceHibernateToggle=@{on=$false} })
          Check 'v1 ambiguous mirror is skipped through its twin' ($p.Pending.Count -eq 0 -and $p.Skipped -eq 1)
          $p=Get-WmtTweaksImportPlan (Make 2 @{ btnToggleAds=@{on=$true} })
          Check 'v2 file with the same toggle is applied normally' ($p.Skipped -eq 0 -and $p.AlreadyOk -eq 1)
          $x=New-WmtTweaksExportPayload
          Check 'new exports are version 2' ($x.version -eq 2)
          Check 'new exports use the wmt-tweaks-2 type so older builds refuse them' ($x.type -eq 'wmt-tweaks-2')
          Check 'export writes the current meaning unchanged' ($x.tweaks['btnToggleCopilot'].on -eq $true)
          "import migration: all checks passed"

      - name: Verify Network Repair reporting and restart rules
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Full Network Repair reporting rules. Nothing here runs ipconfig/netsh: it inspects the code and tests the
          # completion callback with the message box and Start-Process replaced by recorders.
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $fn = @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Start-NetRepair' }, $true))[0]
          if (-not $fn) { throw 'Start-NetRepair not found.' }
          $fnText = $fn.Extent.Text
          function Require([string]$what, [bool]$ok) { if (-not $ok) { throw "Network Repair rule violated: $what" } }

          # 1) reporting rules
          Require 'the worker must return a WmtNetworkRepairSummary object' ($fnText -match 'WmtNetworkRepairSummary')
          Require 'the failed-step count must come from the failed steps, not from every warning' ($fnText -match '\$failedStepLabels\.Count' -and $fnText -notmatch '-f \$warnings\.Count')
          Require 'the configuration must be recorded before any change' ($fnText -match 'Configuration before repair')
          Require 'the result must not be assigned (it is piped to Out-Null)' ($fnText -notmatch '\$job\s*=')
          Require 'the restart must use a countdown, not an immediate restart' ($fnText -match '/r /t 20 ' -and $fnText -notmatch '"/t",\s*"0"')
          Require 'the confirmation must warn that static IP settings are cleared' ($source -match 'clears manually configured static IP')

          # 2) the restart prompt only appears when a reset was applied
          $call = @($fn.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] -and $n.GetCommandName() -eq 'Invoke-WmtUiBackgroundCommand' }, $true))[0]
          $els = @($call.CommandElements); $idx = -1
          for ($k = 0; $k -lt $els.Count; $k++) { if ($els[$k] -is [System.Management.Automation.Language.CommandParameterAst] -and $els[$k].ParameterName -eq 'OnComplete') { $idx = $k + 1 } }
          if ($idx -lt 0) { throw 'Start-NetRepair has no -OnComplete callback.' }
          $cbText = $els[$idx].Extent.Text
          $cbText = $cbText.Replace('[System.Windows.MessageBox]::Show(', 'MockShow(').Replace('[System.Windows.MessageBoxButton]::YesNo', '"YesNo"').Replace('[System.Windows.MessageBoxButton]::OK', '"OK"').Replace('[System.Windows.MessageBoxImage]::Question', '"Question"').Replace('[System.Windows.MessageBoxImage]::Warning', '"Warning"').Replace('[System.Windows.MessageBoxResult]::Yes', '"Yes"')
          $script:shown = @(); $script:started = @(); $script:answer = 'Yes'
          function MockShow { param($Message, $Title, $Button, $Image) $script:shown += [string]$Message; return $script:answer }
          function Show-WmtMessageBox { param($Message, $Title, $Button, $Image) MockShow -Message $Message -Title $Title -Button $Button -Image $Image }
          function Start-Process { param($FilePath, $ArgumentList, $WindowStyle) $script:started += $ArgumentList }
          $callback = & ([scriptblock]::Create($cbText))
          function Summary($failed, $restart) { [pscustomobject]@{ WmtNetworkRepairSummary = $true; FailedSteps = $failed; RestartRecommended = $restart } }

          & $callback @('Network repair completed.', (Summary 0 $true))
          Require 'a restart must be offered when a reset was applied' ($script:shown.Count -eq 1 -and $script:started.Count -eq 1)
          Require 'the restart must count down and tell the user how to cancel' ($script:started[0] -match '/r /t 20 ' -and $script:shown[0] -match 'shutdown /a')
          $script:shown = @(); $script:started = @()
          & $callback @((Summary 2 $true))
          Require 'failed steps must be mentioned in the prompt' ($script:shown[0] -match '2 step\(s\) reported problems')
          $script:shown = @(); $script:started = @()
          & $callback @('Network repair completed with warnings: x.', (Summary 2 $false))
          Require 'no restart prompt when neither reset was applied' ($script:shown.Count -eq 0 -and $script:started.Count -eq 0)
          & $callback @('no summary object here')
          Require 'no restart prompt when the summary is missing' ($script:shown.Count -eq 0)
          $script:answer = 'No'
          & $callback @((Summary 0 $true))
          Require 'declining the prompt must not restart Windows' ($script:started.Count -eq 0)
          Write-Host 'OK: Network Repair reports failures once, records the configuration, and offers a restart only when a reset was applied.'

      - name: Smoke test shared runspace helpers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = [System.IO.File]::ReadAllText((Resolve-Path ".\\WMT-GUI.ps1").Path)

          # Regression guard: a closure-capture typo such as "$x = $x" silently
          # turns the captured local into $null and previously broke Library search.
          $selfAssignments = [regex]::Matches(
              $source,
              '(?m)^\s*\$([A-Za-z_][\w]*)\s*=\s*\$\1\s*$'
          )
          if ($selfAssignments.Count -gt 0) {
              $found = @($selfAssignments | ForEach-Object { $_.Value.Trim() }) -join "; "
              throw "Suspicious self-assignment regression detected: $found"
          }

          # GetNewClosure() changes $script: resolution to its dynamic module.
          # Cleaner process completion handlers must capture the real script
          # variable and only clear it when it still points at their process.
          $closureStateGuards = @(
              @{
                  ProcessState = '$refreshProcessState = Get-Variable -Name WmtCleanerRefreshProcess -Scope Script'
                  IdentityGuard = '[object]::ReferenceEquals($refreshProcessState.Value, $refreshProcess)'
              },
              @{
                  ProcessState = '$autoCleanProcessState = Get-Variable -Name WmtCleanerAutoCleanProcess -Scope Script'
                  IdentityGuard = '[object]::ReferenceEquals($autoCleanProcessState.Value, $autoCleanProcess)'
              }
          )
          foreach ($guard in $closureStateGuards) {
              if (-not $source.Contains($guard.ProcessState) -or -not $source.Contains($guard.IdentityGuard)) {
                  throw "Cleaner GetNewClosure process-state regression detected."
              }
          }

          # Driver cleanup can launch a second background job from inside the
          # first-pass GetNewClosure() callback. The nested completion/error
          # callbacks must use locals captured in that callback rather than
          # reaching back through another dynamic module for the finalizer.
          $driverCleanupClosureGuards = @(
              '$finalizeCleanupForFirstPass = $finalizeCleanup',
              '$finalizeCleanupCallback = $finalizeCleanupForFirstPass',
              '& $finalizeCleanupCallback @($deletedBeforeForce + $forcedDeleted)',
              '& $finalizeCleanupCallback $deletedBeforeForce ($unresolvedFirstPassCount + $forceItemCount)'
          )
          foreach ($guard in $driverCleanupClosureGuards) {
              if (-not $source.Contains($guard)) {
                  throw "Driver cleanup nested GetNewClosure regression detected: missing $guard"
              }
          }

          # A pooled worker must never silently fall back to bare PowerShell.Create().
          if ([regex]::IsMatch($source, '(?m)return\s+\[PowerShell\]::Create\(\)')) {
              throw "Helper-less pooled PowerShell fallback detected."
          }

          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput(
              $source,
              [ref]$tokens,
              [ref]$parseErrors
          )
          if ($parseErrors -and $parseErrors.Count -gt 0) {
              throw "WMT-GUI.ps1 unexpectedly failed AST parsing in runspace smoke test."
          }

          $initFn = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq "New-WmtRunspaceInitialState"
              }, $true)
          if (-not $initFn) {
              throw "New-WmtRunspaceInitialState was not found."
          }

          # Pull the Steam helper here-string without executing the GUI application.
          $marker = '$script:WmtSteamCommonHelpers = @' + [char]39
          $markerIndex = $source.IndexOf($marker, [System.StringComparison]::Ordinal)
          if ($markerIndex -lt 0) { throw "WmtSteamCommonHelpers block was not found." }

          $bodyStart = $source.IndexOf("`n", $markerIndex)
          if ($bodyStart -lt 0) { throw "WmtSteamCommonHelpers body start was not found." }
          $bodyStart++

          $endMarker = "`n" + [char]39 + "@"
          $bodyEnd = $source.IndexOf($endMarker, $bodyStart, [System.StringComparison]::Ordinal)
          if ($bodyEnd -lt 0) { throw "WmtSteamCommonHelpers body end was not found." }

          $script:WmtSteamCommonHelpers = $source.Substring($bodyStart, $bodyEnd - $bodyStart).TrimEnd("`r", "`n")
          $script:MyDeviceCommonHelpers = ""

          # Load the real implementation from WMT rather than duplicating its logic.
          Invoke-Expression $initFn.Extent.Text
          $iss = New-WmtRunspaceInitialState

          $pool = $null
          $ps = $null
          try {
              $pool = [runspacefactory]::CreateRunspacePool(1, 1, $iss, $Host)
              $pool.ApartmentState = "STA"
              $pool.ThreadOptions = "ReuseThread"
              $pool.Open()

              $ps = [PowerShell]::Create()
              $ps.RunspacePool = $pool
              [void]$ps.AddScript('Get-WmtSteamManifestValue -Text ''"appid" "12345"'' -Key ''appid''')
              $result = @($ps.Invoke())

              if ($ps.HadErrors) {
                  $errors = @($ps.Streams.Error | ForEach-Object { $_.ToString() }) -join "; "
                  throw "Steam helper runspace smoke test emitted errors: $errors"
              }
              if ($result.Count -ne 1 -or [string]$result[0] -ne "12345") {
                  throw "Steam helper runspace smoke test returned unexpected output: $($result -join ', ')"
              }

              Write-Host "OK: shared Steam helpers load and execute inside the pooled InitialSessionState."
          }
          finally {
              try { if ($ps) { $ps.Dispose() } } catch {}
              try { if ($pool) { $pool.Close() } } catch {}
              try { if ($pool) { $pool.Dispose() } } catch {}
          }
      - name: Smoke test Disk Usage Analyzer scanner, navigation and handler safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script:passed = 0
          function Assert-Wmt([bool]$Condition, [string]$Message) {
              if (-not $Condition) { throw "FAILED: $Message" }
              $script:passed++
              Write-Host "PASS: $Message"
          }
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location).Path 'WMT-GUI.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'WMT must parse before Disk Usage Analyzer tests.' }
          # Functions are defined at script scope (as in the app) so closures resolve them the same way.
          foreach ($name in @('Get-WmtDiskUsageParentPath', 'Invoke-WmtActionByName', 'New-WmtGuardedHandler',
                  'New-WmtDiskUsageNavigator', 'Add-WmtDiskUsageScan', 'Find-WmtDiskUsageCachedNode',
                  'Get-WmtDiskUsageEntryForNode', 'Push-WmtDiskUsageHistory', 'Get-WmtDiskUsageBackTarget',
                  'Invoke-WmtDiskUsageNavigation')) {
              $functionAst = $ast.Find({
                      param($node)
                      $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name
                  }, $true)
              if (-not $functionAst) { throw "Missing Disk Usage function: $name" }
              Invoke-Expression $functionAst.Extent.Text
          }

          # ---------------------------------------------------------------------------------
          # Disk Usage Analyzer: scanner, cache-backed Back/Up navigation, handler safety and
          # static checks on the window code. Everything is imported from WMT-GUI.ps1 itself, so
          # the shipped text is what is tested. Runs in its own scope so its variables cannot
          # collide with the checks above.
          #   * Scanner: full folder tree, sizes, ordering, Find, Detach, Search, caps, Stop.
          #   * Navigation: Back/Up/open are served from the cached scan and never call the
          #     disk-scan callback; only a path outside every cached scan does.
          #   * Handler safety: reproduces the "expression after '&' ... not valid" error for
          #     closures built before their target exists and proves the guard and the
          #     late-bound action registry contain it.
          #   * Static checks: closures only capture variables assigned before they are created,
          #     every called action is registered, the window has one tab (Details) and only
          #     uses theme resources that exist in every palette.
          # ---------------------------------------------------------------------------------
          & {
              # ---- import the real scanner and functions -------------------------------------
              $sourceAssign = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '$script:WmtDiskUsageScannerSource' }, $true)
              if (-not $sourceAssign) { throw 'Scanner source assignment not found in WMT-GUI.ps1.' }
              $scannerSource = [string]$sourceAssign.Right.Expression.Value

              $addTypeArgs = @{ TypeDefinition = $scannerSource; Language = 'CSharp'; ErrorAction = 'Stop' }
              # Windows PowerShell 5.1 compiles C# 5 only; make PowerShell 7 enforce the same.
              if ($PSVersionTable.PSVersion.Major -ge 6) { $addTypeArgs['CompilerOptions'] = @('/langversion:5') }
              if (-not ('Wmt.DiskUsage.Scanner' -as [type])) { Add-Type @addTypeArgs }
              Assert-Wmt ([bool]('Wmt.DiskUsage.Scanner' -as [type])) 'scanner source compiles (C# 5 compatible)'

              # ================================ scanner =========================================
              $MB = 1MB
              $base = Join-Path ([System.IO.Path]::GetTempPath()) ('wmt-du-' + [guid]::NewGuid().ToString('N'))
              function New-TestFile([string]$Path, [long]$Size) { $stream = [System.IO.File]::Create($Path); $stream.SetLength($Size); $stream.Close() }
              $bigRoot = $null
              try {
                  $null = New-Item -ItemType Directory -Path (Join-Path $base 'a/deep'), (Join-Path $base 'b'), (Join-Path $base 'c') -Force
                  New-TestFile (Join-Path $base 'a/a1.dat') (2 * $MB); New-TestFile (Join-Path $base 'a/a2.txt') 10
                  New-TestFile (Join-Path $base 'a/deep/d1.log') (3 * $MB)
                  New-TestFile (Join-Path $base 'b/b1.bin') ([long](1.5 * $MB))
                  New-TestFile (Join-Path $base 'top.txt') 100
                  New-TestFile (Join-Path $base 'big.bin') (5 * $MB)
                  if ($PSVersionTable.PSEdition -eq 'Core' -and $IsLinux) { & ln -s (Join-Path $base 'b') (Join-Path $base 'link-to-b') }

                  $state = [hashtable]::Synchronized(@{ Cancel = $false; Done = $false })
                  $scan = [Wmt.DiskUsage.Scanner]::Scan($base, $state, 400)
                  $expected = [long](2 * $MB + 10 + 3 * $MB + 1.5 * $MB + 100 + 5 * $MB)
                  Assert-Wmt ($scan.TotalBytes -eq $expected) "root total is exact ($expected bytes)"
                  Assert-Wmt ($scan.FileCount -eq 6 -and $scan.DirCount -eq 5) 'file and folder counts are exact (6 files, 5 folders)'
                  Assert-Wmt ($state.Done -eq $true) 'progress state is marked done'
                  if ($PSVersionTable.PSEdition -eq 'Core' -and $IsLinux) { Assert-Wmt ($scan.Skipped -eq 1) 'a symlinked folder is skipped, not double counted' }

                  $root = $scan.RootNode
                  Assert-Wmt ((@($root.Children | ForEach-Object { $_.Name }) -join ',') -eq 'a,big.bin,b,c') 'root children are sorted largest first'
                  $a = $root.Children[0]
                  Assert-Wmt ($a.Bytes -eq (5 * $MB + 10) -and $a.Files -eq 3) 'a folder rolls up its subfolders'
                  Assert-Wmt ((@($scan.Files | ForEach-Object { $_.Name }) -join ',') -eq 'big.bin,d1.log,a1.dat,b1.bin') 'only files of 1 MB or more are retained, largest first'
                  Assert-Wmt ($a.Children[0].Path -eq ($scan.Root.TrimEnd('\') + '\a\deep')) 'child paths are built from the parent'

                  Assert-Wmt ($root.Find($scan.Root.TrimEnd('\') + '\A\DEEP').Name -eq 'deep') 'Find is case-insensitive'
                  Assert-Wmt ($null -eq $root.Find($scan.Root.TrimEnd('\') + '\a\nope') -and $null -eq $root.Find('Z:\elsewhere')) 'Find returns null for missing or outside paths'

                  $map = $root.MapChildren(); $sum = 0; foreach ($m in $map) { $sum += $m.Bytes }
                  Assert-Wmt ($sum -eq $root.Bytes) 'treemap children (with the "other items" block) add up to the folder size'
                  Assert-Wmt (@($root.Children | Where-Object { $_.IsSynthetic }).Count -eq 0) 'the synthetic block is never part of the real tree'

                  $under = [Wmt.DiskUsage.Scanner]::FilesUnder($a, $scan.Files)
                  Assert-Wmt ((@($under | ForEach-Object { $_.Name }) -join ',') -eq 'd1.log,a1.dat') 'FilesUnder returns only files beneath a folder'
                  $hits = [Wmt.DiskUsage.Scanner]::Search($root, 'DEE', $true, $true, 50)
                  Assert-Wmt (@($hits).Count -eq 1 -and $hits[0].Name -eq 'deep') 'Search matches names case-insensitively'
                  $hits = [Wmt.DiskUsage.Scanner]::Search($root, '\a\deep', $true, $false, 50)
                  Assert-Wmt (@($hits).Count -eq 1) 'Search with a backslash matches full folder paths'
                  $top = [Wmt.DiskUsage.Scanner]::LargestFolders($root, 2)
                  Assert-Wmt ((@($top | ForEach-Object { $_.Name }) -join ',') -eq 'a,deep') 'LargestFolders returns the biggest folders anywhere in the tree'

                  $before = $root.Bytes; $deep = $a.Children[0]; [void]$root.MapChildren()
                  $deep.Detach()
                  Assert-Wmt ($root.Bytes -eq $before - 3 * $MB -and $a.Bytes -eq 2 * $MB + 10 -and $root.Files -eq 5) 'Detach takes the subtree out of every ancestor'
                  $map = $root.MapChildren(); $sum = 0; foreach ($m in $map) { $sum += $m.Bytes }
                  Assert-Wmt ($sum -eq $root.Bytes) 'the treemap still adds up after Detach (caches were invalidated)'
                  $deep.Detach()
                  Assert-Wmt ($root.Bytes -eq $before - 3 * $MB) 'detaching twice is harmless'

                  $wide = [Wmt.DiskUsage.Node]::new(); $wide.Name = 'C:\wide'; $wide.IsDir = $true
                  $kids = New-Object 'System.Collections.Generic.List[Wmt.DiskUsage.Node]'
                  foreach ($i in 1..1500) { $k = [Wmt.DiskUsage.Node]::new(); $k.Name = "k$i"; $k.IsDir = $true; $k.Parent = $wide; $k.Bytes = 1501 - $i; $k.Files = 1; $kids.Add($k) }
                  $wide.Children = $kids.ToArray(); $wide.Files = 1507; $wide.Bytes = (1500 * 1501 / 2) + 77
                  $wideMap = $wide.MapChildren(); $wideSum = 0; foreach ($m in $wideMap) { $wideSum += $m.Bytes }
                  Assert-Wmt ($wideMap.Length -le [Wmt.DiskUsage.Node]::MaxMapBlocks -and $wideSum -eq $wide.Bytes -and $wide.Children.Length -eq 1500) 'a folder with 1500 entries draws a capped treemap that still adds up, while the tree keeps every child'

                  $cancelled = [Wmt.DiskUsage.Scanner]::Scan($base, ([hashtable]::Synchronized(@{ Cancel = $true })), 400)
                  Assert-Wmt ($cancelled.Cancelled -and $cancelled.TotalBytes -le $expected -and $cancelled.RootNode.Children.Length -eq 0) 'Stop before the first folder yields an empty but valid result'

                  $capped = [Wmt.DiskUsage.Scanner]::Scan($base, $null, 400, 2)
                  $capMap = $capped.RootNode.MapChildren(); $capSum = 0; foreach ($m in $capMap) { $capSum += $m.Bytes }
                  Assert-Wmt ($capped.Truncated -and $capped.TotalBytes -eq $expected -and $capSum -eq $capped.TotalBytes) 'the node cap keeps totals exact and the treemap consistent'
                  $missing = [Wmt.DiskUsage.Scanner]::Scan((Join-Path $base 'does-not-exist'), $null, 400)
                  Assert-Wmt ($missing.TotalBytes -eq 0) 'a missing folder scans to an empty result without throwing'

                  # Stop in the middle of a large scan: the partial tree must be consistent.
                  $bigRoot = Join-Path ([System.IO.Path]::GetTempPath()) ('wmt-du-big-' + [guid]::NewGuid().ToString('N'))
                  $dirTotal = 2000
                  foreach ($i in 1..$dirTotal) { $d = Join-Path $bigRoot "d$i"; $null = [System.IO.Directory]::CreateDirectory($d); [System.IO.File]::WriteAllText((Join-Path $d 'f.txt'), '0123456789') }
                  $partial = $null
                  for ($attempt = 1; $attempt -le 8 -and -not $partial; $attempt++) {
                      $cancelState = [hashtable]::Synchronized(@{ Cancel = $false; Dirs = 0 })
                      $worker = [powershell]::Create()
                      [void]$worker.AddScript({ param($p, $s) [Wmt.DiskUsage.Scanner]::Scan($p, $s, 400) }).AddArgument($bigRoot).AddArgument($cancelState)
                      $async = $worker.BeginInvoke()
                      $deadline = [DateTime]::UtcNow.AddSeconds(30)
                      while ([int]$cancelState.Dirs -lt 64 -and -not $async.IsCompleted -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 1 }
                      $cancelState.Cancel = $true
                      $result = $worker.EndInvoke($async)[0]; $worker.Dispose()
                      if ($result.Cancelled -and $result.DirCount -gt 0 -and $result.DirCount -le $dirTotal) { $partial = $result }
                  }
                  if ($partial) {
                      $inconsistent = 0; $visited = 0; $pending = New-Object 'System.Collections.Generic.Stack[object]'; $pending.Push($partial.RootNode)
                      while ($pending.Count) {
                          $node = $pending.Pop(); $visited++; $childSum = 0
                          foreach ($child in $node.Children) { $childSum += $child.Bytes; if ($child.IsDir) { $pending.Push($child) } }
                          if ($childSum -gt $node.Bytes) { $inconsistent++ }
                          $mapSum = 0; foreach ($m in $node.MapChildren()) { $mapSum += $m.Bytes }
                          if ($mapSum -ne $node.Bytes) { $inconsistent++ }
                      }
                      Assert-Wmt ($inconsistent -eq 0 -and $partial.TotalBytes -le $dirTotal * 10) "Stop in the middle of a scan leaves a consistent partial tree ($visited folders)"
                  }
                  else { Write-Host 'SKIP: the scan finished before Stop could interrupt it (machine too fast); mid-scan consistency not exercised.' }
                  $full = [Wmt.DiskUsage.Scanner]::Scan($bigRoot, $null, 400)
                  Assert-Wmt ($full.TotalBytes -eq $dirTotal * 10 -and $full.DirCount -eq ($dirTotal + 1)) "an uninterrupted scan of $dirTotal folders is exact"
              }
              finally {
                  foreach ($path in @($base, $bigRoot)) { if ($path) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue } }
              }

              # ============================ navigation and cache ================================
              function New-TestDir([string]$Name, $Parent, [long]$Bytes) {
                  $node = [Wmt.DiskUsage.Node]::new(); $node.Name = $Name; $node.IsDir = $true; $node.Bytes = $Bytes; $node.Files = 1; $node.Parent = $Parent
                  if ($Parent) { $Parent.Children = @($Parent.Children) + $node }
                  return $node
              }
              function New-TestScan($RootNode) { $s = [Wmt.DiskUsage.ScanResult]::new(); $s.Root = $RootNode.Path; $s.RootNode = $RootNode; $s.Files = @(); $s.Extensions = @(); return $s }

              $cRoot = New-TestDir 'C:\' $null 1000
              $users = New-TestDir 'Users' $cRoot 600; $me = New-TestDir 'me' $users 500; $docs = New-TestDir 'Docs' $me 300; $null = New-TestDir 'Windows' $cRoot 400
              $scanC = New-TestScan $cRoot
              $meRoot = New-TestDir 'C:\Users\me' $null 500; $null = New-TestDir 'Docs' $meRoot 300; $null = New-TestDir 'Pics' $meRoot 200
              $scanMe = New-TestScan $meRoot

              $nav = New-WmtDiskUsageNavigator
              $entryC = Add-WmtDiskUsageScan -Navigator $nav -Scan $scanC
              $log = New-Object 'System.Collections.Generic.List[string]'
              $onShow = { param($node, $entry) $log.Add('show:' + $node.Path) }.GetNewClosure()
              $onScan = { param($path, $record) $log.Add('scan:' + $path + '|record:' + $record) }.GetNewClosure()
              function Invoke-TestNav([string]$Kind, [string]$Current, [string]$Target = '', $Prefer = $null) {
                  Invoke-WmtDiskUsageNavigation -Navigator $nav -Kind $Kind -CurrentPath $Current -TargetPath $Target -PreferEntry $Prefer -OnShow $onShow -OnScan $onScan
              }
              function Get-ScanCalls { @($log | Where-Object { $_ -like 'scan:*' }).Count }

              $hit = Find-WmtDiskUsageCachedNode -Navigator $nav -Path 'C:\Users\me\Docs'
              Assert-Wmt ($hit -and $hit.Node.Name -eq 'Docs' -and $hit.Entry -eq $entryC) 'a folder deep inside a cached scan is found in memory'
              Assert-Wmt ($null -eq (Find-WmtDiskUsageCachedNode -Navigator $nav -Path 'D:\Other') -and $null -eq (Find-WmtDiskUsageCachedNode -Navigator $nav -Path 'C:\Users\nobody')) 'paths outside the scan or missing inside it are not found'

              $result = Invoke-TestNav 'Open' 'C:\' 'C:\Users'
              Assert-Wmt ($result -eq 'cache' -and $log[$log.Count - 1] -eq 'show:C:\Users') 'opening a cached folder is served from memory'
              $null = Invoke-TestNav 'Open' 'C:\Users' 'C:\Users\me'; $null = Invoke-TestNav 'Open' 'C:\Users\me' 'C:\Users\me\Docs'
              Assert-Wmt ((Get-ScanCalls) -eq 0 -and ($nav.History -join '|') -eq 'C:\|C:\Users|C:\Users\me') 'three levels of opening folders caused zero disk scans and were remembered for Back'

              $null = Invoke-TestNav 'Up' 'C:\Users\me\Docs'; $null = Invoke-TestNav 'Up' 'C:\Users\me'; $null = Invoke-TestNav 'Up' 'C:\Users'
              Assert-Wmt ($log[$log.Count - 1] -eq 'show:C:\' -and (Get-ScanCalls) -eq 0) 'Up three times, to the scan root, caused zero disk scans'
              Assert-Wmt ((Invoke-TestNav 'Up' 'C:\') -eq 'none') 'Up from a volume root does nothing'

              $historyBefore = $nav.History.Count
              $result = Invoke-TestNav 'Back' 'C:\'
              Assert-Wmt ($result -eq 'cache' -and $log[$log.Count - 1] -eq 'show:C:\Users' -and $nav.History.Count -eq $historyBefore - 1) 'Back returns to the previous folder from memory and shortens history'
              $null = Invoke-TestNav 'Back' 'C:\Users'; $null = Invoke-TestNav 'Back' 'C:\Users\me'
              Assert-Wmt ((Get-ScanCalls) -eq 0) 'repeated Back caused zero disk scans'
              $nav.History.Clear()
              Assert-Wmt ((Invoke-TestNav 'Back' 'C:\') -eq 'none') 'Back with no history does nothing'

              $nav = New-WmtDiskUsageNavigator; $null = Add-WmtDiskUsageScan -Navigator $nav -Scan $scanMe; $log.Clear()
              $result = Invoke-TestNav 'Up' 'C:\Users\me'
              Assert-Wmt ($result -eq 'scan' -and $log[$log.Count - 1] -eq 'scan:C:\Users|record:C:\Users\me' -and $nav.History.Count -eq 0) 'Up beyond the scanned root is the one case that needs the disk, and history is written only after that scan succeeds'

              $nav = New-WmtDiskUsageNavigator; $entryC = Add-WmtDiskUsageScan -Navigator $nav -Scan $scanC; $entryMe = Add-WmtDiskUsageScan -Navigator $nav -Scan $scanMe
              Assert-Wmt ((Find-WmtDiskUsageCachedNode -Navigator $nav -Path 'C:\Users\me\Docs').Entry -eq $entryMe) 'with two covering scans the newest wins by default'
              Assert-Wmt ((Find-WmtDiskUsageCachedNode -Navigator $nav -Path 'C:\Users\me\Docs' -PreferEntry $entryC).Entry -eq $entryC) 'the scan already on screen is preferred'
              $null = Add-WmtDiskUsageScan -Navigator $nav -Scan (New-TestScan $cRoot)
              Assert-Wmt (@($nav.Entries | Where-Object { $_.Scan.Root -eq 'C:\' }).Count -eq 1 -and $nav.Entries.Count -eq 2) 'rescanning a root replaces its cache entry'

              $nav = New-WmtDiskUsageNavigator
              foreach ($i in 1..150) { Push-WmtDiskUsageHistory -Navigator $nav -Path "C:\d$i" }
              Push-WmtDiskUsageHistory -Navigator $nav -Path 'C:\D150'; Push-WmtDiskUsageHistory -Navigator $nav -Path ''
              Assert-Wmt ($nav.History.Count -eq 100 -and $nav.History[0] -eq 'C:\d51') 'history is capped at 100 and ignores duplicates and blanks'

              $nav = New-WmtDiskUsageNavigator; $null = Add-WmtDiskUsageScan -Navigator $nav -Scan $scanC
              Push-WmtDiskUsageHistory -Navigator $nav -Path 'C:\Users'; Push-WmtDiskUsageHistory -Navigator $nav -Path 'Q:\vanished\folder'
              Assert-Wmt ((Get-WmtDiskUsageBackTarget -Navigator $nav) -eq 'C:\Users') 'Back skips a folder that is neither cached nor on disk'
              $docs.Detach()
              Assert-Wmt ($null -eq (Find-WmtDiskUsageCachedNode -Navigator $nav -Path 'C:\Users\me\Docs') -and $null -eq (Get-WmtDiskUsageEntryForNode -Navigator $nav -Node $docs)) 'a recycled folder is no longer served from the cache'

              # ============================== handler safety ====================================
              $script:logged = New-Object 'System.Collections.Generic.List[string]'
              # Script scope on purpose: the guard's closure resolves Write-GuiLog the way the app does.
              function script:Write-GuiLog { param($Msg) $script:logged.Add([string]$Msg) }
              $errors = New-Object 'System.Collections.Generic.List[string]'
              $sink = { param($n, $m) $errors.Add("$n=>$m") }.GetNewClosure()

              function New-TestHandlerSet {
                  param($Sink)
                  $act = @{}
                  $call = { param([string]$Name) Invoke-WmtActionByName -Registry $act -Name $Name -ArgumentList $args }.GetNewClosure()
                  $earlyRaw = { & $refreshLater }.GetNewClosure()      # built before its target exists: the original bug
                  $refreshLater = { 'late' }
                  $version = { 'v1' }
                  $staleRaw = { & $version }.GetNewClosure()
                  $version = { 'v2' }
                  $box = @{ got = $null }
                  $tab = New-WmtGuardedHandler -Name 'tab-selected' -Body ({ param($s, $e) & $call 'refresh' $s.Tag }.GetNewClosure()) -OnError $Sink
                  $act['refresh'] = { param($tag) $box.got = "refreshed:$tag" }.GetNewClosure()
                  $act['versioned'] = { 'v1' }
                  $versioned = New-WmtGuardedHandler -Name 'versioned' -Body ({ & $call 'versioned' }.GetNewClosure()) -OnError $Sink
                  $act['versioned'] = { 'v2' }
                  $guardedEarly = New-WmtGuardedHandler -Name 'early' -Body $earlyRaw -OnError $Sink
                  return @{ Box = $box; Act = $act; EarlyRaw = $earlyRaw; StaleRaw = $staleRaw; GuardedEarly = $guardedEarly; Tab = $tab; Versioned = $versioned }
              }
              $handlers = New-TestHandlerSet -Sink $sink

              $rawMessage = ''
              try { & $handlers.EarlyRaw } catch { $rawMessage = $_.Exception.Message }
              Assert-Wmt ($rawMessage -like "The expression after '&'*not valid*") 'reproduced: a closure built before its target exists throws "expression after &"'
              Assert-Wmt ((& $handlers.StaleRaw) -eq 'v1') 'reproduced: a closure keeps a stale block after the variable is reassigned'
              $threw = $false; try { & $handlers.GuardedEarly } catch { $threw = $true }
              Assert-Wmt ((-not $threw) -and $script:logged[$script:logged.Count - 1] -like '*early failed*' -and $errors[$errors.Count - 1] -like 'early=>*') 'the guard keeps that exception off the dispatcher, logs it and reports it to the status line'
              & $handlers.Tab ([pscustomobject]@{ Tag = 'Details' }) $null
              Assert-Wmt ($handlers.Box.got -eq 'refreshed:Details') 'an action registered after its handler was built is still found'
              Assert-Wmt ((& $handlers.Versioned) -eq 'v2') 're-registering an action is picked up by existing handlers'
              $handlers.Act.Remove('refresh'); & $handlers.Tab ([pscustomobject]@{ Tag = 'x' }) $null
              Assert-Wmt ($script:logged[$script:logged.Count - 1] -like '*Action "refresh" is not defined*') 'a missing action is reported by name, not as an opaque "&" error'
              $handlers.Act['refresh'] = 'not a script block'; & $handlers.Tab ([pscustomobject]@{ Tag = 'x' }) $null
              Assert-Wmt ($script:logged[$script:logged.Count - 1] -like '*not defined or is not a script block*') 'a registry entry that is not a script block is rejected clearly'
              $nullBody = New-WmtGuardedHandler -Name 'null-body' -Body $null -OnError $sink
              $threw = $false; try { & $nullBody } catch { $threw = $true }
              Assert-Wmt ((-not $threw) -and $script:logged[$script:logged.Count - 1] -like '*null-body failed*') 'a null handler body is logged, not thrown'
              $failingSink = New-WmtGuardedHandler -Name 'boom' -Body { throw 'kaboom' } -OnError { throw 'sink also fails' }
              $threw = $false; try { & $failingSink } catch { $threw = $true }
              Assert-Wmt (-not $threw) 'even a failing error sink cannot escape'
              $pair = @{}
              $forwarding = New-WmtGuardedHandler -Name 'ok' -Body ({ param($a, $b) $pair.value = "$a/$b" }.GetNewClosure())
              & $forwarding 1 2
              Assert-Wmt ($pair.value -eq '1/2') 'the guard forwards sender and event args to the handler body'

              # ==================== static checks on the analyzer window code ===================
              $analyzer = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Show-WmtDiskUsageAnalyzer' }, $true)
              if (-not $analyzer) { throw 'Show-WmtDiskUsageAnalyzer not found.' }

              function Get-TestAssignedNames($Root) {
                  $names = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
                  foreach ($n in $Root.FindAll({ param($x) $x -is [System.Management.Automation.Language.AssignmentStatementAst] }, $true)) {
                      $v = if ($n.Left -is [System.Management.Automation.Language.VariableExpressionAst]) { $n.Left } elseif ($n.Left -is [System.Management.Automation.Language.ConvertExpressionAst] -and $n.Left.Child -is [System.Management.Automation.Language.VariableExpressionAst]) { $n.Left.Child } else { $null }
                      if ($v) { [void]$names.Add($v.VariablePath.UserPath) }
                  }
                  foreach ($n in $Root.FindAll({ param($x) $x -is [System.Management.Automation.Language.ForEachStatementAst] }, $true)) { [void]$names.Add($n.Variable.VariablePath.UserPath) }
                  foreach ($n in $Root.FindAll({ param($x) $x -is [System.Management.Automation.Language.ParameterAst] }, $true)) { [void]$names.Add($n.Name.VariablePath.UserPath) }
                  return , $names
              }
              $closures = @($analyzer.Body.FindAll({ param($x) $x -is [System.Management.Automation.Language.InvokeMemberExpressionAst] -and $x.Member.Value -eq 'GetNewClosure' -and $x.Expression -is [System.Management.Automation.Language.ScriptBlockExpressionAst] }, $true))
              Assert-Wmt ($closures.Count -gt 20) "the closure check inspects the analyzer's closures ($($closures.Count) found)"
              $allAssignments = @($analyzer.Body.FindAll({ param($x) $x -is [System.Management.Automation.Language.AssignmentStatementAst] }, $true))
              $allForeach = @($analyzer.Body.FindAll({ param($x) $x -is [System.Management.Automation.Language.ForEachStatementAst] }, $true))
              $parameterNames = @($analyzer.Body.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
              $ignored = 'true', 'false', 'null', '_', 'args', 'PSItem', 'this', 'input', 'PSCmdlet', 'MyInvocation', 'PSBoundParameters', 'Error', 'LASTEXITCODE', 'Matches', 'env'
              $captureProblems = New-Object 'System.Collections.Generic.List[string]'
              foreach ($closure in $closures) {
                  $block = $closure.Expression; $inner = Get-TestAssignedNames $block; $start = $closure.Extent.StartOffset
                  $defined = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
                  foreach ($p in $parameterNames) { [void]$defined.Add($p) }
                  foreach ($n in $allAssignments) {
                      $insideBlock = ($n.Extent.StartOffset -ge $block.Extent.StartOffset -and $n.Extent.EndOffset -le $block.Extent.EndOffset)
                      if ($n.Extent.EndOffset -le $start -and -not $insideBlock) {
                          $v = if ($n.Left -is [System.Management.Automation.Language.VariableExpressionAst]) { $n.Left } elseif ($n.Left -is [System.Management.Automation.Language.ConvertExpressionAst] -and $n.Left.Child -is [System.Management.Automation.Language.VariableExpressionAst]) { $n.Left.Child } else { $null }
                          if ($v) { [void]$defined.Add($v.VariablePath.UserPath) }
                      }
                  }
                  foreach ($n in $allForeach) { if ($n.Extent.StartOffset -le $start) { [void]$defined.Add($n.Variable.VariablePath.UserPath) } }
                  $seen = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::OrdinalIgnoreCase)
                  foreach ($v in $block.FindAll({ param($x) $x -is [System.Management.Automation.Language.VariableExpressionAst] }, $true)) {
                      $p = $v.VariablePath
                      if ($p.IsDriveQualified -or $p.IsGlobal -or $p.IsScript) { continue }
                      $name = $p.UserPath
                      if ($ignored -contains $name -or $inner.Contains($name) -or -not $seen.Add($name)) { continue }
                      if (-not $defined.Contains($name)) { $captureProblems.Add("line $($closure.Extent.StartLineNumber): `$$name") }
                  }
              }
              Assert-Wmt ($captureProblems.Count -eq 0) ('every variable captured by a GetNewClosure() block is assigned before the block is created' + $(if ($captureProblems.Count) { ' - ' + (($captureProblems | Select-Object -First 5) -join '; ') } else { '' }))

              $analyzerText = $analyzer.Extent.Text
              $registered = @([regex]::Matches($analyzerText, '(?m)^\s*\$act\.([A-Za-z]+)\s*=') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
              $called = @([regex]::Matches($analyzerText, "&\s*\`$call\s+'([A-Za-z]+)'") | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
              $unregistered = @($called | Where-Object { $registered -notcontains $_ })
              Assert-Wmt ($registered.Count -gt 15 -and $unregistered.Count -eq 0) ('every action the handlers call by name is registered' + $(if ($unregistered.Count) { ': missing ' + ($unregistered -join ', ') } else { '' }))
              $directCalls = @([regex]::Matches($analyzerText, '(?m)^[^#\r\n]*&\s*\$(?!call\b|guard\b)([A-Za-z]+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
              $unexpectedDirectCalls = @($directCalls | Where-Object { $_ -ne 'walk' })
              Assert-Wmt ($unexpectedDirectCalls.Count -eq 0) ('handlers use registered actions; only the recursive tree walker invokes itself directly' + $(if ($unexpectedDirectCalls.Count) { ': ' + ($unexpectedDirectCalls -join ', ') } else { '' }))

              # ---- the window XAML
              $xamlAssign = $analyzer.Body.Find({ param($x) $x -is [System.Management.Automation.Language.AssignmentStatementAst] -and $x.Left.Extent.Text -eq '[xml]$usageXaml' }, $true)
              [xml]$xaml = [string]$xamlAssign.Right.Expression.Value
              $tabItems = @($xaml.SelectNodes("//*[local-name()='TabItem']"))
              Assert-Wmt ($tabItems.Count -eq 1 -and $tabItems[0].GetAttribute('Header') -eq 'Details') 'the analyzer has exactly one tab: Details'
              Assert-Wmt (@($xaml.SelectNodes("//*[local-name()='TreeView']")).Count -eq 1) 'folders are browsed through one hierarchical TreeView'

              $xamlText = [string]$xamlAssign.Right.Expression.Value
              $controls = @('txtUsagePath', 'btnUsageBack', 'btnUsageUp', 'btnUsageScan', 'tabUsage', 'tvUsage', 'cvTreemap', 'cmbUsageView', 'txtUsageFilter', 'pnlUsageLegend')
              $missingControls = @($controls | Where-Object { @($xaml.SelectNodes("//*[@*[local-name()='Name' and .='$_']]")).Count -ne 1 })
              Assert-Wmt ($missingControls.Count -eq 0) 'every control the code looks up exists exactly once'

              $paletteAssign = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '$script:ThemePalettes' }, $true)
              $palettes = & ([scriptblock]::Create($paletteAssign.Right.Extent.Text))
              $dynamicKeys = @([regex]::Matches($xamlText, '\{DynamicResource\s+([A-Za-z0-9_]+)\}') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
              $absent = @()
              foreach ($paletteName in $palettes.Keys) { foreach ($key in $dynamicKeys) { if (-not $palettes[$paletteName].ContainsKey($key)) { $absent += "$paletteName/$key" } } }
              Assert-Wmt ($dynamicKeys.Count -gt 10 -and $absent.Count -eq 0) ('tab and tree styles only use theme resources that exist in every palette (' + $dynamicKeys.Count + ' keys, ' + @($palettes.Keys).Count + ' palettes)')

              $resourceKeys = @($xaml.SelectNodes("//*[local-name()='Window.Resources']/*") | ForEach-Object { $_.GetAttribute('Key', 'http://schemas.microsoft.com/winfx/2006/xaml') } | Where-Object { $_ })
              $sharedResourcesAssign = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '[xml]$runtimeResourcesXaml' }, $true)
              if (-not $sharedResourcesAssign) { throw 'Shared runtime resource dictionary not found in WMT-GUI.ps1.' }
              [xml]$sharedResources = [string]$sharedResourcesAssign.Right.Expression.Value
              $sharedResourceKeys = @($sharedResources.SelectNodes("//*[local-name()='ResourceDictionary']/*") | ForEach-Object { $_.GetAttribute('Key', 'http://schemas.microsoft.com/winfx/2006/xaml') } | Where-Object { $_ })
              $staticProblems = @([regex]::Matches($xamlText, '\{StaticResource\s+([A-Za-z0-9_]+)\}') | ForEach-Object {
                      $key = $_.Groups[1].Value; $defIndex = $xamlText.IndexOf('x:Key="' + $key + '"')
                      $hasWindowResource = $resourceKeys -contains $key -and $defIndex -ge 0 -and $defIndex -lt $_.Index
                      if (-not $hasWindowResource -and $sharedResourceKeys -notcontains $key) { $key }
                  })
              Assert-Wmt ($staticProblems.Count -eq 0) 'every StaticResource resolves to an earlier window resource or shared runtime resource'

              $templateProblems = @()
              foreach ($template in $xaml.SelectNodes("//*[local-name()='ControlTemplate']")) {
                  $names = @($template.SelectNodes('.//*[@*[local-name()="Name"]]') | ForEach-Object { $_.GetAttribute('Name', 'http://schemas.microsoft.com/winfx/2006/xaml') })
                  foreach ($node in $template.SelectNodes('.//*[@TargetName or @SourceName]')) {
                      foreach ($attribute in 'TargetName', 'SourceName') { $target = $node.GetAttribute($attribute); if ($target -and $names -notcontains $target) { $templateProblems += "$($template.GetAttribute('TargetType')): $target" } }
                  }
              }
              Assert-Wmt ($templateProblems.Count -eq 0) 'every trigger and setter target resolves inside its control template'
              foreach ($type in '{x:Type TabItem}', '{x:Type TreeViewItem}') {
                  $template = @($xaml.SelectNodes("//*[local-name()='ControlTemplate'][@TargetType='$type']"))[0]
                  $style = @($xaml.SelectNodes("//*[local-name()='Style'][@TargetType='$type']"))[0]
                  $baseSetters = @($style.SelectNodes("./*[local-name()='Setter']") | ForEach-Object { $_.GetAttribute('Property') })
                  Assert-Wmt (($baseSetters -contains 'Background') -and ($baseSetters -contains 'Foreground')) "$type has a themed normal state (background and foreground)"
                  foreach ($state in 'IsMouseOver', 'IsSelected') {
                      # A real Trigger of its own (not just a mention inside another trigger's conditions) that sets something.
                      $trigger = @($template.SelectNodes("./*[local-name()='ControlTemplate.Triggers']/*[local-name()='Trigger'][@Property='$state']"))
                      $hasSetters = $trigger.Count -ge 1 -and $trigger[0].SelectNodes("./*[local-name()='Setter']").Count -ge 1
                      Assert-Wmt $hasSetters "$type is themed for $state"
                      $usesTheme = ($trigger.Count -ge 1) -and ($trigger[0].OuterXml -match '\{DynamicResource ')
                      Assert-Wmt $usesTheme "$type $state state uses theme resources, not hard-coded colours"
                  }
                  $disabled = @($template.SelectNodes("./*[local-name()='ControlTemplate.Triggers']/*[local-name()='Trigger'][@Property='IsEnabled']"))
                  Assert-Wmt ($disabled.Count -ge 1) "$type has a disabled state"
              }
              # ---- flat look: tonal blocks like the main GUI, and no blue outline on the Details tab
              $outlined = @($xaml.SelectNodes("//*[local-name()='Border'][not(ancestor::*[local-name()='Window.Resources'])]") | Where-Object {
                      $visibleBrush = $_.HasAttribute('BorderBrush') -and $_.GetAttribute('BorderBrush') -notin @('Transparent', '{x:Null}')
                      $visibleThickness = -not $_.HasAttribute('BorderThickness') -or $_.GetAttribute('BorderThickness') -notin @('0', '0,0,0,0')
                      $visibleBrush -and $visibleThickness
                  })
              Assert-Wmt ($outlined.Count -eq 0) 'panels are flat tonal blocks like the main GUI: no Border has an outline'
              $xamlWithoutComments = [regex]::Replace($xamlText, '(?s)<!--.*?-->', '')
              $accentOutlines = @([regex]::Matches($xamlWithoutComments, 'Property="BorderBrush"[^>]*\{DynamicResource (Accent|AccentHover|BorderAccent)\}'))
              Assert-Wmt ($accentOutlines.Count -eq 0 -and $xamlWithoutComments -notmatch 'BorderAccent') 'no style draws a blue (accent) outline'
              $tabStyles = @($xaml.SelectNodes("//*[local-name()='Style'][@TargetType='{x:Type TabItem}' or @TargetType='{x:Type TabControl}']"))
              Assert-Wmt ($tabStyles.Count -eq 2 -and ((($tabStyles | ForEach-Object { $_.OuterXml }) -join '') -notmatch 'Accent')) 'the Details tab and its control use no accent colour at all'
              $treeItemStyle = @($xaml.SelectNodes("//*[local-name()='Style'][@TargetType='{x:Type TreeViewItem}']"))[0]
              $treeBorderBrush = @($treeItemStyle.SelectNodes("./*[local-name()='Setter'][@Property='BorderBrush']"))[0]
              Assert-Wmt ($treeBorderBrush -and $treeBorderBrush.GetAttribute('Value') -eq 'Transparent') 'tree rows are flat: the border brush stays transparent'

              # ---- event handler convention: sender is $s; event args use $e or $a
              $handlerPairs = @([regex]::Matches($analyzerText, '(?i)param\((\$\w+),\s*(\$\w+)\)') | ForEach-Object { , @($_.Groups[1].Value, $_.Groups[2].Value) })
              $eventHandlers = @($handlerPairs | Where-Object { $_[0] -match '^\$(s|sender|src|source)$' -or $_[1] -match '^\$(e|a|ea|evt|eventargs)$' })
              $badHandlers = @($eventHandlers | Where-Object { $_[0] -cne '$s' -or $_[1] -notin @('$e', '$a') })
              Assert-Wmt ($eventHandlers.Count -gt 5 -and $badHandlers.Count -eq 0) ('every event handler uses $s for sender and $e or $a for event args (' + $eventHandlers.Count + ' handlers)')

          }
          Write-Host "Disk Usage Analyzer tests passed: $script:passed assertions."

      - name: Test resizable subwindow bounds and state persistence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName PresentationFramework
          $script:passed = 0
          function Assert-Wmt([bool]$Condition, [string]$Message) {
              if (-not $Condition) { throw "FAILED: $Message" }
              $script:passed++
              Write-Host "PASS: $Message"
          }
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location).Path 'WMT-GUI.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw "WMT must parse before subwindow-size tests: $($parseErrors[0].Message)" }
          $helper = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                      $node.Name -eq 'Register-WmtSubwindowBounds'
              }, $true)
          if (-not $helper) { throw 'Register-WmtSubwindowBounds was not found in WMT-GUI.ps1.' }
          $body = $helper.Body.Extent.Text
          Set-Item -Path 'Function:script:Register-WmtSubwindowBounds' -Value ([scriptblock]::Create($body.Substring(1, $body.Length - 2)))
          $script:ciSettings = @{
              RememberSubwindowBounds = $true
              SubwindowBounds = @{
                  DiskUsageAnalyzer = @{ Width = 1200; Height = 800; WindowState = 'Normal' }
                  GhostDevices = @{ Width = 900; Height = 600; WindowState = 'Maximized' }
                  KeepExisting = @{ Width = 700; Height = 500 }
              }
          }
          $script:ciSaveCount = 0
          function Get-WmtSettings { return $script:ciSettings }
          function Get-WmtSettingsMember {
              param($Settings, [string]$Name, $Default)
              if ($null -eq $Settings) { return $Default }
              if ($Settings -is [System.Collections.IDictionary]) {
                  if ($Settings.Contains($Name)) { return $Settings[$Name] }
                  return $Default
              }
              $property = $Settings.PSObject.Properties[$Name]
              if ($property) { return $property.Value }
              return $Default
          }
          function Save-WmtSettings {
              param($Settings)
              $script:ciSettings = $Settings
              $script:ciSaveCount++
          }
          function Write-GuiLog([string]$Message) { Write-Host $Message }
          function Get-WmtRememberSubwindowBounds { param($Settings); if (-not $Settings) { $Settings = Get-WmtSettings }; return [bool](Get-WmtSettingsMember -Settings $Settings -Name 'RememberSubwindowBounds' -Default $true) }
          function Test-WmtFiniteDouble($Value) {
              try {
                  $number = [double]$Value
                  return (-not [double]::IsNaN($number) -and -not [double]::IsInfinity($number))
              } catch { return $false }
          }
          function New-TestWindow([string]$Title, [System.Windows.ResizeMode]$ResizeMode = [System.Windows.ResizeMode]::CanResize) {
              $window = [pscustomobject]@{
                  Title = $Title
                  ResizeMode = $ResizeMode
                  MinWidth = 400
                  MinHeight = 300
                  Width = 750
                  Height = 550
                  ActualWidth = 1100
                  ActualHeight = 700
                  WindowState = [System.Windows.WindowState]::Normal
                  RestoreBounds = [pscustomobject]@{ Width = 820; Height = 620 }
                  ClosedHandler = $null
              }
              $window | Add-Member -MemberType ScriptMethod -Name Add_Closed -Value { param($handler) $this.ClosedHandler = $handler }
              return $window
          }
          $analyzer = New-TestWindow 'Disk Usage Analyzer'
          Register-WmtSubwindowBounds -Dialog $analyzer
          Assert-Wmt ($analyzer.Width -eq 1200 -and $analyzer.Height -eq 800) 'Disk Usage Analyzer restores its saved size'
          Assert-Wmt ($null -ne $analyzer.ClosedHandler) 'resizable analyzer registers its close handler'
          $otherTool = New-TestWindow 'Ghost Devices'
          Register-WmtSubwindowBounds -Dialog $otherTool
          Assert-Wmt ($otherTool.Width -eq 900 -and $otherTool.Height -eq 600) 'another resizable subtool restores its own saved size'
          Assert-Wmt ($otherTool.WindowState -eq [System.Windows.WindowState]::Maximized) 'a subtool restores its saved maximized state'
          $analyzer.ActualWidth = 1300; $analyzer.ActualHeight = 850
          $analyzer.ClosedHandler.Invoke()
          Assert-Wmt ($script:ciSaveCount -eq 1 -and $script:ciSettings.SubwindowBounds.DiskUsageAnalyzer.Width -eq 1300 -and $script:ciSettings.SubwindowBounds.DiskUsageAnalyzer.Height -eq 850 -and $script:ciSettings.SubwindowBounds.DiskUsageAnalyzer.WindowState -eq 'Normal') 'closing a normal subtool saves its latest dimensions and state'
          Assert-Wmt ($script:ciSettings.SubwindowBounds.GhostDevices.Width -eq 900 -and $script:ciSettings.SubwindowBounds.KeepExisting.Width -eq 700) 'saving one subtool preserves other saved sizes'
          $maximized = New-TestWindow 'Maximized Tool'
          $script:ciSettings.SubwindowBounds.MaximizedTool = @{ Width = 800; Height = 600; WindowState = 'Normal' }
          Register-WmtSubwindowBounds -Dialog $maximized
          $maximized.WindowState = [System.Windows.WindowState]::Maximized
          $maximized.RestoreBounds = [pscustomobject]@{ Width = 950; Height = 650 }
          $maximized.ClosedHandler.Invoke()
          Assert-Wmt ($script:ciSettings.SubwindowBounds.MaximizedTool.WindowState -eq 'Maximized' -and $script:ciSettings.SubwindowBounds.MaximizedTool.Width -eq 950 -and $script:ciSettings.SubwindowBounds.MaximizedTool.Height -eq 650) 'closing a maximized subtool saves its state and normal restore size'
          $script:ciSettings.RememberSubwindowBounds = $false
          $disabled = New-TestWindow 'Ghost Devices'
          $disabled.Width = 750; $disabled.Height = 550
          Register-WmtSubwindowBounds $disabled
          Assert-Wmt ($disabled.Width -eq 750 -and $disabled.Height -eq 550) 'disabling size memory skips restoration'
          $saveCountBeforeDisabledClose = $script:ciSaveCount
          $disabled.ClosedHandler.Invoke()
          Assert-Wmt ($script:ciSaveCount -eq $saveCountBeforeDisabledClose) 'disabling size memory skips saving on close'
          $fixed = New-TestWindow 'Fixed Dialog' ([System.Windows.ResizeMode]::NoResize)
          Register-WmtSubwindowBounds -Dialog $fixed
          Assert-Wmt ($null -eq $fixed.ClosedHandler) 'fixed-size dialogs do not register a size persistence handler'
          $script:ciSettings.SubwindowBounds.InvalidSize = @{ Width = 100; Height = 100 }
          $invalid = New-TestWindow 'Invalid Size'
          Register-WmtSubwindowBounds -Dialog $invalid
          Assert-Wmt ($invalid.Width -eq 750 -and $invalid.Height -eq 550) 'saved dimensions below the dialog minimum are ignored'
          Write-Host "Subwindow bounds and state tests passed: $script:passed assertions."

  runtime-safety:
    name: Runtime and implementation safety contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Run isolated runtime safety tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $passed = 0
          function Assert-That([bool]$Condition, [string]$Message) { if (-not $Condition) { throw "FAILED: $Message" }; $script:passed++; Write-Host "PASS: $Message" }
          # Isolated runtime contract tests; no host registry, devices, or services are modified.
          # Cancellation while a real PowerShell pipeline is active.
          $cancelPool = [runspacefactory]::CreateRunspacePool(1,1); $cancelPool.Open(); $cancelPs = [PowerShell]::Create(); $cancelPs.RunspacePool = $cancelPool
          $null = $cancelPs.AddScript('while ($true) { Start-Sleep -Milliseconds 40 }')
          $cancelAsync = $cancelPs.BeginInvoke(); Start-Sleep -Milliseconds 200; $cancelPs.Stop()
          $cancelState = $cancelPs.InvocationStateInfo.State
          try { $null = $cancelPs.EndInvoke($cancelAsync) } catch { }
          Assert-That ($cancelState -eq [System.Management.Automation.PSInvocationState]::Stopped) 'active PowerShell worker reaches Stopped after cancellation'
          $cancelPs.Dispose(); $cancelPool.Close(); $cancelPool.Dispose()
          $pool = [runspacefactory]::CreateRunspacePool(1,1); $pool.Open(); $ps = [PowerShell]::Create(); $ps.RunspacePool = $pool; $null = $ps.AddScript('throw "intentional worker termination fault"'); $async = $ps.BeginInvoke(); $reported = $false
          try { $null = $ps.EndInvoke($async) } catch { $reported = $_.ToString().Contains('intentional worker termination fault') } finally { $ps.Dispose(); $pool.Close(); $pool.Dispose() }
          Assert-That $reported 'worker termination exceptions are observable'
          $iss = [System.Management.Automation.Runspaces.InitialSessionState]::CreateDefault(); $scanPool = [runspacefactory]::CreateRunspacePool(1,3,$iss,$Host); $scanPool.Open(); $workers = [System.Collections.Generic.List[object]]::new()
          try { 1..12 | ForEach-Object { $worker = [PowerShell]::Create(); $worker.RunspacePool = $scanPool; $null = $worker.AddScript({ param($id) Start-Sleep -Milliseconds (20 + ($id % 4) * 10); [pscustomobject]@{ Provider=$id; State='Complete' } }).AddArgument($_); $workers.Add([pscustomobject]@{ PowerShell=$worker; Async=$worker.BeginInvoke() }) }; $results=@(); foreach($worker in $workers){ $results += @($worker.PowerShell.EndInvoke($worker.Async)); if($worker.PowerShell.HadErrors){throw 'Provider scan emitted an error.'} }; Assert-That ($results.Count -eq 12) 'concurrent scans return every provider result'; Assert-That (@($results.Provider | Sort-Object -Unique).Count -eq 12) 'provider identities remain isolated' }
          finally { foreach($worker in $workers){$worker.PowerShell.Dispose()}; $scanPool.Close(); $scanPool.Dispose() }
          function Test-WmtDriverRemovalCandidate { param([bool]$Known,[bool]$InUse,[bool]$BootCritical,[bool]$HasBackup); return ($Known -and -not $InUse -and -not $BootCritical -and $HasBackup) }
          Assert-That (Test-WmtDriverRemovalCandidate $true $false $false $true) 'known orphan with backup is eligible'; Assert-That (-not (Test-WmtDriverRemovalCandidate $false $false $false $true)) 'unknown driver is retained'; Assert-That (-not (Test-WmtDriverRemovalCandidate $true $true $false $true)) 'in-use driver is retained'; Assert-That (-not (Test-WmtDriverRemovalCandidate $true $false $true $true)) 'boot-critical driver is retained'; Assert-That (-not (Test-WmtDriverRemovalCandidate $true $false $false $false)) 'driver without backup is retained'
          $temp = Join-Path ([IO.Path]::GetTempPath()) ('wmt-ci-' + [guid]::NewGuid().ToString('N')); $null=New-Item -ItemType Directory -Path $temp
          try { $live=Join-Path $temp 'export.reg'; $backup=Join-Path $temp 'export.backup.reg'; $original='WMT test registry export'; [IO.File]::WriteAllText($live,$original,[Text.Encoding]::Unicode); Copy-Item $live $backup; $before=(Get-FileHash $backup -Algorithm SHA256).Hash; [IO.File]::WriteAllText($live,'corrupt',[Text.Encoding]::Unicode); Copy-Item $backup $live -Force; $after=(Get-FileHash $live -Algorithm SHA256).Hash; Assert-That ($before -eq $after) 'registry backup restores byte-identical data'; Assert-That ((Get-Item $backup).Length -gt 0) 'empty backup is rejected' } finally { Remove-Item $temp -Recurse -Force }
          $temp=Join-Path ([IO.Path]::GetTempPath()) ('wmt-settings-' + [guid]::NewGuid().ToString('N')); $null=New-Item -ItemType Directory -Path $temp
          try { $settings=Join-Path $temp 'settings.json'; $pending=$settings+'.tmp'; $expected=[ordered]@{Theme='Dark';RestoreOnLaunch=$true;ScanConcurrency=3}; [IO.File]::WriteAllText($pending,($expected|ConvertTo-Json),[Text.UTF8Encoding]::new($false)); Move-Item $pending $settings -Force; $actual=Get-Content $settings -Raw|ConvertFrom-Json; Assert-That ($actual.Theme -eq 'Dark' -and $actual.RestoreOnLaunch -eq $true -and $actual.ScanConcurrency -eq 3) 'settings survive JSON round-trip'; [IO.File]::WriteAllText($settings,'{invalid json',[Text.UTF8Encoding]::new($false)); $bad=$false; try{$null=Get-Content $settings -Raw|ConvertFrom-Json -ErrorAction Stop}catch{$bad=$true}; Assert-That $bad 'corrupt settings are detected for recovery' } finally { Remove-Item $temp -Recurse -Force }
          function Get-WmtCiOsFamily([int]$Build){if($Build -ge 22000){'Windows11'}elseif($Build -ge 10240){'Windows10'}else{'Unsupported'}}
          Assert-That ((Get-WmtCiOsFamily 19045) -eq 'Windows10') 'Windows 10 build classification'; Assert-That ((Get-WmtCiOsFamily 22631) -eq 'Windows11') 'Windows 11 23H2 build classification'; Assert-That ((Get-WmtCiOsFamily 26100) -eq 'Windows11') 'Windows 11 24H2 build classification'; Assert-That ((Get-WmtCiOsFamily 9600) -eq 'Unsupported') 'pre-Windows-10 build rejection'
          Write-Host "Runtime safety contract tests passed: $passed assertions."
      - name: Run WMT implementation integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script:passed = 0
          function Assert-Wmt([bool]$Condition, [string]$Message) { if (-not $Condition) { throw "FAILED: $Message" }; $script:passed++; Write-Host "PASS: $Message" }
          $sourcePath = Resolve-Path '.\WMT-GUI.ps1'
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($sourcePath.Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw "WMT source parse failed: $($parseErrors[0].Message)" }
          function Import-WmtFunction([string]$Name) {
              $node = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $Name }, $true)
              if (-not $node) { throw "WMT function missing: $Name" }
              $bodyText = $node.Body.Extent.Text
              $bodyText = $bodyText.Substring(1, $bodyText.Length - 2)
              Set-Item -Path ("Function:script:" + $Name) -Value ([scriptblock]::Create($bodyText))
          }
          # Exercise WMT's actual atomic settings writer against isolated temporary files.
          Import-WmtFunction 'Write-WmtSettingsFileAtomic'
          $script:WmtSettingsWriteMutexName = 'Local\Wmt-CI-' + [guid]::NewGuid().ToString('N')
          $root = Join-Path ([IO.Path]::GetTempPath()) ('wmt-actual-settings-' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($root)
          try {
              $path = Join-Path $root 'settings.json'
              $first = '{"Theme":"dark","ScanConcurrency":2}'
              Write-WmtSettingsFileAtomic -Path $path -Json $first
              Assert-Wmt ((Get-Content -LiteralPath $path -Raw | ConvertFrom-Json).ScanConcurrency -eq 2) 'WMT atomic settings writer creates readable settings'
              $second = '{"Theme":"light","ScanConcurrency":4}'
              Write-WmtSettingsFileAtomic -Path $path -Json $second
              Assert-Wmt ((Get-Content -LiteralPath $path -Raw | ConvertFrom-Json).Theme -eq 'light') 'WMT atomic settings writer replaces existing settings'
              $stable = [IO.File]::ReadAllText($path)
              $rejected = $false
              try { Write-WmtSettingsFileAtomic -Path $path -Json '{invalid json' } catch { $rejected = $true }
              Assert-Wmt $rejected 'WMT atomic settings writer rejects malformed JSON'
              Assert-Wmt ([IO.File]::ReadAllText($path) -eq $stable) 'malformed settings never overwrite last known-good file'
              Assert-Wmt (-not (Get-ChildItem -LiteralPath $root -Filter '*.tmp' -File)) 'settings writer cleans temporary files after failure'
              Assert-Wmt ([IO.File]::Exists($path + '.bak')) 'settings writer retains a prior settings backup'
          } finally { Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue }
          # Exercise WMT's real driver cleanup decision loop; only pnputil and inventory calls are mocked.
          Import-WmtFunction 'Invoke-WmtDriverCleanupBatch'
          $script:ciUsageMode = 'Safe'
          $script:ciUsageCalls = 0
          $script:ciProcessCalls = [System.Collections.Generic.List[string]]::new()
          function Get-WmtDriverCleanupUsage {
              param([string]$PublishedName = '')
              $script:ciUsageCalls++
              if ($script:ciUsageMode -eq 'Fail') { throw 'mock inventory unavailable' }
              if ($script:ciUsageMode -eq 'InUse' -and $PublishedName) { return [pscustomobject]@{ InUseInfs = @($PublishedName); RegisteredServices = @() } }
              if ($script:ciUsageMode -eq 'Service' -and $PublishedName) { return [pscustomobject]@{ InUseInfs = @(); RegisteredServices = @('MockFilterSvc') } }
              return [pscustomobject]@{ InUseInfs = @(); RegisteredServices = @() }
          }
          function Invoke-WmtProcess {
              param([string]$FilePath, [string]$Arguments, [int]$TimeoutMs, [string]$Encoding, [switch]$KillTree)
              [void]$script:ciProcessCalls.Add($Arguments)
              if ($Arguments -match '/export-driver') { return [pscustomobject]@{ ExitCode = 0; TimedOut = $false; TerminationFailed = $false; OutputReadTimedOut = $false; Error = ''; StdOut = 'exported'; StdErr = '' } }
              return [pscustomobject]@{ ExitCode = 0; TimedOut = $false; TerminationFailed = $false; OutputReadTimedOut = $false; Error = ''; StdOut = 'removed'; StdErr = '' }
          }
          $backupRoot = Join-Path ([IO.Path]::GetTempPath()) ('wmt-driver-ci-' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($backupRoot)
          try {
              $script:ciUsageMode = 'InUse'; $script:ciProcessCalls.Clear()
              $result = Invoke-WmtDriverCleanupBatch -Items @([pscustomobject]@{ PublishedName = 'oem10.inf'; OriginalName = 'in-use' }) -Mode NoBackup -BackupRoot $backupRoot
              Assert-Wmt ($result.Failed -eq 1 -and $script:ciProcessCalls.Count -eq 0) 'WMT driver cleanup refuses packages bound to active devices'
              $script:ciUsageMode = 'Service'; $script:ciProcessCalls.Clear()
              $result = Invoke-WmtDriverCleanupBatch -Items @([pscustomobject]@{ PublishedName = 'oem11.inf'; OriginalName = 'filter' }) -Mode NoBackup -BackupRoot $backupRoot
              Assert-Wmt ($result.Failed -eq 1 -and $script:ciProcessCalls.Count -eq 0) 'WMT driver cleanup refuses packages with registered services'
              $script:ciUsageMode = 'Fail'; $script:ciProcessCalls.Clear()
              $result = Invoke-WmtDriverCleanupBatch -Items @([pscustomobject]@{ PublishedName = 'oem12.inf'; OriginalName = 'unknown' }) -Mode NoBackup -BackupRoot $backupRoot
              Assert-Wmt ($result.Failed -eq 1 -and $script:ciProcessCalls.Count -eq 0) 'WMT driver cleanup fails closed when usage inventory fails'
              $script:ciUsageMode = 'Safe'; $script:ciProcessCalls.Clear()
              $result = Invoke-WmtDriverCleanupBatch -Items @([pscustomobject]@{ PublishedName = 'oem13.inf'; OriginalName = 'safe' }) -Mode Backup -BackupRoot $backupRoot
              Assert-Wmt ($result.Failed -eq 0 -and $result.Deleted -contains 'oem13.inf') 'WMT driver cleanup permits verified unused package after successful backup'
              Assert-Wmt ($script:ciProcessCalls.Count -eq 2 -and $script:ciProcessCalls[0] -match '/export-driver' -and $script:ciProcessCalls[1] -match '/delete-driver') 'WMT driver cleanup orders export before deletion'
              $script:ciProcessCalls.Clear()
              $result = Invoke-WmtDriverCleanupBatch -Items @([pscustomobject]@{ PublishedName = 'invalid.inf'; OriginalName = 'invalid' }) -Mode NoBackup -BackupRoot $backupRoot
              Assert-Wmt ($result.Failed -eq 1 -and $script:ciProcessCalls.Count -eq 0) 'WMT driver cleanup rejects malformed published INF identifiers'
          } finally { Remove-Item -LiteralPath $backupRoot -Recurse -Force -ErrorAction SilentlyContinue }
          # Exercise the real background-operation manager with isolated runspaces and no UI.
          foreach ($name in @('Write-WmtBackgroundOperationLog', 'Initialize-WmtBackgroundOperationManager', 'Start-WmtBackgroundOperation', 'Request-WmtBackgroundOperationCancellation', 'Update-WmtBackgroundOperations', 'Stop-WmtBackgroundOperationManager')) { Import-WmtFunction $name }
          $script:WmtBackgroundOperationState = [pscustomobject]@{
              SyncRoot = [object]::new()
              Operations = [System.Collections.Generic.Dictionary[string, object]]::new()
              NextId = [long]0
              ShuttingDown = $false
              Log = $null
          }
          $script:ciOperationLogs = [System.Collections.Generic.List[string]]::new()
          Initialize-WmtBackgroundOperationManager -Log { param($line) [void]$script:ciOperationLogs.Add([string]$line) }
          $id = Start-WmtBackgroundOperation -Name 'CI-cancel' -ScriptBlock { while ($true) { Start-Sleep -Milliseconds 25 } } -TimeoutSeconds 30 -Quiet
          Assert-Wmt ($script:WmtBackgroundOperationState.Operations.ContainsKey($id)) 'WMT manager registers active worker'
          Assert-Wmt (Request-WmtBackgroundOperationCancellation -Id $id -Reason 'CI cancellation') 'WMT manager accepts active cancellation'
          $deadline = [DateTime]::UtcNow.AddSeconds(8)
          while ($script:WmtBackgroundOperationState.Operations.ContainsKey($id) -and [DateTime]::UtcNow -lt $deadline) { [void](Update-WmtBackgroundOperations); Start-Sleep -Milliseconds 40 }
          Assert-Wmt (-not $script:WmtBackgroundOperationState.Operations.ContainsKey($id)) 'WMT manager reaps cancelled worker after completion'
          Assert-Wmt (@($script:ciOperationLogs | Where-Object { $_ -match 'Cancelled' }).Count -gt 0) 'WMT manager logs cancellation even for quiet operations'
          $id = Start-WmtBackgroundOperation -Name 'CI-fault' -ScriptBlock { throw 'CI worker fault' } -TimeoutSeconds 10 -Quiet
          $deadline = [DateTime]::UtcNow.AddSeconds(8)
          while ($script:WmtBackgroundOperationState.Operations.ContainsKey($id) -and [DateTime]::UtcNow -lt $deadline) { [void](Update-WmtBackgroundOperations); Start-Sleep -Milliseconds 40 }
          Assert-Wmt (-not $script:WmtBackgroundOperationState.Operations.ContainsKey($id)) 'WMT manager reaps failed worker'
          Assert-Wmt (@($script:ciOperationLogs | Where-Object { $_ -match 'Failed' }).Count -gt 0) 'WMT manager reports worker failures when Quiet is set'
          $id = Start-WmtBackgroundOperation -Name 'CI-shutdown' -ScriptBlock { while ($true) { Start-Sleep -Milliseconds 25 } } -TimeoutSeconds 30 -Quiet
          Assert-Wmt ((Stop-WmtBackgroundOperationManager) -eq 1) 'WMT manager requests cancellation of outstanding work at shutdown'
          $deadline = [DateTime]::UtcNow.AddSeconds(8)
          while ($script:WmtBackgroundOperationState.Operations.ContainsKey($id) -and [DateTime]::UtcNow -lt $deadline) { [void](Update-WmtBackgroundOperations); Start-Sleep -Milliseconds 40 }
          Assert-Wmt (-not $script:WmtBackgroundOperationState.Operations.ContainsKey($id)) 'WMT manager drains shutdown worker'
          $rejected = $false; try { Start-WmtBackgroundOperation -Name 'after-shutdown' -ScriptBlock { 1 } } catch { $rejected = $true }
          Assert-Wmt $rejected 'WMT manager refuses new work after shutdown'
          Write-Host "WMT implementation integration tests passed: $script:passed assertions."
