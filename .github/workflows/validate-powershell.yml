                      Measure-Window $d
                      $listHeader=@(Find-VisualsOfType $list ([Windows.Controls.GridViewColumnHeader]) | Where-Object { $_.Role -eq 'Normal' })[0]
                      $gridHeader=@(Find-VisualsOfType $grid ([Windows.Controls.Primitives.DataGridColumnHeader]) | Where-Object { $null -ne $_.Column })[0]
                      Assert ($listHeader.Padding -eq $gridHeader.Padding -and $listHeader.FontWeight -eq $gridHeader.FontWeight -and $listHeader.FontSize -eq $gridHeader.FontSize) 'The two table types use different column header spacing or typography.'
                      $sharedHeader=$d.TryFindResource('WmtColumnHeaderStyle')
                      Assert ($null -ne $sharedHeader -and $listHeader.Style.BasedOn -eq $sharedHeader -and $gridHeader.Style.BasedOn -eq $sharedHeader) 'Column headers duplicate their common styling.'
                      foreach ($header in @($listHeader,$gridHeader)) {
                          Assert ($header.Background.Color -eq $d.Resources['BgPanel'].Color -and $header.Foreground.Color -eq $d.Resources['TextSecondary'].Color) "$theme column headers ignore shared theme colors."
                          Assert ($header.Template.FindName('HeaderBorder',$header).Background.Color -eq $d.Resources['BgPanel'].Color) "$theme normal column headers render with the filler background."
                      }
                      $listHandle=$listHeader.Template.FindName('PART_HeaderGripper',$listHeader)
                      $gridHandle=$gridHeader.Template.FindName('PART_RightHeaderGripper',$gridHeader)
                      $sharedHandle=$d.TryFindResource('WmtColumnHeaderGripperStyle')
                      Assert ($null -ne $sharedHandle -and $listHandle.Style -eq $sharedHandle -and $gridHandle.Style -eq $sharedHandle) 'Column dividers have separate styling between table types.'
                      foreach ($handle in @($listHandle,$gridHandle)) {
                          $separator=$handle.Template.FindName('HeaderSeparator',$handle)
                          Assert ($separator.BorderBrush.Color -eq $d.Resources['BorderBrush'].Color) "$theme column divider is unthemed."
                      }
                      $filler=@(Find-VisualsOfType $grid ([Windows.Controls.Primitives.DataGridColumnHeader]) | Where-Object { $null -eq $_.Column })[0]
                      Assert ($filler.Template.FindName('HeaderBorder',$filler).Background.Color.A -eq 0 -and -not $filler.IsHitTestVisible) 'DataGrid filler still looks or acts like another column.'
