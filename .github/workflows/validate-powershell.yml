          Test-Case 'Grids populated before attachment register their owner when loaded' {
              $d=Arrange-Window '<ContentControl Name="host"/>'
              try {
                  $grid=[Windows.Controls.DataGrid]::new()
                  Set-WmtDataGridColumns -DataGrid $grid -Columns @('Name','State') -Widths @{Name=180; State=90}
