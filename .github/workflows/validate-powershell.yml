          Test-Case 'Path picker uses an existing ancestor and preserves text on cancellation' {
              $d = Arrange-Window '<ContentControl/>'
              try {
                  $d.Content.Content = New-WmtPathPicker -Owner $d -TextBoxName 'path' -BrowseButtonName 'browse'
