              } finally { $d.Close() }
          }
          Test-Case 'Provider completion captures state and releases its monitor after verification' {
              $tickRegistration = $ast.Find({ param($n)
                  $n -is [Management.Automation.Language.InvokeMemberExpressionAst] -and
                  $n.Member.Value -eq 'Add_Tick' -and $n.Extent.Text -match 'Provider monitor warning'
              }, $true)
              Assert ($null -ne $tickRegistration) 'Provider completion callback was not found.'
              # The callback uses GetNewClosure() to capture $monitorState; DispatcherTimer
              # has no Tag property. Compile the production callback in each test scope.
              foreach ($exitCode in @(0, 1)) {
                  $timer = [Windows.Threading.DispatcherTimer]::new()
                  $timer.Interval = [TimeSpan]::FromHours(1)
                  $tempScriptPath = [IO.Path]::GetTempFileName()
                  $status = @{ Refreshed = $false }
                  $statusCache = @{}
                  $monitors = @{}
                  $monitor = [pscustomobject]@{
                      Key = 'ProviderTest'; Process = [pscustomobject]@{ HasExited = $false; ExitCode = $exitCode }
                      TempScriptPath = $tempScriptPath; ProviderName = 'Test provider'; Action = 'Install'
                      ProviderKey = 'ProviderTest'
                      # Get-Command is available in an isolated Windows PowerShell runspace.
                      ProviderInfo = [pscustomobject]@{ Key = 'ProviderTest'; Commands = [string[]]@('Get-Command') }
                      StatusCache = $statusCache
                      ExitObserved = $false; CompletionLogged = $false
                      RefreshCompleted = $false; TempRemoved = $false
                      DetectionPs = $null; DetectionInvocation = $null
                      DetectionStartedUtc = [DateTime]::MinValue
                      LastErrorLogUtc = [DateTime]::MinValue
                      Monitors = $monitors; UpdateStatuses = { $status.Refreshed = $true }.GetNewClosure()
                      ExitCode = 1
                  }
                  $monitorState = $monitor
                  $callback = Invoke-Expression $tickRegistration.Arguments[0].Extent.Text
                  $monitors[$monitor.Key] = $monitor
                  $timer.Start()
                  try {
                      & $callback $timer ([EventArgs]::Empty)
                      Assert ($timer.IsEnabled -and $monitors.ContainsKey($monitor.Key)) 'A running provider lost its completion monitor.'
                      Assert ((Test-Path -LiteralPath $tempScriptPath) -and -not $status.Refreshed) 'A running provider was cleaned up early.'
                      $workingProcess = $monitor.Process
                      $faultedProcess = [pscustomobject]@{ ExitCode = $exitCode }
                      $faultedProcess | Add-Member -MemberType ScriptProperty -Name HasExited -Value { throw 'Transient process observation error' }
                      $monitor.Process = $faultedProcess
                      & $callback $timer ([EventArgs]::Empty)
                      Assert ($timer.IsEnabled -and $monitors.ContainsKey($monitor.Key)) 'A transient observation error abandoned a live provider.'
                      Assert (Test-Path -LiteralPath $tempScriptPath) 'An observation error removed the provider script.'
                      $monitor.Process = $workingProcess
                      $monitor.Process.HasExited = $true
                      # Detection is asynchronous, so permit ticks until EndInvoke is ready.
                      $watch = [Diagnostics.Stopwatch]::StartNew()
                      while ($timer.IsEnabled -and $watch.ElapsedMilliseconds -lt 6000) {
                          & $callback $timer ([EventArgs]::Empty)
                          if ($timer.IsEnabled) { Start-Sleep -Milliseconds 25 }
                      }
                      Assert (-not $timer.IsEnabled) 'The completed provider timer was not stopped.'
                      Assert (-not $monitors.ContainsKey($monitor.Key)) 'The completed provider monitor was retained.'
                      Assert (-not (Test-Path -LiteralPath $tempScriptPath)) 'The completed provider script was retained.'
                      Assert ($status.Refreshed) 'Provider status was not refreshed after completion.'
                      Assert ($statusCache.ProviderTest.Installed) 'Provider installed-state cache was not updated after exit.'
                      Assert ($statusCache.ProviderTest.ExitCode -eq $exitCode) 'Provider exit code was not preserved.'
                  }
                  finally {
                      $timer.Stop()
                      if ($monitor.DetectionPs) { try { $monitor.DetectionPs.Dispose() } catch {} }
                      Remove-Item -LiteralPath $tempScriptPath -Force -ErrorAction SilentlyContinue
                  }
              }
          }
          Test-Case 'Both provider option forms load in the common installer shell' {
