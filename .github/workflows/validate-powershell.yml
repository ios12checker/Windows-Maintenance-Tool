                      $header=@(Find-VisualsOfType $table $headerType | Where-Object { $_.Column -eq $vC })[0]
                      $handle=$header.Template.FindName($part,$header)
                      $handle.RaiseEvent([Windows.Controls.Primitives.DragStartedEventArgs]::new(0,0))
                      $handle.RaiseEvent([Windows.Controls.Primitives.DragDeltaEventArgs]::new(750,0))
                      $handle.RaiseEvent([Windows.Controls.Primitives.DragCompletedEventArgs]::new(750,0,$false))
                      $manualWidth=$vC.ActualWidth
                      Assert ($manualWidth -gt $oldWidth+700) "$kind constrains a dragged column to its window."
                      foreach ($width in @(400,1600,600)) {
                          Measure-Window $d $width 250
                          $viewer=Get-WmtVisualDescendant -Element $table -DescendantType ([Windows.Controls.ScrollViewer])
                          Assert ([Math]::Abs($vC.ActualWidth-$manualWidth) -lt 1) "$kind discards manual column widths when the viewport changes."
                          if ($width -eq 1600) {
                              $inset=if ($kind -eq 'GridView') { 6 } else { 0 }
                              $total=($columns | Measure-Object -Property ActualWidth -Sum).Sum
                              Assert ([Math]::Abs($total-($viewer.ViewportWidth-$inset)) -le 1 -and $viewer.ScrollableWidth -eq 0) "$kind does not fill spare space around manual widths."
                          } else { Assert ($viewer.ScrollableWidth -gt 0) "$kind clips wide columns instead of allowing horizontal scrolling." }
                      }
                      # Native auto-sizing resets the manually chosen width.
                      $vC.Width=if ($kind -eq 'GridView') { [double]::NaN } else { [Windows.Controls.DataGridLength]::Auto }
                      Measure-Window $d 600 250
                      $total=($columns | Measure-Object -Property ActualWidth -Sum).Sum
                      $inset=if ($kind -eq 'GridView') { 6 } else { 0 }
                      Assert ($vC.ActualWidth -lt $manualWidth-500 -and $viewer.ScrollableWidth -eq 0 -and [Math]::Abs($total-($viewer.ViewportWidth-$inset)) -le 1) "$kind cannot resume automatic filling after a column width reset."
                      Assert ($table.SelectedIndex -eq 0 -and $table.Items.Count -eq 50) "$kind sizing changes rows or selection."
                  } finally { $d.Close() }
              }
          }
          Test-Case 'Shared sizing respects DataGrid width bounds, star ratios, and hidden columns' {
              $d=Arrange-Window '<DataGrid Name="grid" AutoGenerateColumns="False"><DataGrid.Columns><DataGridTextColumn Header="ID" Width="100" MaxWidth="100" Binding="{Binding ID}"/><DataGridTextColumn Header="Name" Width="2*" Binding="{Binding Name}"/><DataGridTextColumn Header="State" Width="*" Binding="{Binding State}"/><DataGridTextColumn Header="Internal" Width="500" Visibility="Collapsed" Binding="{Binding Internal}"/></DataGrid.Columns></DataGrid>'
              try {
                  $grid=$d.FindName('grid')
                  $grid.ItemsSource=@([pscustomobject]@{ID='1';Name='Example';State='Ready';Internal='Hidden'})
                  Measure-Window $d 600 250
