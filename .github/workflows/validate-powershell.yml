          Test-Case 'Every dialog table inherits shared column headers and fills its resized viewport' {
              foreach ($functionName in @('Show-WmtScheduledTasksDialog','Show-WmtCustomUpdateCommandManager','Show-WmtCleanupPreviewWpf','Show-RegistryCleaner','Show-BrokenShortcuts','Invoke-ExportDrivers','Show-GhostDevicesDialog','Show-DriverCleanupDialog','Show-SystemRestoreManager','Show-WmtCompactManager')) {
                  $fn=$ast.Find({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $functionName},$true)
                  $assignment=$fn.Body.Find({param($n) $n -is [Management.Automation.Language.AssignmentStatementAst] -and $n.Right.Extent.Text -match '<DataGrid[ >]|<ListView[ >]'},$true)
                  Invoke-Expression $assignment.Extent.Text
                  $markup=(Get-Variable -Name ($assignment.Left.Extent.Text -replace '^\[xml\]','' -replace '^\$','') -ValueOnly).ToString()
                  $d=if ($markup -match '<Window\s') { New-WmtWindowFromFullXaml -Xaml $markup -NoOwner } else { Arrange-Window $markup }
                  try {
                      foreach ($match in [regex]::Matches($markup,'(?s)<(?:DataGrid|ListView)\s[^>]*?(?:Name|x:Name)="([^"]+)"')) {
                          $table=$d.FindName($match.Groups[1].Value)
                          $parent=$table
                          while ($parent -and $parent -ne $d) {
                              if ($parent -is [Windows.UIElement]) { $parent.Visibility='Visible' }
                              $parent=[Windows.LogicalTreeHelper]::GetParent($parent)
                          }
                          if ($table -is [Windows.Controls.DataGrid] -and $table.Columns.Count -eq 0) { Set-WmtDataGridColumns -DataGrid $table -Columns @('Name','State') }
                          $table.ItemsSource=@([pscustomobject]@{Name='Example';State='Enabled';Check=$false})
                          foreach ($theme in @('dark','light')) {
                              Set-WmtThemeResources -Element $d -Palette $script:ThemePalettes[$theme]
                              Measure-Window $d 1000 680
                              $headers=if ($table -is [Windows.Controls.DataGrid]) { @(Find-VisualsOfType $table ([Windows.Controls.Primitives.DataGridColumnHeader]) | Where-Object { $null -ne $_.Column }) } else { @(Find-VisualsOfType $table ([Windows.Controls.GridViewColumnHeader]) | Where-Object { $_.Role -eq 'Normal' }) }
                              Assert ($headers.Count -gt 0) "$functionName did not render column headers."
                              foreach ($header in $headers) {
                                  Assert ($header.Style.BasedOn -eq $d.TryFindResource('WmtColumnHeaderStyle') -and $null -ne $header.Style.BasedOn) "$functionName bypasses the shared column header styling."
                                  Assert ($header.Background.Color -eq $d.Resources['BgPanel'].Color -and $header.Foreground.Color -eq $d.Resources['TextSecondary'].Color) "$functionName has unthemed $theme column headers."
                                  Assert ($header.Template.FindName('HeaderBorder',$header).Background.Color -eq $d.Resources['BgPanel'].Color) "$functionName renders normal headers with the filler background."
                                  $part=if ($table -is [Windows.Controls.DataGrid]) { 'PART_RightHeaderGripper' } else { 'PART_HeaderGripper' }
                                  Assert ($header.Template.FindName($part,$header).Style -eq $d.TryFindResource('WmtColumnHeaderGripperStyle')) "$functionName bypasses shared column divider styling."
                              }
                              Measure-Window $d 1900 680
                              $viewer=Get-WmtVisualDescendant -Element $table -DescendantType ([Windows.Controls.ScrollViewer])
                              $columns=if ($table -is [Windows.Controls.DataGrid]) { $table.Columns | Where-Object Visibility -eq 'Visible' } else { $table.View.Columns }
                              $inset=if ($table -is [Windows.Controls.DataGrid]) { 0 } else { 6 }
                              $total=($columns | Measure-Object -Property ActualWidth -Sum).Sum
                              Assert ([Math]::Abs($total-($viewer.ViewportWidth-$inset)) -le 1 -and $viewer.ScrollableWidth -eq 0) "$functionName does not use shared viewport filling after resizing."
                          }
                      }
                  } finally { $d.Close() }
              }
          }
          function Arrange-RegistryResults {
              $fn=$ast.Find({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Show-RegistryCleaner'},$true)
              foreach ($name in @('Get-WmtVisualParentOfType','Select-WmtRegistryGridRowFromOriginalSource','Set-WmtRegistryHighlightedRowsChecked','ConvertTo-WmtRegistryResultClipboardText','Connect-WmtRegistryResultSorting','Connect-WmtRegistryResultClipboard')) {
                  $helper=$fn.Body.Find({param($n) $n -is [Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -replace '^script:','' -eq $name},$true)
                  if ($helper) { Invoke-Expression $helper.Extent.Text }
              }
              $assignment=$fn.Body.Find({param($n) $n -is [Management.Automation.Language.AssignmentStatementAst] -and $n.Left.Extent.Text -eq '[xml]$registryCleanerXaml'},$true)
              Invoke-Expression $assignment.Extent.Text
              New-WmtWindowFromFullXaml -Xaml $registryCleanerXaml -NoOwner
          }
          Test-Case 'Registry results fill the viewport on resize while retaining manually dragged widths' {
              $d=Arrange-RegistryResults
              try {
                  $list=$d.FindName('dgRegistry')
                  $list.ItemsSource=@(1..60 | ForEach-Object { [pscustomobject]@{Check=$false;Problem="Finding $_";FullPath='HKLM:\SOFTWARE\Example';Details='Review finding'} })
                  $list.SelectedIndex=0
                  foreach ($theme in @('dark','light')) {
                      Set-WmtThemeResources -Element $d -Palette $script:ThemePalettes[$theme]
                      Measure-Window $d 1280 680
                      $pathWidth=$list.View.Columns[10].ActualWidth
                      foreach ($width in @(1780,1280)) {
                          Measure-Window $d $width 680
                          $viewer=Get-WmtVisualDescendant -Element $list -DescendantType ([Windows.Controls.ScrollViewer])
                          $total=($list.View.Columns | Measure-Object -Property ActualWidth -Sum).Sum
                          Assert ([Math]::Abs($total-($viewer.ViewportWidth-6)) -le 1 -and $viewer.ScrollableWidth -eq 0) "Registry results do not fill the window at width $width."
                          if ($width -eq 1780) { Assert ($list.View.Columns[10].ActualWidth -gt $pathWidth+30) 'Registry path column does not grow with the window.' }
                      }
                  }
                  $vC=$list.View.Columns[10]
                  $header=@(Find-VisualsOfType $list ([Windows.Controls.GridViewColumnHeader]) | Where-Object { $_.Column -eq $vC })[0]
