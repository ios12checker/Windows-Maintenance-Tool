name: Validate PowerShell

on:
  workflow_dispatch:
  push:
    branches:
      - Main
    paths:
      - "WMT-GUI.ps1"
      - "PS2EXE/**/*.ps1"
      - ".github/workflows/validate-powershell.yml"
  pull_request:
    branches:
      - Main
    paths:
      - "WMT-GUI.ps1"
      - "PS2EXE/**/*.ps1"
      - ".github/workflows/validate-powershell.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact commit
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$env:GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
              ".\WMT-GUI.ps1",
              ".\PS2EXE\Build-Exe.ps1"
          )

          $failed = $false
          foreach ($file in $files) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  Write-Error "Missing expected PowerShell file: $file"
                  $failed = $true
                  continue
              }

              $tokens = $null
              $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path -LiteralPath $file).Path,
                  [ref]$tokens,
                  [ref]$parseErrors
              )

              if ($parseErrors -and $parseErrors.Count -gt 0) {
                  $failed = $true
                  Write-Host ""
                  Write-Host "Parse errors in $file" -ForegroundColor Red
                  foreach ($err in $parseErrors) {
                      Write-Host ("{0}:{1}: {2}" -f $err.Extent.StartLineNumber, $err.Extent.StartColumnNumber, $err.Message) -ForegroundColor Red
                  }
              }
              else {
                  Write-Host "OK: $file"
              }
          }

          if ($failed) {
              throw "PowerShell syntax validation failed."
          }

      - name: Verify maintenance actions fail safely
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput(
              $source, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw 'WMT must parse before maintenance safety checks.' }
          function Find-FunctionText([string]$name) {
              $node = $ast.Find({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
              }, $true)
              if (-not $node) { throw "Missing function: $name" }
              return $node.Extent.Text
          }

          $registryClean = Find-FunctionText 'Start-RegClean'
          $backupExport = $registryClean.IndexOf('reg.exe" export', [StringComparison]::OrdinalIgnoreCase)
          $backupCheck = $registryClean.IndexOf('$LASTEXITCODE -ne 0', [StringComparison]::Ordinal)
          $firstDelete = $registryClean.IndexOf('Remove-Item -LiteralPath $key.PSPath', [StringComparison]::Ordinal)
          if ($backupExport -lt 0 -or $backupCheck -le $backupExport -or $firstDelete -le $backupCheck -or
              $registryClean -notmatch 'Length -le 0' -or
              $registryClean -notmatch 'Remove-Item -LiteralPath \$key\.PSPath -Recurse -Force -ErrorAction Stop') {
              throw 'Registry cleanup must verify a nonempty export before deleting and must surface delete failures.'
          }

          $bamValueDelete = Find-FunctionText 'Remove-WmtProtectedBamDamValueNative'
          $deleteHelper = Find-FunctionText 'Remove-RegKeyForced'
          if (-not $bamValueDelete.Contains('CurrentControlSet\\Services\\') -or
              -not $bamValueDelete.Contains('(?:bam|dam)') -or
              -not $bamValueDelete.Contains('UserSettings') -or
              $bamValueDelete -notmatch 'TakeOwnership' -or
              $bamValueDelete -notmatch 'ChangePermissions' -or
              $bamValueDelete -notmatch 'GetAccessControl' -or
              $bamValueDelete -notmatch 'originalAccessSddl' -or
              $bamValueDelete -notmatch 'originalOwnerSddl' -or
              $bamValueDelete -notmatch 'SetSecurityDescriptorSddlForm' -or
              $bamValueDelete -notmatch 'DACL:' -or
              $bamValueDelete -notmatch 'Owner:' -or
              -not $source.Contains('SetLastError(0);') -or
              -not $source.Contains('return Marshal.GetLastWin32Error() != 1300;') -or
              $deleteHelper -notmatch 'Remove-WmtProtectedBamDamValueNative -Path \$targetPath') {
              throw 'Protected BAM/DAM value deletion must be narrowly scoped and restore the original owner and DACL.'
          }

          $updateRepair = Find-FunctionText 'Start-UpdateRepair'
          if ($updateRepair -notmatch 'Stop-Service -Name \$serviceName -Force -ErrorAction Stop' -or
              $updateRepair -notmatch 'netsh\.exe.*winsock reset' -or
              $updateRepair -notmatch '\$LASTEXITCODE -ne 0' -or
              $updateRepair -notmatch 'Could not restore service' -or
              $updateRepair -match 'SilentlyContinue') {
              throw 'Windows Update repair must check operation failures and restore prior service state.'
          }

          $indexStart = $source.IndexOf('if ($btnSearchIndexRebuild)')
          $indexEnd = $source.IndexOf('$btnToggleExtensions', $indexStart)
          if ($indexStart -lt 0 -or $indexEnd -le $indexStart) {
              throw 'Could not locate the Search Index rebuild handler.'
          }
          $indexRebuild = $source.Substring($indexStart, $indexEnd - $indexStart)
          if ($indexRebuild -notmatch 'Microsoft\\Search\\Data\\Applications\\Windows\\Windows\.edb' -or
              $indexRebuild -notmatch 'Remove-Item -LiteralPath \$databasePath -Force -ErrorAction Stop' -or
              $indexRebuild -notmatch 'Start-Service -Name "WSearch" -ErrorAction Stop' -or
              $indexRebuild -notmatch 'WaitForStatus' -or
              $indexRebuild -match 'SilentlyContinue') {
              throw 'Search Index rebuild must remove the database, restart the service, and report failures.'
          }

          Write-Host 'Registry cleanup backup gate, Windows Update repair recovery, and Search Index rebuild checks passed.'

      - name: Smoke test Quick Find button hosting and safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path '.\\WMT-GUI.ps1').Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'WMT must parse before Quick Find tests.' }
          foreach ($name in @('Add-WmtQuickFindOriginalButton', 'Restore-WmtQuickFindButtons')) {
              $functionAst = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                      $node.Name -eq $name
              }, $true)
              if (-not $functionAst) { throw "Missing Quick Find function: $name" }
              Invoke-Expression $functionAst.Extent.Text
          }
          $rendererAst = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq 'Update-WmtQuickFindResults'
          }, $true)
          if (-not $rendererAst) { throw 'Missing Quick Find result renderer.' }
          $rendererText = $rendererAst.Extent.Text
          $source = Get-Content -LiteralPath '.\\WMT-GUI.ps1' -Raw
          foreach ($controlName in @('btnDisplaySettings', 'btnSoundSettings', 'btnKeyboardSettings', 'btnA11ySettings')) {
              if ($rendererText -notmatch [regex]::Escape('"' + $controlName + '"')) {
                  throw "Quick Find must treat $controlName as a direct Settings action."
              }
          }
          if ($rendererText -notmatch '\$isQuickFindDirectAction\s*=\s*\(\$isSettingsAction' -or
              $rendererText -notmatch '-not\s+\$isQuickFindDirectAction') {
              throw 'Quick Find Settings actions must bypass Tweaks loading/state fallbacks and host the original button.'
          }
          foreach ($controlName in @('btnSearchIndexRebuild', 'btnSearchIndexOptions', 'btnTasksDisableTelemetry')) {
              if ($rendererText -notmatch [regex]::Escape('"' + $controlName + '"')) {
                  throw "Quick Find must treat $controlName as a direct action."
              }
          }
          if ($rendererText -notmatch '\$isServiceViewAction\s*=\s*\(\[string\]\$original\.Name\s+-eq\s+"btnSvcView"\)' -or
              $rendererText -notmatch '\$isRestartExplorerAction\s+-or\s+\$isServiceViewAction' -or
              $source -notmatch 'Add-SearchIndexEntry\s+"btnSvcView"\s+"View Services"\s+"btnTabTweaks"') {
              throw 'View Services must be hosted as a direct Quick Find action without waiting for tweak-state readiness.'
          }
          if ($rendererText -notmatch '\$optionalStateKnown\s*=' -or
              $rendererText -notmatch 'OptionalFeatureUnavailableCache' -or
              $source -notmatch 'Add-SearchIndexEntry\s+"btnFeatAppGuard"\s+"Application Guard"\s+"btnTabTweaks"') {
              throw 'Application Guard must show its known unavailable state instead of a loading fallback.'
          }
          if ($source -notmatch 'Add-SearchIndexEntry\s+"btnTasksDisableTelemetry"\s+"Telemetry Tasks"\s+"btnTabTweaks"' -or
              $source -match 'Add-SearchIndex(?:Navigation)?Entry[^\r\n]+"(?:Disable|Enable) (?:Background Jobs|Debug Logs|Update Scans|Start with Windows|Launch Minimized|Telemetry Tasks|Copilot|Recall)"') {
              throw 'Quick Find toggle titles must be state-neutral instead of duplicating Enable/Disable wording.'
          }
          foreach ($controlName in @('btnWUDefault', 'btnWUSecurity', 'btnWUDisable')) {
              if ($rendererText -notmatch [regex]::Escape('"' + $controlName + '"')) {
                  throw "Windows Update preset group is missing $controlName."
              }
          }
          if ($rendererText -notmatch 'WindowsUpdatePreset' -or
              $rendererText -notmatch 'Choose one Windows Update behavior') {
              throw 'Windows Update presets must render as one merged Quick Find entry.'
          }
          foreach ($controlName in @('btnPowerBatterySaverOff', 'btnPowerBatterySaver20', 'btnPowerBatterySaver50',
                                     'btnPerfServicesManual', 'btnPerfServicesRevert')) {
              if ($rendererText -notmatch [regex]::Escape('"' + $controlName + '"')) {
                  throw "Quick Find preset group is missing $controlName."
              }
          }
          if ($rendererText -notmatch 'BatterySaverPreset' -or
              $rendererText -notmatch 'ServicePreset' -or
              $rendererText -notmatch 'not represent reversible profiles') {
              throw 'Battery and service presets must render as grouped entries with honest state labels.'
          }
          if ($source -notmatch 'Add-SearchIndexEntry\s+"btnPowerBatterySaverOff"\s+"Battery Saver Behavior"\s+"btnTabTweaks"\s+"BatterySaverPreset"' -or
              $source -match 'Add-SearchIndexEntry\s+"btnPowerBatterySaver(20|50)"' -or
              $source -notmatch 'Add-SearchIndexEntry\s+"btnPerfServicesManual"\s+"Service Optimization"\s+"btnTabTweaks"\s+"ServicePreset"' -or
              $source -match 'Add-SearchIndexEntry\s+"btn(PerfServicesRevert|SvcOptimize|SvcRestore)"') {
              throw 'Battery and service options must each have one merged Quick Find entry.'
          }
          foreach ($functionName in @('Get-WmtWindowsUpdatePresetState', 'Get-WmtRegistrySnapshotValue', 'Test-WmtRegistrySnapshotHasValue', 'Set-WmtWindowsUpdatePresetState')) {
              $functionAst = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                      $node.Name -eq $functionName
              }, $true)
              if (-not $functionAst) { throw "Missing Windows Update state function: $functionName" }
              Invoke-Expression $functionAst.Extent.Text
          }
          function ConvertTo-Int { param($Value, $Default = 0); try { return [int]$Value } catch { return $Default } }
          $updatePath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          $autoPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
          $service = @{ WuauservStartType = 'Automatic'; WuauservStatus = 'Running' }
          $registry = @{ $updatePath = @{}; $autoPath = @{} }
          if ((Get-WmtWindowsUpdatePresetState $registry $service) -ne 'Default') {
              throw 'The default Windows Update state was not detected.'
          }
          $registry[$updatePath] = @{ DeferFeatureUpdates = 1; DeferFeatureUpdatesPeriodInDays = 365 }
          $registry[$autoPath] = @{ NoAutoUpdate = 0 }
          if ((Get-WmtWindowsUpdatePresetState $registry $service) -ne 'SecurityOnly') {
              throw 'The security-only Windows Update state was not detected.'
          }
          $registry[$autoPath] = @{ NoAutoUpdate = 1 }
          $service.WuauservStartType = 'Disabled'
          $service.WuauservStatus = 'Stopped'
          if ((Get-WmtWindowsUpdatePresetState $registry $service) -ne 'Disabled') {
              throw 'The disabled Windows Update state was not detected.'
          }
          $service.WuauservStartType = 'Automatic'
          $service.WuauservStatus = 'Running'
          if ((Get-WmtWindowsUpdatePresetState $registry $service) -ne 'Unknown') {
              throw 'A conflicting Windows Update configuration must not be reported as a known preset.'
          }
          $script:ciPresetButtons = @{
              btnWUDefault = [pscustomobject]@{ IsEnabled = $true }
              btnWUSecurity = [pscustomobject]@{ IsEnabled = $true }
              btnWUDisable = [pscustomobject]@{ IsEnabled = $true }
          }
          function Get-Ctrl([string]$Name) { return $script:ciPresetButtons[$Name] }
          function Update-WmtQuickFindStateLabels {}
          $script:WmtQuickFindWindowsUpdateProxies = [System.Collections.ArrayList]::new()
          foreach ($preset in @(
              @{ Button = 'btnWUDefault'; State = 'Default' }
              @{ Button = 'btnWUSecurity'; State = 'SecurityOnly' }
              @{ Button = 'btnWUDisable'; State = 'Disabled' }
          )) {
              [void]$script:WmtQuickFindWindowsUpdateProxies.Add([pscustomobject]@{
                  Proxy = [pscustomobject]@{ IsEnabled = $true }
                  Target = $script:ciPresetButtons[$preset.Button]
                  State = $preset.State
              })
          }
          Set-WmtWindowsUpdatePresetState -State 'SecurityOnly'
          if ($script:ciPresetButtons.btnWUSecurity.IsEnabled -or
              -not $script:ciPresetButtons.btnWUDefault.IsEnabled -or
              -not $script:ciPresetButtons.btnWUDisable.IsEnabled) {
              throw 'The current Windows Update preset button was not the only disabled preset.'
          }
          if ($script:WmtQuickFindWindowsUpdateProxies[1].Proxy.IsEnabled -or
              -not $script:WmtQuickFindWindowsUpdateProxies[0].Proxy.IsEnabled -or
              -not $script:WmtQuickFindWindowsUpdateProxies[2].Proxy.IsEnabled) {
              throw 'Quick Find did not gray only the active Windows Update preset button.'
          }
          $batteryStateAst = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq 'Set-WmtBatterySaverPresetState'
          }, $true)
          if (-not $batteryStateAst) { throw 'Missing battery saver preset state updater.' }
          Invoke-Expression $batteryStateAst.Extent.Text
          $script:ciBatteryButtons = @{
              btnPowerBatterySaverOff = [pscustomobject]@{ IsEnabled = $true }
              btnPowerBatterySaver20 = [pscustomobject]@{ IsEnabled = $true }
              btnPowerBatterySaver50 = [pscustomobject]@{ IsEnabled = $true }
          }
          function Get-Ctrl([string]$Name) {
              if ($script:ciPresetButtons.ContainsKey($Name)) { return $script:ciPresetButtons[$Name] }
              return $script:ciBatteryButtons[$Name]
          }
          $script:WmtQuickFindBatterySaverProxies = [System.Collections.ArrayList]::new()
          foreach ($preset in @(
              @{ Button = 'btnPowerBatterySaverOff'; Threshold = '0' }
              @{ Button = 'btnPowerBatterySaver20'; Threshold = '20' }
              @{ Button = 'btnPowerBatterySaver50'; Threshold = '50' }
          )) {
              [void]$script:WmtQuickFindBatterySaverProxies.Add([pscustomobject]@{
                  Proxy = [pscustomobject]@{ IsEnabled = $true }
                  Target = $script:ciBatteryButtons[$preset.Button]
                  ButtonName = $preset.Button
              })
          }
          Set-WmtBatterySaverPresetState -Threshold 20
          if ($script:ciBatteryButtons.btnPowerBatterySaver20.IsEnabled -or
              -not $script:ciBatteryButtons.btnPowerBatterySaverOff.IsEnabled -or
              -not $script:ciBatteryButtons.btnPowerBatterySaver50.IsEnabled -or
              $script:WmtQuickFindBatterySaverProxies[1].Proxy.IsEnabled -or
              -not $script:WmtQuickFindBatterySaverProxies[0].Proxy.IsEnabled -or
              -not $script:WmtQuickFindBatterySaverProxies[2].Proxy.IsEnabled) {
              throw 'Battery saver 20% detection did not disable only its active native and Quick Find options.'
          }
          foreach ($threshold in @(0, 50)) {
              Set-WmtBatterySaverPresetState -Threshold $threshold
              $activeIndex = if ($threshold -eq 0) { 0 } else { 2 }
              $buttonNames = @('btnPowerBatterySaverOff', 'btnPowerBatterySaver20', 'btnPowerBatterySaver50')
              foreach ($index in 0..2) {
                  $expectedEnabled = ($index -ne $activeIndex)
                  if ([bool]$script:ciBatteryButtons[$buttonNames[$index]].IsEnabled -ne $expectedEnabled -or
                      [bool]$script:WmtQuickFindBatterySaverProxies[$index].Proxy.IsEnabled -ne $expectedEnabled) {
                      throw "Battery saver threshold $threshold did not gray only its active option."
                  }
              }
          }
          foreach ($threshold in @($null, 30)) {
              Set-WmtBatterySaverPresetState -Threshold $threshold
              if (@($script:ciBatteryButtons.Values | Where-Object { -not $_.IsEnabled }).Count -ne 0 -or
                  @($script:WmtQuickFindBatterySaverProxies | Where-Object { -not $_.Proxy.IsEnabled }).Count -ne 0) {
                  throw 'Unknown or custom battery thresholds must leave all preset choices available.'
              }
          }
          $serviceActionAst = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq 'Test-WmtServiceStartupActionAvailable'
          }, $true)
          if (-not $serviceActionAst) { throw 'Missing service startup action state helper.' }
          Invoke-Expression $serviceActionAst.Extent.Text
          if (Test-WmtServiceStartupActionAvailable -SelectedRows @() -StartupType 'Automatic') {
              throw 'Service startup actions must be unavailable with no selected service.'
          }
          if (Test-WmtServiceStartupActionAvailable -SelectedRows @(@{ StartType = 'Automatic' }) -StartupType 'Automatic') {
              throw 'The matching service startup action must be disabled.'
          }
          if (-not (Test-WmtServiceStartupActionAvailable -SelectedRows @(@{ StartType = 'Manual' }) -StartupType 'Automatic') -or
              -not (Test-WmtServiceStartupActionAvailable -SelectedRows @(@{ StartType = 'Automatic' }, @{ StartType = 'Manual' }) -StartupType 'Automatic')) {
              throw 'Service startup actions must remain available for differing or mixed selected states.'
          }
          if ($source -notmatch 'Add-SearchIndexEntry\s+"btnWUDefault"\s+"Windows Update Behavior"\s+"btnTabTweaks"\s+"WindowsUpdatePreset"' -or
              $source -match 'Add-SearchIndexEntry\s+"btnWUSecurity"' -or
              $source -match 'Add-SearchIndexEntry\s+"btnWUDisable"') {
              throw 'Windows Update presets must have one merged Quick Find entry, not separate entries.'
          }
          function Write-GuiLog { param([string]$Message) Write-Host $Message }
          $script:WmtQuickFindMovedButtons = [System.Collections.ArrayList]::new()
          $nativePage = [System.Windows.Controls.Grid]::new()
          $nativePage.Name = 'pnlTweaks'
          # Only the native page root can be collapsed while Quick Find is open.
          $nativePage.Visibility = 'Collapsed'
          $group = [System.Windows.Controls.WrapPanel]::new()
          [void]$nativePage.Children.Add($group)
          $originalContext = [PSCustomObject]@{ Value = 17 }
          $nativePage.DataContext = $originalContext
          $button = [System.Windows.Controls.Button]::new()
          $button.Content = 'Safe tool'
          [void]$group.Children.Add($button)
          $quickFindHost = [System.Windows.Controls.StackPanel]::new()
          $script:quickFindSmokeClicks = 0
          $button.Add_Click({ $script:quickFindSmokeClicks++ })
          if (-not (Add-WmtQuickFindOriginalButton -Button $button -DestinationPanel $quickFindHost)) {
              throw 'An enabled native tool could not be moved to Quick Find.'
          }
          if ($button.Parent -ne $quickFindHost -or $script:WmtQuickFindMovedButtons.Count -ne 1) {
              throw 'Quick Find failed to track the moved button.'
          }
          if ($button.DataContext -ne $originalContext) { throw 'Inherited DataContext was lost.' }
          $button.RaiseEvent([System.Windows.RoutedEventArgs]::new(
              [System.Windows.Controls.Primitives.ButtonBase]::ClickEvent))
          if ($script:quickFindSmokeClicks -ne 1) { throw 'Native click handler was lost.' }
          Restore-WmtQuickFindButtons
          if ($button.Parent -ne $group -or $script:WmtQuickFindMovedButtons.Count -ne 0) {
              throw 'Quick Find did not restore the original control.'
          }
          if ($button.ReadLocalValue([System.Windows.FrameworkElement]::DataContextProperty) -ne
              [System.Windows.DependencyProperty]::UnsetValue) {
              throw 'Quick Find left a local DataContext override.'
          }
          $group.IsEnabled = $false
          if (Add-WmtQuickFindOriginalButton -Button $button -DestinationPanel $quickFindHost) {
              throw 'Disabled tool unexpectedly became movable/active.'
          }
          if ($button.Parent -ne $group) { throw 'Disabled tool was detached from its original location.' }
          $group.IsEnabled = $true
          $group.Visibility = 'Collapsed'
          if (Add-WmtQuickFindOriginalButton -Button $button -DestinationPanel $quickFindHost) {
              throw 'Hidden subsection tool escaped into Quick Find.'
          }
          $group.Visibility = 'Visible'
          # A failed restore must retain its record so a later attempt can retry.
          $faultyParent = [PSCustomObject]@{ Broken = $true }
          [void]$script:WmtQuickFindMovedButtons.Add([PSCustomObject]@{
              Button = $button; Parent = $faultyParent; Placeholder = $null
              Index = 0; InheritedDataContext = $false
          })
          Restore-WmtQuickFindButtons
          if ($script:WmtQuickFindMovedButtons.Count -ne 1) {
              throw 'Unrecoverable original-parent failure discarded its pending restoration.'
          }
          $script:WmtQuickFindMovedButtons.Clear()
          Write-Host 'Quick Find host/restore safety checks passed.'

      - name: Smoke test Quick Find natural-language matching
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path '.\\WMT-GUI.ps1').Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'WMT must parse before search matching tests.' }
          foreach ($name in @('ConvertTo-WmtQuickFindTokens', 'Get-WmtQuickFindMatchRank')) {
              $functionAst = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                      $node.Name -eq $name
              }, $true)
              if (-not $functionAst) { throw "Missing Quick Find matching function: $name" }
              Invoke-Expression $functionAst.Extent.Text
          }
          $aliasesAst = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and
                  $node.Left.Extent.Text -eq '$searchAliasesByButton'
          }, $true)
          if (-not $aliasesAst) { throw 'Quick Find search aliases were not declared.' }
          Invoke-Expression $aliasesAst.Extent.Text
          $cases = @(
              @{ Query = 'wifi fix'; Label = 'Restart Wi-Fi Adapter'; Search = $searchAliasesByButton.btnResetWifi; Expected = $true },
              @{ Query = 'wifi fix'; Label = 'Suggested WiFi'; Search = 'wireless networking suggested networks'; Expected = $false },
              @{ Query = 'printer'; Label = 'Remove Print'; Search = $searchAliasesByButton.btnToggleRemovePrint; Expected = $true },
              @{ Query = 'app updates'; Label = 'Update All Apps'; Search = $searchAliasesByButton.btnWingetUpdateAll; Expected = $true },
              @{ Query = 'search packages'; Label = 'Search Winget Packages'; Search = $searchAliasesByButton.txtWingetSearch; Expected = $true },
              @{ Query = 'speed up pc'; Label = 'Optimize System Services'; Search = $searchAliasesByButton.btnSvcOptimize; Expected = $true },
              @{ Query = 'enable dark mode'; Label = 'Dark Mode'; Search = $searchAliasesByButton.btnToggleDarkMode; Expected = $true },
              @{ Query = 'windows update default'; Label = 'Windows Update Behavior'; Search = 'default security only disable all updates feature updates'; Expected = $true },
              @{ Query = 'windows update security only'; Label = 'Windows Update Behavior'; Search = 'default security only disable all updates feature updates'; Expected = $true },
              @{ Query = 'disable windows update'; Label = 'Windows Update Behavior'; Search = 'default security only disable all updates feature updates'; Expected = $true },
              @{ Query = 'hide file extensions'; Label = 'File Extensions'; Search = 'hide show file extension extensions filename suffix known file types'; Expected = $true },
              @{ Query = 'wifi printer'; Label = 'Restart Wi-Fi Adapter'; Search = $searchAliasesByButton.btnResetWifi; Expected = $false }
          )
          foreach ($case in $cases) {
              $rank = Get-WmtQuickFindMatchRank $case.Query $case.Label ("$($case.Label) $($case.Search)")
              $matched = $rank -ge 0
              if ($matched -ne [bool]$case.Expected) {
                  throw "Quick Find mismatch for '$($case.Query)' against '$($case.Label)' (rank $rank)."
              }
          }
          Write-Host "Quick Find natural-language checks passed ($($cases.Count) cases)."

      - name: Smoke test tweak-state snapshot validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null; $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path '.\\WMT-GUI.ps1').Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'WMT must parse before snapshot validation tests.' }
          $functionAst = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $node.Name -eq 'Start-TweakButtonStatesBackgroundUpdate'
          }, $true)
          if (-not $functionAst) { throw 'Tweak-state preload function is missing.' }
          $validationIfs = $functionAst.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.IfStatementAst] -and
                  $node.Clauses.Count -gt 0 -and
                  $node.Clauses[0].Item1.Extent.Text -match '\$result\.ExpectedPathChecks'
          }, $true)
          if ($validationIfs.Count -ne 1) { throw 'Could not find the tweak-state snapshot validation condition.' }
          $validationCondition = $validationIfs[0].Clauses[0].Item1.Extent.Text
          $pathChecks = @{}
          1..11 | ForEach-Object { $pathChecks["path$_"] = $true }
          $supportChecks = @{}
          1..6 | ForEach-Object { $supportChecks["support$_"] = $true }
          $result = @{
              RegCache = @{ 'test-path' = $true }
              PathChecks = $pathChecks
              NonRegData = @{ MMAgentMemoryCompression = $null }
              SupportChecks = $supportChecks
              ExpectedRegPaths = 1
              ExpectedPathChecks = 11
              ExpectedSupportChecks = 6
              RegistryReadErrors = @()
          }
          if (-not [bool](Invoke-Expression $validationCondition)) {
              throw 'A valid 11-path-check snapshot was rejected.'
          }
          $result.PathChecks.Remove('path11')
          if ([bool](Invoke-Expression $validationCondition)) {
              throw 'A snapshot missing a path check was accepted.'
          }
          Write-Host 'Tweak-state snapshot count validation passed.'

      - name: Smoke test optional feature startup and fail-closed safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          if ($source -match '; Update-SingleFeatureButtonState "btnFeat') {
              throw 'Startup again invokes individual optional-feature queries.'
          }
          function Find-FunctionText([string]$name) {
              $node = $ast.Find({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
              }, $true)
              if (-not $node) { throw "Missing function: $name" }
              return $node.Extent.Text
          }
          $single = Find-FunctionText 'Update-SingleFeatureButtonState'
          if ($single -match 'Get-WindowsOptionalFeature|Invoke-WmtCliText|Get-WindowsCapability') {
              throw 'Single-feature UI callback contains a blocking Windows component query.'
          }
          $toggle = Find-FunctionText 'Switch-WindowsFeature'
          if ($toggle -notmatch 'Cannot verify the current state of' -or
              $toggle -notmatch 'Unrecognized feature state' -or
              $toggle -notmatch 'OptionalFeatureProviderCache') {
              throw 'Feature toggle does not reject unverified states or providers.'
          }
          if ($toggle -match '(?s)\$done\s*=\s*\{.*?\}\.GetNewClosure\(\)') {
              throw 'Feature refresh callback uses GetNewClosure and loses main script scope.'
          }
          if ($toggle -notmatch 'Get-WindowsOptionalFeature -Online -FeatureName \$fn' -or
              $toggle -notmatch 'Get-WindowsCapability -Online -Name \$providerName') {
              throw 'Feature and capability toggles must recheck current state before changing it.'
          }
          $background = Find-FunctionText 'Start-OptionalFeaturesBackgroundCheck'
          if ($background -notmatch 'currentFeature' -or
              $background -notmatch 'ContainsKey\(\$currentFeature\)' -or
              $background -match '\(\?s\)Feature Name') {
              throw 'Bulk DISM fallback does not safely parse each feature block.'
          }
          if ($background -notmatch 'Get-WindowsOptionalFeature -Online -ErrorAction Stop' -or
              $background -notmatch 'Get-WindowsCapability -Online -ErrorAction Stop') {
              throw 'Optional feature/capability bulk scanning has regressed.'
          }
          if ($background -notmatch '\$states\.Count \+ \$unavailable\.Count' -or
              $background -notmatch 'OptionalFeaturesReady = \$true' -or
              $background -notmatch 'Sync-WmtOptionalFeatureButtons') {
              throw 'A partial optional-feature scan can be marked ready.'
          }
          if ($source -match 'function Update-OptionalFeaturesSynchronously' -or
              $source -match '(?m)^\s*Update-OptionalFeaturesSynchronously\s*$') {
              throw 'Optional features are still scanned synchronously on the WPF thread.'
          }
          $tweak = Find-FunctionText 'Start-TweakButtonStatesBackgroundUpdate'
          $renderer = Find-FunctionText 'Update-TweakButtonStates'
          # Inspect executable statements, not comments that describe removed fallbacks.
          $rendererStatements = (($renderer -split '\r?\n') |
              Where-Object { $_ -notmatch '^\s*#' }) -join [Environment]::NewLine
          if ($tweak -match 'Falling back to synchronous load' -or
              $rendererStatements -match 'Get-WmtRegistryKeyValuesCached|Get-Service\s|Get-ItemProperty\s|Get-WmtRegistryPathExists\s|Get-WmtRegValue\s|Get-MMAgent\s') {
              throw 'Tweak state application still reads OS state synchronously.'
          }
          if ($tweak -notmatch 'ExpectedRegPaths' -or
              $tweak -notmatch 'ExpectedPathChecks = \$pathChecks\.Count' -or
              $tweak -notmatch 'ExpectedSupportChecks = \$supportChecks\.Count' -or
              $tweak -notmatch '\$result\.PathChecks\.Count -eq \$result\.ExpectedPathChecks' -or
              $tweak -notmatch '\$result\.SupportChecks\.Count -eq \$result\.ExpectedSupportChecks' -or
              $tweak -match '\$result\.(?:PathChecks|SupportChecks)\.Count -eq \d+' -or
              $tweak -notmatch 'if \(\$key\) \{ \$key\.Dispose\(\) \}' -or
              $tweak -notmatch 'if \(\$baseKey\) \{ \$baseKey\.Dispose\(\) \}') {
              throw 'Tweak preload no longer validates snapshot counts dynamically or disposes registry handles.'
          }
          $cloudRegistryPreloads = @(($tweak -split '\r?\n') |
              Where-Object { $_ -match '^\s*"HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\CloudStore' -and
                  $_ -match 'bluelightreductionstate' })
          if ($cloudRegistryPreloads.Count -ne 1) {
              throw 'Night Light registry key is missing or loaded more than once.'
          }
          if ($renderer -match '(?m)^\s*(?:&\s*)?fsutil\s') {
              throw 'Tweak state application still launches fsutil on the WPF thread.'
          }
          $uiStart = $source.IndexOf('function Update-TweakButtonStates {')
          $uiEnd = $source.IndexOf('function ', $uiStart + 10)
          $workerStart = $source.IndexOf('function Start-TweakButtonStatesBackgroundUpdate {')
          $workerEnd = $source.IndexOf('$script:OptionalFeaturesMap = @', $workerStart)
          if ($uiStart -lt 0 -or $uiEnd -lt 0 -or $workerStart -lt 0 -or $workerEnd -lt 0) {
              throw 'Cannot locate tweak renderer or preload worker.'
          }
          $uiText = $source.Substring($uiStart, $uiEnd - $uiStart)
          $workerText = $source.Substring($workerStart, $workerEnd - $workerStart)
          $paths = [regex]::Matches($uiText, '["''](HK(?:CU|LM|CR|U):\\[^"''\r\n]*?)["'']') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($path in $paths) {
              if ($workerText.IndexOf($path, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
                  throw "UI tweak renderer references an uncached registry path: $path"
              }
          }
          if ($source -match '(?s)# 1b\..*?Initialize-WmtBackgroundRunspacePool\s*\r?\n' -or
