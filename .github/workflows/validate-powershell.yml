          Set-WmtCleanerRulesMemoryCacheEntry -Cache $ruleCache -Key 'new-signature' -Rules @([pscustomobject]@{ Name = 'new rules' })
          if ($ruleCache.Count -ne 1 -or -not $ruleCache.ContainsKey('new-signature') -or $ruleCache.ContainsKey('old-signature')) {
              throw 'Cleaner rule cache retained the previous definition snapshot.'
          }
          Set-WmtCleanerRulesMemoryCacheEntry -Cache $ruleCache -Key 'latest-signature' -Rules @([pscustomobject]@{ Name = 'latest rules' })
          if ($ruleCache.Count -ne 1 -or -not $ruleCache.ContainsKey('latest-signature') -or $ruleCache.ContainsKey('new-signature')) {
              throw 'Cleaner rule cache grew beyond one source signature.'
          }
          if ($source -match '\\$script:(?:CleanerMlRulesMemoryCache|Winapp2RulesMemoryCache|Winapp3RulesMemoryCache)\\[\\$memoryKey\\]\\s*=') {
              throw 'Cleaner rule memory cache once again retains unbounded historical signatures.'
          }
          Write-Host 'PASS: cleaner rule memory caches retain only the latest definition snapshot.'

          # Installer output must be streamed/bounded rather than retained in full.
          $pipCapture = Find-FunctionText 'Invoke-WmtPipDirect'
          if ($pipCapture -match '(?m)^\\s*\$outTask\s*=\s*\$proc\.StandardOutput\.ReadToEndAsync\(\)' -or
              $pipCapture -match '(?m)^\\s*\$errTask\s*=\s*\$proc\.StandardError\.ReadToEndAsync\(\)' -or
              $pipCapture -notmatch '\$maxOutputLines = 2000' -or
              $pipCapture -notmatch '\$maxOutputChars = 2 \* 1024 \* 1024' -or
              $pipCapture -notmatch 'ReadLineAsync\(\)') {
              throw 'Pip installer output can again accumulate unbounded stdout/stderr in memory.'
          }
          if ($source -notmatch '\$stderrCaptureLimit = 2 \* 1024 \* 1024' -or
              $source -notmatch '\$stderrOverflowWriter' -or
              $source -notmatch 'CLIXML decoding was skipped to avoid unbounded memory use') {
              throw 'Custom PowerShell installer stderr is no longer bounded/spooled.'
          }
          Write-Host 'PASS: pip and custom PowerShell installer output is bounded.'


          # Run the real pip process wrapper against a noisy child. Its in-memory
          # result must stay bounded while preserving the newest lines and summary.
          Invoke-Expression (Find-FunctionText 'Invoke-WmtPipDirect')
          $pipTestHost = Join-Path $PSHOME 'powershell.exe'
          if (-not (Test-Path -LiteralPath $pipTestHost -PathType Leaf)) {
              throw 'Cannot find Windows PowerShell for pip output smoke test.'
          }
          $pipOutputTest = Invoke-WmtPipDirect -PythonPath $pipTestHost -ArgumentList @(
              '-NoProfile', '-Command', '1..3000 | ForEach-Object { "LINE$_" }'
          ) -TimeoutSeconds 30
          $pipSummaryPresent = @($pipOutputTest.OutputLines | Where-Object { $_ -match 'Earlier pip output was omitted' }).Count -gt 0
          if ($pipOutputTest.ExitCode -ne 0 -or
              @($pipOutputTest.OutputLines).Count -gt 2000 -or
              -not ($pipOutputTest.OutputLines -contains 'LINE3000') -or
              -not $pipSummaryPresent) {
              throw "Pip output streaming/cap smoke test failed (exit=$($pipOutputTest.ExitCode), lines=$(@($pipOutputTest.OutputLines).Count))."
          }
          Write-Host 'PASS: noisy pip output is streamed and retained output is bounded.'

          Write-Host 'PASS: registry snapshots and UI cache lookups are safe.'

          # Exercise the actual My Device queue with an unavailable pool.
          # A failed attempt must retain the section and throttle UI-thread retries.
