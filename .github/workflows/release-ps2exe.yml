              version = $env:RELEASE_VERSION
              description = "All-in-one Windows maintenance, repair, cleanup, update, and tuning GUI."
              homepage = "https://github.com/$env:GITHUB_REPOSITORY"
              license = "MIT"
              architecture = @{
                  "64bit" = @{
                      url = $installerUrl
                      hash = $env:RELEASE_SHA256.ToLowerInvariant()
                  }
              }
              bin = @(
                  @("WindowsMaintenanceTool.exe", "wmt")
              )
              shortcuts = @(
                  @("WindowsMaintenanceTool.exe", "Windows Maintenance Tool")
              )
              checkver = "github"
              autoupdate = @{
                  architecture = @{
                      "64bit" = @{
